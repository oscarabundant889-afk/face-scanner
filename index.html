/* =========================================================
   API JSONP
   ========================================================= */

function apiRequest(
  action,
  params = {},
  timeoutMs = 30000
) {

  /*
     API READ:
     faces / photo / target
     boleh retry jika Apps Script sedang lambat/cold start.

     API WRITE:
     scan
     TIDAK retry otomatis supaya tidak berisiko
     melakukan scan dua kali.
  */

  const retryable =
    ["faces", "photo", "target"].includes(action);

  const maxAttempts =
    retryable ? 3 : 1;

  return new Promise(
    function(
      resolve,
      reject
    ) {

      let attempt = 0;

      function runAttempt() {

        attempt++;

        const callbackName =
          "FACE_CB_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2);

        const script =
          document.createElement(
            "script"
          );

        let finished =
          false;

        const thisTimeout =
          retryable
            ? Math.max(
                timeoutMs,
                45000
              )
            : timeoutMs;

        const timeout =
          setTimeout(
            function() {

              if (finished) {
                return;
              }

              finished =
                true;

              cleanup();

              if (
                retryable &&
                attempt < maxAttempts
              ) {

                setStatus(
                  "RETRYING FACE API " +
                  attempt +
                  "/" +
                  maxAttempts
                );

                setTimeout(
                  runAttempt,
                  1200
                );

                return;
              }

              reject(
                new Error(
                  "API TIMEOUT: " +
                  action
                )
              );

            },
            thisTimeout
          );


        window[callbackName] =
          function(data) {

            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();

            resolve(
              data
            );

          };


        script.onerror =
          function() {

            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();

            if (
              retryable &&
              attempt < maxAttempts
            ) {

              setStatus(
                "RECONNECTING FACE API " +
                attempt +
                "/" +
                maxAttempts
              );

              setTimeout(
                runAttempt,
                1200
              );

              return;
            }

            reject(
              new Error(
                "API CONNECTION ERROR: " +
                action
              )
            );

          };


        let url =
          API_URL +
          "?action=" +
          encodeURIComponent(
            action
          ) +
          "&callback=" +
          encodeURIComponent(
            callbackName
          ) +
          "&t=" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2);


        Object.keys(params)
          .forEach(
            function(key) {

              url +=
                "&" +
                encodeURIComponent(
                  key
                ) +
                "=" +
                encodeURIComponent(
                  params[key]
                );

            }
          );


        script.async =
          true;

        script.src =
          url;

        document.head.appendChild(
          script
        );


        function cleanup() {

          clearTimeout(
            timeout
          );

          try {

            delete window[
              callbackName
            ];

          } catch (e) {}


          script.remove();

        }

      }


      runAttempt();

    }
  );

}

/* =========================================================
   OPEN CACHE
   ========================================================= */

function openCache() {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const request =
        indexedDB.open(
          CACHE_DB_NAME,
          CACHE_DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                CACHE_STORE
              )
          ) {

            db.createObjectStore(
              CACHE_STORE,
              {
                keyPath:
                  "employeeId"
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error ||
            new Error(
              "CACHE OPEN ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================
   GET CACHE
   ========================================================= */

async function getCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readonly"
        );


      const request =
        tx.objectStore(
          CACHE_STORE
        ).getAll();


      request.onsuccess =
        function() {

          db.close();


          resolve(
            request.result ||
            []
          );

        };


      request.onerror =
        function() {

          db.close();


          reject(
            request.error ||
            new Error(
              "CACHE READ ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================
   SAVE CACHE
   ========================================================= */

async function saveCacheItems(
  items
) {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      const store =
        tx.objectStore(
          CACHE_STORE
        );


      items.forEach(
        function(item) {

          store.put(
            item
          );

        }
      );


      tx.oncomplete =
        function() {

          db.close();


          resolve();

        };


      tx.onerror =
        function() {

          db.close();


          reject(
            tx.error ||
            new Error(
              "CACHE SAVE ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================
   CLEAR CACHE
   ========================================================= */

async function clearCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      tx.objectStore(
        CACHE_STORE
      ).clear();


      tx.oncomplete =
        function() {

          db.close();


          resolve();

        };


      tx.onerror =
        function() {

          db.close();


          reject(
            tx.error ||
            new Error(
              "CACHE CLEAR ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================
   SIGNATURE
   ========================================================= */

function makeSignature(
  list
) {

  return list
    .map(
      function(item) {

        return (

          String(
            item.employeeId ||
            ""
          ).trim() +

          "|" +

          String(
            item.name ||
            ""
          ).trim() +

          "|" +

          String(
            item.row ||
            ""
          )

        );

      }
    )
    .join(
      "||"
    );

}


function getSignature() {

  try {

    return (
      localStorage.getItem(
        CACHE_SIGNATURE
      ) ||
      ""
    );

  } catch (e) {

    return "";

  }

}


function setSignature(
  value
) {

  try {

    localStorage.setItem(
      CACHE_SIGNATURE,
      value
    );

  } catch (e) {}

}


/* =========================================================
   BUILD MATCHER
   ========================================================= */

function buildMatcher(
  cached
) {

  const labeled =
    [];


  cached.forEach(
    function(item) {

      try {

        if (
          !item.employeeId ||
          !Array.isArray(
            item.descriptor
          ) ||
          item.descriptor.length !==
            128
        ) {

          return;

        }


        labeled.push(

          new faceapi
            .LabeledFaceDescriptors(

              String(
                item.employeeId
              ),

              [
                new Float32Array(
                  item.descriptor
                )
              ]

            )

        );

      } catch (error) {

        console.error(
          "CACHE MATCHER ERROR:",
          item.employeeId,
          error
        );

      }

    }
  );


  if (
    !labeled.length
  ) {

    return null;

  }


  return new faceapi.FaceMatcher(
    labeled,
    MATCH_THRESHOLD
  );

}


/* =========================================================
   BUILD FACE CACHE
   ========================================================= */

async function buildFaceCache(
  list
) {

  const CONCURRENCY =
    5;


  let nextIndex =
    0;


  let completed =
    0;


  const descriptors =
    [];


  async function worker() {

    while (true) {

      const index =
        nextIndex++;


      if (
        index >=
        list.length
      ) {

        return;

      }


      const employee =
        list[index];


      const employeeId =
        String(
          employee.employeeId ||
          ""
        ).trim();


      const employeeName =
        String(
          employee.name ||
          ""
        ).trim();


      try {

        const photo =
          await getFacePhoto(
            employee.row
          );


        if (
          photo &&
          photo.ok &&
          photo.image
        ) {

          const image =
            await faceapi.fetchImage(
              photo.image
            );


          const detection =
            await faceapi

              .detectSingleFace(

                image,

                new faceapi
                  .TinyFaceDetectorOptions({

                    inputSize:
                      DETECTOR_INPUT_SIZE,

                    scoreThreshold:
                      0.5

                  })

              )

              .withFaceLandmarks(
                true
              )

              .withFaceDescriptor();


          if (
            detection
          ) {

            descriptors.push({

              employeeId:
                employeeId,

              name:
                employeeName,

              descriptor:
                Array.from(
                  detection.descriptor
                )

            });

          }

        }


      } catch (error) {

        console.error(
          "PHOTO PROCESS ERROR:",
          employeeId,
          error
        );

      }


      completed++;


      databaseInfo.innerText =
        "PROCESSING FACE " +
        completed +
        "/" +
        list.length;

    }

  }


  const workers =
    [];


  const workerCount =
    Math.min(
      CONCURRENCY,
      list.length
    );


  for (
    let i = 0;
    i < workerCount;
    i++
  ) {

    workers.push(
      worker()
    );

  }


  await Promise.all(
    workers
  );


  if (
    descriptors.length ===
    0
  ) {

    throw new Error(
      "NO FACE DESCRIPTOR FOUND"
    );

  }


  setStatus(
    "SAVING FACE CACHE..."
  );


  await clearCache();


  for (
    let i = 0;
    i < descriptors.length;
    i += 20
  ) {

    await saveCacheItems(
      descriptors.slice(
        i,
        i + 20
      )
    );

  }


  setSignature(
    makeSignature(
      list
    )
  );


  faceMatcher =
    buildMatcher(
      descriptors
    );


  if (
    !faceMatcher
  ) {

    throw new Error(
      "FACE CACHE FAILED"
    );

  }


  databaseLoaded =
    true;


  databaseInfo.innerText =
    "FACE READY: " +
    descriptors.length +
    " / " +
    list.length +
    " EMPLOYEE";

}


/* =========================================================
   LOAD DATABASE ONCE PER PAGE SESSION

   Saat halaman dibuka/di-refresh, database dibaca sekali.
   Setelah FACE SYSTEM READY, target scan tidak memanggil
   faces lagi. Selama halaman tetap terbuka 24 jam,
   descriptor yang sudah ada dipakai terus dari memory/cache.
   Jika ada karyawan/foto baru, refresh halaman secara manual.
   ========================================================= */

async function loadDatabaseOnce() {

  if (
    databaseLoaded
  ) {

    return;

  }


  setStatus(
    "LOADING FACE DATABASE..."
  );


  /*
     Ambil daftar employee
     dari FACE DATABASE.
  */

  const data =
    await getFaceDatabase();


  if (
    !data ||
    !data.ok
  ) {

    throw new Error(

      data &&
      (
        data.message ||
        data.error
      )

        ? (
            data.message ||
            data.error
          )

        : "FACE DATABASE ERROR"

    );

  }


  employees =
    Array.isArray(
      data.faces
    )
      ? data.faces
      : [];


  if (
    employees.length ===
    0
  ) {

    throw new Error(
      "NO EMPLOYEE PHOTO FOUND"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  /*
     Cek apakah descriptor
     sudah tersimpan.
  */

  const signature =
    makeSignature(
      employees
    );


  const oldSignature =
    getSignature();


  const cached =
    await getCache();


  /*
     CACHE MASIH VALID
  */

  if (

    oldSignature ===
      signature &&

    cached.length >
      0

  ) {

    faceMatcher =
      buildMatcher(
        cached
      );


    if (
      faceMatcher
    ) {

      databaseLoaded =
        true;


      databaseInfo.innerText =
        "FACE CACHE READY: " +
        cached.length +
        " / " +
        employees.length +
        " EMPLOYEE";


      return;

    }

  }


  /*
     CACHE BELUM ADA.
     Foto diproses sekali.
  */

  await loadModels();


  await buildFaceCache(
    employees
  );

}


/* =========================================================
   PRELOAD FACE SYSTEM
   ========================================================= */

async function preloadFaceSystem() {

  if (
    preloadPromise
  ) {

    return preloadPromise;

  }


  preloadPromise =
    (async function() {

      try {

        /*
           1. AMBIL DATABASE
        */

        await loadDatabaseOnce();


        /*
           2. MODEL

           Kalau database belum punya
           cache, loadDatabaseOnce()
           sudah load model.

           Kalau cache sudah ada,
           model perlu tetap di-load
           sebelum membuat matcher.
        */

        await loadModels();


        /*
           3. Pastikan database
              benar-benar siap.
        */

        if (
          !databaseLoaded
        ) {

          await loadDatabaseOnce();

        }


        /*
           4. READY
        */

        setStatus(
          "FACE SYSTEM READY"
        );


        /*
           Baru setelah face system
           siap, mulai cek target.
        */

        startTargetMonitor();

      } catch (error) {

        preloadPromise =
          null;


        console.error(
          "INITIAL LOAD ERROR:",
          error
        );


        setStatus(
          "FACE SYSTEM ERROR"
        );


        resultBox.innerText =
          error.message ||
          "FACE SYSTEM ERROR";

      }

    })();


  return preloadPromise;

}


/* =========================================================
   COLUMN NUMBER → LETTER
   ========================================================= */

function columnToLetter(
  column
) {

  let letter =
    "";


  while (
    column > 0
  ) {

    const temp =
      (column - 1) % 26;


    letter =
      String.fromCharCode(
        temp + 65
      ) +
      letter;


    column =
      Math.floor(
        (column - temp - 1) /
        26
      );

  }


  return letter;

}


/* =========================================================
   TIME
   ========================================================= */

function timeToMinutes(
  value
) {

  if (!value) {
    return null;
  }


  const parts =
    String(
      value
    )
      .trim()
      .split(
        /[:\/]/
      );


  if (
    parts.length <
    2
  ) {

    return null;

  }


  const hour =
    Number(
      parts[0]
    );


  const minute =
    Number(
      parts[1]
    );


  if (

    !Number.isFinite(
      hour
    ) ||

    !Number.isFinite(
      minute
    ) ||

    hour < 0 ||

    hour > 23 ||

    minute < 0 ||

    minute > 59

  ) {

    return null;

  }


  return (
    hour * 60 +
    minute
  );

}


/* =========================================================
   TIME GAP
   ========================================================= */


function validateTimeGap(
  target,
  checklist
) {

  if (!checklist) {
    return {
      ok: true
    };
  }


  const column =
    Number(
      target.column
    );


  /*
     E  → C
     X  → V
     AI → AG

     Hanya Time In yang dicek.
  */

  if (
    ![5, 24, 35].includes(
      column
    )
  ) {

    return {
      ok: true
    };

  }


  /*
     Ambil TIME OUT dari:

     E → C
     X → V
     AI → AG

     BUKAN System Time Out D/W/AH.
  */

  const timeOut =
    checklist.timeOut;


  /*
     Kalau Time Out belum ada,
     langsung boleh lanjut.
  */

  if (
    !timeOut ||
    timeOut === "NOT YET"
  ) {

    return {
      ok: true
    };

  }


  const outMinutes =
    timeToMinutes(
      timeOut
    );


  if (
    outMinutes === null
  ) {

    return {
      ok: true
    };

  }


  /*
     Waktu sekarang
  */

  const now =
    new Date();


  const nowMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  /*
     Hitung selisih.
     Mendukung lewat tengah malam.
  */

  let difference =
    nowMinutes -
    outMinutes;


  if (
    difference < 0
  ) {

    difference +=
      24 * 60;

  }


  /*
     SELISIH 1 MENIT ATAU KURANG
     → TIDAK BOLEH SCAN
  */

  if (
    difference <= 1
  ) {

    return {

      ok: false,

      message:
        "TIME IN NOT ALLOWED\n\n" +
        "Time In must be more than 1 minute after Time Out."

    };

  }


  /*
     Lebih dari 1 menit
     → BOLEH SCAN
  */

  return {
    ok: true
  };

}

  try {

      await getCurrentTarget();

    }

if (

) {

  */

  /*

}
    


    const column =

      ];


    if (

    ) {

    const newKey =

    const oldKey =

        ? currentTarget.sheet +
          "|" +
          currentTarget.row +

    /*

    if (

      if (!sameValidation.ok) {

    }

    stableCount =

    lastEmployee =

    currentTarget = {

    );


    /*

      );

    ) {

      );


      setStatus(

      );


      stopCamera();

    }


    /*

  } catch (error) {

    );

  }

/* =========================================================
   START CAMERA
   ========================================================= */


async function startCamera() {

  if (scanning) {
    return;
  }

  /*
     FACE SYSTEM MUST BE READY
  */

  if (
    !modelsLoaded ||
    !databaseLoaded ||
    !faceMatcher
  ) {

    showWarning(
      "FACE SYSTEM NOT READY"
    );

    return;
  }

  try {

    /*
       REQUEST CAMERA ONLY ONCE

       After permission is granted,
       the same camera stream will be reused.
    */

    if (!cameraStream) {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            width: {
              ideal: CAMERA_WIDTH
            },

            height: {
              ideal: CAMERA_HEIGHT
            },

            facingMode: "user"

          },

          audio: false

        });

    }

    /*
       Re-enable existing camera track.
    */

    cameraStream
      .getVideoTracks()
      .forEach(function(track) {

        track.enabled = true;

      });

    video.srcObject =
      cameraStream;

    await video.play();

    cameraBox.classList.add(
      "active"
    );

    scanning =
      true;

    scanLocked =
      false;

    stableCount =
      0;

    lastEmployee =
      "";

    setStatus(
      "CAMERA READY"
    );

    resultBox.innerText =
      "LOOK AT THE CAMERA";

    startScanLoop();

  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );

    scanning =
      false;

    setStatus(
      "CAMERA ERROR"
    );

    resultBox.innerText =
      "PLEASE ALLOW CAMERA ACCESS";

  }

}

  

/* =========================================================
   SCAN LOOP
   ========================================================= */

function startScanLoop() {

  if (
    scanTimer
  ) {

    return;

  }


  scanTimer =
    setInterval(
      scanFace,
      SCAN_INTERVAL
    );


  /*
     Scan langsung.
  */

  scanFace();

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  scanning =
    false;


  scanLocked =
    false;


  stableCount =
    0;


  lastEmployee =
    "";


  if (
    scanTimer
  ) {

    clearInterval(
      scanTimer
    );


    scanTimer =
      null;

  }


  if (
    cameraStream
  ) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    cameraStream =
      null;

  }


  video.srcObject =
    null;


  cameraBox.classList.remove(
    "active"
  );

}


/* =========================================================
   FIND CENTER FACE
   ========================================================= */

function findCenterFace(
  detections
) {

  if (
    !detections ||
    !detections.length
  ) {

    return null;

  }


  const width =
    video.videoWidth ||
    CAMERA_WIDTH;


  const height =
    video.videoHeight ||
    CAMERA_HEIGHT;


  const centerX =
    width / 2;


  const centerY =
    height / 2;


  let bestFace =
    null;


  let bestDistance =
    Infinity;


  detections.forEach(
    function(detection) {

      const box =
        detection.detection.box;


      const faceX =
        box.x +
        box.width / 2;


      const faceY =
        box.y +
        box.height / 2;


      const distance =
        Math.hypot(

          faceX -
            centerX,

          faceY -
            centerY

        );


      if (
        distance <
        bestDistance
      ) {

        bestDistance =
          distance;


        bestFace =
          detection;

      }

    }
  );


  if (
    !bestFace
  ) {

    return null;

  }


  /*
     Cek apakah wajah cukup dekat
     dengan tengah.
  */

  const box =
    bestFace.detection.box;


  const faceX =
    box.x +
    box.width / 2;


  const faceY =
    box.y +
    box.height / 2;


  const normalizedX =
    Math.abs(
      faceX -
      centerX
    ) /
    width;


  const normalizedY =
    Math.abs(
      faceY -
      centerY
    ) /
    height;


  if (

    normalizedX >
      CENTER_TOLERANCE ||

    normalizedY >
      CENTER_TOLERANCE

  ) {

    return null;

  }


  return bestFace;

}


/* =========================================================
   SCAN FACE
   ========================================================= */

async function scanFace() {

  if (
    !scanning ||
    scanLocked ||
    scanProcessing ||
    !faceMatcher
  ) {
    return;
  }

  scanProcessing = true;

  try {

  if (

    video.readyState <
      2 ||

    !video.videoWidth ||

    !video.videoHeight

  ) {

    return;

  }


    /*
       DETECT SEMUA WAJAH
    */

    const detections =
      await faceapi

        .detectAllFaces(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize:
                DETECTOR_INPUT_SIZE,

              scoreThreshold:
                0.5

            })

        )

        .withFaceLandmarks(
          true
        )

        .withFaceDescriptors();


    if (
      !detections.length
    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        "NO FACE DETECTED";


      distanceBox.innerText =
        "";


      return;

    }


    /*
       Kalau lebih dari satu orang,
       ambil yang paling dekat tengah.
    */

    const centerFace =
      findCenterFace(
        detections
      );


    if (
      !centerFace
    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        detections.length > 1

          ? "CENTER FACE ONLY"

          : "MOVE FACE TO CENTER";


      distanceBox.innerText =
        "";


      return;

    }


    /*
       MATCH
    */

    const match =
      faceMatcher.findBestMatch(
        centerFace.descriptor
      );


    const employeeId =
      String(
        match.label ||
        ""
      ).trim();


    const distance =
      Number(
        match.distance
      );


    distanceBox.innerText =
      "MATCH: " +
      employeeId +
      " | DIST: " +
      distance.toFixed(
        3
      );


    /*
       Tidak dikenal
    */

    if (

      !employeeId ||

      employeeId ===
        "unknown" ||

      distance >
        MATCH_THRESHOLD

    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        "FACE NOT RECOGNIZED";


      return;

    }


    /*
       Cari nama
    */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ).trim() ===
            employeeId;

        }
      );


    const employeeName =
      employee

        ? String(
            employee.name ||
            ""
          ).trim()

        : "";


    /*
       STABLE MATCH
    */

    if (
      lastEmployee ===
      employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;


      stableCount =
        1;

    }


    resultBox.innerText =
      "MATCH FOUND: " +
      employeeId +
      " " +
      employeeName +
      "\n" +
      "STABLE: " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH;


    if (
      stableCount <
      REQUIRED_STABLE_MATCH
    ) {

      return;

    }


    /*
       LOCK
    */

    scanLocked =
      true;


    setStatus(
      "PROCESSING..."
    );


    resultBox.innerText =
      "PROCESSING\n" +
      employeeId +
      " " +
      employeeName;


    /*
       SEND TO GOOGLE SHEETS
    */

    const response =
      await sendScanToSheet(

        employeeId,

        employeeName

      );


    /*
       GAGAL
    */

    if (

      !response ||
      !response.ok

    ) {

      scanLocked =
        false;


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "SCAN FAILED"
      );


      resultBox.innerText =

        response &&
        (
          response.message ||
          response.error
        )

          ? (
              response.message ||
              response.error
            )

          : "SCAN FAILED";


      return;

    }


    /*
       SUCCESS
    */

    setStatus(
      "SCAN SUCCESS"
    );


    resultBox.innerText =
      "SUCCESS\n" +
      employeeId +
      " " +
      employeeName;


    /*
       CAMERA OFF OTOMATIS
    */

    stopCamera();


    /*
       TARGET LAMA SELESAI
    */

    currentTarget =
      null;


    targetInfo.innerText =
      "WAITING FOR TARGET";


    /*
       Bersihkan tulisan SUCCESS
       setelah 1.8 detik.
    */

    setTimeout(
      function() {

        resultBox.innerText =
          "";

      },
      1800
    );


  } catch (error) {

    console.error(
      "SCAN ERROR:",
      error
    );


    stableCount =
      0;


    lastEmployee =
      "";


    resultBox.innerText =
      "SCAN ERROR";

  } finally {

    scanProcessing = false;

  }

}

    /*

       DATABASE
       ↓

    */

    preloadFaceSystem();

  }
);

    stopCamera();

  }
);

document.addEventListener(

    if (
      document.hidden
    ) {

      stopCamera();

    }

  }
);
