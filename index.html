<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 25px 0 20px 0;
  font-size: 40px;
}

#cameraBox {
  width: 90%;
  max-width: 900px;
  margin: auto;
  background: #222;
  border-radius: 15px;
  overflow: hidden;
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#video {
  width: 100%;
  display: none;
  transform: scaleX(-1);
}

#placeholder {
  font-size: 30px;
  color: #aaa;
  padding: 100px 20px;
}

#status {
  margin-top: 25px;
  font-size: 28px;
  font-weight: bold;
}

#result {
  margin-top: 15px;
  font-size: 38px;
  font-weight: bold;
  min-height: 50px;
}

#distance {
  margin-top: 10px;
  font-size: 18px;
  color: #aaa;
}

#databaseInfo {
  margin-top: 15px;
  font-size: 18px;
  color: #aaa;
}

button {
  margin-top: 25px;
  padding: 16px 35px;
  font-size: 22px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>

</head>


<body>

<h1>FACE SCANNER</h1>


<div id="cameraBox">

  <div id="placeholder">
    CAMERA READY
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

</div>


<div id="status">
  READY
</div>


<div id="result">
</div>


<div id="distance">
</div>


<div id="databaseInfo">
</div>


<button id="startButton" onclick="startCamera()">
  START CAMERA
</button>

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzCtKYN4mfelCDJWXK5c3GUUompPX4Esl8TdLjOlqXYpSjX8dfLdh6sjgMTGTpzaY_mMg/exec";


const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


const MATCH_THRESHOLD = 0.50;


const REQUIRED_STABLE_MATCH = 3;


/* =====================================================
   ELEMENT
===================================================== */

const video =
document.getElementById("video");


const placeholder =
document.getElementById("placeholder");


const statusBox =
document.getElementById("status");


const resultBox =
document.getElementById("result");


const distanceBox =
document.getElementById("distance");


const databaseInfo =
document.getElementById("databaseInfo");


const startButton =
document.getElementById("startButton");


/* =====================================================
   VARIABLES
===================================================== */

let faceMatcher = null;

let employees = [];

let cameraStream = null;

let scanning = false;

let lastEmployee = "";

let stableCount = 0;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.innerText = message;

}


/* =====================================================
   GET DATABASE
   JSONP
===================================================== */

function getFaceDatabase() {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_DATABASE_CALLBACK_" +
      Date.now();


    const script =
      document.createElement("script");


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "FACE API TIMEOUT"
          )
        );

      }, 30000);


    window[callbackName] =
      function(data) {

        cleanup();

        if (!data) {

          reject(
            new Error(
              "FACE API TIDAK MEMBERIKAN DATA"
            )
          );

          return;
        }


        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "FACE API CONNECTION ERROR"
          )
        );

      };


    script.src =
      API_URL +
      "?action=faces" +
      "&callback=" +
      callbackName +
      "&t=" +
      Date.now();


    document.body.appendChild(
      script
    );


    function cleanup() {

      clearTimeout(timeout);


      try {

        delete window[callbackName];

      } catch (e) {}


      if (script) {

        script.remove();

      }

    }

  });

}


/* =====================================================
   LOAD FACE MODELS
===================================================== */

async function loadModels() {

  setStatus(
    "LOADING FACE MODEL..."
  );


  console.log(
    "Loading Tiny Face Detector..."
  );


  await faceapi.nets.tinyFaceDetector.loadFromUri(
    MODEL_URL
  );


  console.log(
    "Loading Face Landmark..."
  );


  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
    MODEL_URL
  );


  console.log(
    "Loading Face Recognition..."
  );


  await faceapi.nets.faceRecognitionNet.loadFromUri(
    MODEL_URL
  );


  console.log(
    "ALL FACE MODELS READY"
  );

}


/* =====================================================
   LOAD PHOTO DATABASE
===================================================== */
async function loadDatabase() {

  setStatus(
    "LOADING PHOTO DATABASE..."
  );

  console.log(
    "REQUESTING FACE DATABASE..."
  );

  const data =
    await getFaceDatabase();

  console.log(
    "FACE DATABASE:",
    data
  );

  if (!data.ok) {

    throw new Error(
      data.message ||
      "FACE DATABASE ERROR"
    );

  }

  employees =
    Array.isArray(data.faces)
      ? data.faces
      : [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "TIDAK ADA FOTO EMPLOYEE"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  const labeledDescriptors = [];


  for (
    let i = 0;
    i < employees.length;
    i++
  ) {

    const employee =
      employees[i];


    const employeeId =
      String(
        employee.employeeId || ""
      ).trim();


    const employeeName =
      String(
        employee.name || ""
      ).trim();


    setStatus(
      "LOADING PHOTO " +
      (i + 1) +
      "/" +
      employees.length +
      " | " +
      employeeId +
      " - " +
      employeeName
    );


    console.log(
      "GET PHOTO:",
      employeeId,
      employeeName
    );


    try {

      const photo =
        await getFacePhoto(
          employee.row
        );


      if (!photo.ok) {

        console.warn(
          "PHOTO ERROR:",
          employeeId,
          photo.message
        );

        continue;

      }


      const image =
        await faceapi.fetchImage(
          photo.image
        );


      const detection =
        await faceapi
          .detectSingleFace(

            image,

            new faceapi.TinyFaceDetectorOptions({

              inputSize: 320,

              scoreThreshold: 0.5

            })

          )
          .withFaceLandmarks(true)
          .withFaceDescriptor();


      if (!detection) {

        console.warn(
          "FACE TIDAK DITEMUKAN:",
          employeeId,
          employeeName
        );

        continue;

      }


      labeledDescriptors.push(

        new faceapi.LabeledFaceDescriptors(

          employeeId,

          [
            detection.descriptor
          ]

        )

      );


      console.log(
        "FACE READY:",
        employeeId,
        employeeName
      );


    } catch (error) {

      console.error(
        "PHOTO PROCESS ERROR:",
        employeeId,
        error
      );

    }

  }


  if (
    labeledDescriptors.length === 0
  ) {

    throw new Error(
      "TIDAK ADA FOTO YANG BERHASIL DIPROSES"
    );

  }


  faceMatcher =
    new faceapi.FaceMatcher(

      labeledDescriptors,

      MATCH_THRESHOLD

    );


  databaseInfo.innerText =
    "FACE READY: " +
    labeledDescriptors.length +
    " EMPLOYEE";


  setStatus(
    "DATABASE READY"
  );


  console.log(
    "FACE DATABASE READY"
  );

}

      function getFacePhoto(row) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_PHOTO_CALLBACK_" +
      Date.now();


    const script =
      document.createElement("script");


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "PHOTO API TIMEOUT"
          )
        );

      }, 30000);


    window[callbackName] =
      function(data) {

        cleanup();

        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "PHOTO API CONNECTION ERROR"
          )
        );

      };


    script.src =
      API_URL +
      "?action=photo" +
      "&row=" +
      encodeURIComponent(row) +
      "&callback=" +
      callbackName +
      "&t=" +
      Date.now();


    document.body.appendChild(
      script
    );


    function cleanup() {

      clearTimeout(timeout);

      try {

        delete window[callbackName];

      } catch (e) {}

      script.remove();

    }

  });

}


     /* =====================================================
   SEND FACE RESULT TO GOOGLE SHEET
===================================================== */

function sendScanToSheet(employeeId, employeeName) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_SCAN_CALLBACK_" +
      Date.now();

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error("SCAN API TIMEOUT")
        );

      }, 15000);

    window[callbackName] =
      function(data) {

        cleanup();

        if (!data) {

          reject(
            new Error(
              "SCAN API TIDAK MEMBERIKAN DATA"
            )
          );

          return;

        }

        resolve(data);

      };

    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "SCAN API CONNECTION ERROR"
          )
        );

      };

    script.src =
      API_URL +
      "?action=scan" +
      "&employeeId=" +
      encodeURIComponent(employeeId) +
      "&employeeName=" +
      encodeURIComponent(employeeName) +
      "&callback=" +
      callbackName +
      "&t=" +
      Date.now();

    document.body.appendChild(script);

    function cleanup() {

      clearTimeout(timeout);

      try {

        delete window[callbackName];

      } catch (e) {}

      script.remove();

    }

  });

} 


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  try {

    setStatus("BUTTON CLICKED...");

    startButton.disabled = true;

    setStatus("LOADING FACE MODEL...");

    await loadModels();

    setStatus("LOADING FACE DATABASE...");

    await loadDatabase();

    setStatus("STARTING CAMERA...");

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning = true;

    setStatus("SCANNING...");

    scanFace();


  } catch (error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    setStatus(
      "ERROR"
    );


    resultBox.innerText =
      error.message ||
      "CAMERA ERROR";


    startButton.disabled =
      false;

  }

}


/* =====================================================
   FACE SCANNER
===================================================== */

async function scanFace() {

  if (!scanning) {
    return;
  }


  try {

    const detection =
      await faceapi
        .detectSingleFace(

          video,

          new faceapi.TinyFaceDetectorOptions({

            inputSize: 320,

            scoreThreshold: 0.5

          })

        )
        .withFaceLandmarks(true)
        .withFaceDescriptor();


    if (!detection) {

      resultBox.innerText =
        "NO FACE";

      distanceBox.innerText =
        "";

      lastEmployee =
        "";

      stableCount =
        0;

      setStatus(
        "SCANNING..."
      );

      setTimeout(
        scanFace,
        300
      );

      return;

    }


    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    const employeeId =
      bestMatch.label;


    const distance =
      bestMatch.distance;


    distanceBox.innerText =
      "DISTANCE: " +
      distance.toFixed(4);


    if (
      employeeId === "unknown"
    ) {

      resultBox.innerText =
        "UNKNOWN";

      lastEmployee =
        "";

      stableCount =
        0;

      setStatus(
        "FACE NOT MATCHED"
      );


      setTimeout(
        scanFace,
        300
      );

      return;

    }


    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ) === String(
            employeeId
          );

        }
      );


    const employeeName =
      employee
        ? employee.name
        : "";


    if (
      lastEmployee === employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;

      stableCount =
        1;

    }


    resultBox.innerText =
      employeeId +
      " - " +
      employeeName;


    setStatus(
      "MATCH " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH
    );

if (
  stableCount >=
  REQUIRED_STABLE_MATCH
) {

  setStatus(
    "FACE VERIFIED"
  );

  resultBox.innerText =
    "✓ " +
    employeeId +
    " - " +
    employeeName;

  try {

    const result =
      await sendScanToSheet(
        employeeId,
        employeeName
      );

    if (result.ok) {

      resultBox.innerText =
        "✓ " +
        employeeId +
        " - " +
        employeeName +
        "\nTIME IN: " +
        result.timeIn;

      setStatus(
        "SCAN SAVED"
      );

      console.log(
        "SCAN SAVED:",
        result
      );

    } else {

      setStatus(
        "SHEET ERROR"
      );

      resultBox.innerText =
        result.message;

    }

  } catch (error) {

    setStatus(
      "SCAN ERROR"
    );

    resultBox.innerText =
      error.message;

  }

  stableCount = 0;

  lastEmployee = "";

}
    
  } catch (error) {

    console.error(
      "SCAN ERROR:",
      error
    );

  }


  if (scanning) {

    setTimeout(
      scanFace,
      300
    );

  }

}



      
</script>

</body>

</html>
