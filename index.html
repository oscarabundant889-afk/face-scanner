/* =========================================================

/* =========================================================
   API JSONP
   ========================================================= */

function apiRequest(
  action,
  params = {},
  timeoutMs = 30000
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const callbackName =
        "FACE_CALLBACK_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();

            reject(
              new Error(
                "API TIMEOUT: " +
                action
              )
            );

          },
          timeoutMs
        );


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }

          finished =
            true;

          cleanup();

          resolve(data);

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished =
            true;

          cleanup();

          reject(
            new Error(
              "API CONNECTION ERROR: " +
              action
            )
          );

        };


      let url =
        API_URL +
        "?action=" +
        encodeURIComponent(
          action
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      Object.keys(params)
        .forEach(
          function(key) {

            url +=
              "&" +
              encodeURIComponent(
                key
              ) +
              "=" +
              encodeURIComponent(
                params[key]
              );

          }
        );


      url +=
        "&t=" +
        Date.now();


      script.src =
        url;


      document.body.appendChild(
        script
      );


      function cleanup() {

        clearTimeout(
          timeout
        );

        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

        script.remove();

      }

    }
  );

}


/* =========================================================
   INDEXED DB
   ========================================================= */

function openCache() {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const request =
        indexedDB.open(
          CACHE_DB_NAME,
          CACHE_DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                CACHE_STORE
              )
          ) {

            db.createObjectStore(
              CACHE_STORE,
              {
                keyPath:
                  "employeeId"
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   GET CACHE
   ========================================================= */

async function getCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readonly"
        );


      const store =
        tx.objectStore(
          CACHE_STORE
        );


      const request =
        store.getAll();


      request.onsuccess =
        function() {

          db.close();

          resolve(
            request.result ||
            []
          );

        };


      request.onerror =
        function() {

          db.close();

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   SAVE CACHE
   ========================================================= */

async function saveCacheItem(
  employeeId,
  name,
  descriptor
) {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      tx.objectStore(
        CACHE_STORE
      ).put({

        employeeId:
          String(
            employeeId
          ),

        name:
          String(
            name || ""
          ),

        descriptor:
          Array.from(
            descriptor
          )

      });


      tx.oncomplete =
        function() {

          db.close();

          resolve();

        };


      tx.onerror =
        function() {

          db.close();

          reject(
            tx.error
          );

        };

    }
  );

}


/* =========================================================
   CLEAR CACHE
   ========================================================= */

async function clearCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      tx.objectStore(
        CACHE_STORE
      ).clear();


      tx.oncomplete =
        function() {

          db.close();

          resolve();

        };


      tx.onerror =
        function() {

          db.close();

          reject(
            tx.error
          );

        };

    }
  );

}


/* =========================================================
   SIGNATURE
   ========================================================= */

function makeSignature(
  list
) {

  return list
    .map(
      function(item) {

        return (
          String(
            item.employeeId ||
            ""
          ) +
          "|" +
          String(
            item.name ||
            ""
          ) +
          "|" +
          String(
            item.row ||
            ""
          )
        );

      }
    )
    .join("||");

}


function getSignature() {

  try {

    return (
      localStorage.getItem(
        CACHE_SIGNATURE
      ) || ""
    );

  } catch (e) {

    return "";

  }

}


function setSignature(
  value
) {

  try {

    localStorage.setItem(
      CACHE_SIGNATURE,
      value
    );

  } catch (e) {}

}


/* =========================================================
   LOAD MODELS
   ========================================================= */

async function loadModels() {

  if (modelsLoaded) {
    return;
  }


  setStatus(
    "LOADING FACE MODEL..."
  );


  await faceapi.nets
    .tinyFaceDetector
    .loadFromUri(
      MODEL_URL
    );


  await faceapi.nets
    .faceLandmark68TinyNet
    .loadFromUri(
      MODEL_URL
    );


  await faceapi.nets
    .faceRecognitionNet
    .loadFromUri(
      MODEL_URL
    );


  modelsLoaded =
    true;

}


/* =========================================================
   GET FACE DATABASE
   ========================================================= */

async function getFaceDatabase() {

  return await apiRequest(
    "faces",
    {},
    30000

}


/* =========================================================
   GET PHOTO
   ========================================================= */

async function getFacePhoto(
  row
) {

  return await apiRequest(

      row:
        row
    },

/* =========================================================
   BUILD MATCHER
   ========================================================= */

function buildMatcher(
  cached
) {

  const labeled =
    [];


  cached.forEach(
    function(item) {

      try {

        labeled.push(

          new faceapi
            .LabeledFaceDescriptors(

              String(
                item.employeeId
              ),

              [

                new Float32Array(
                  item.descriptor
                )

              ]

            )

        );

      } catch (error) {

        console.error(
          "CACHE ERROR:",
          error
        );

      }

    }
  );


  if (
    labeled.length === 0
  ) {

    return null;

  }


  return new faceapi.FaceMatcher(
    labeled,
    MATCH_THRESHOLD
  );

}


/* =========================================================
   BUILD FACE CACHE
   ========================================================= */

async function buildFaceCache(
  list
) {

  const CONCURRENCY =
    8;


  let nextIndex =
    0;


  let completed =
    0;


  const descriptors =
    [];


  async function worker() {

    while (true) {

      const index =
        nextIndex++;


      if (
        index >=
        list.length
      ) {

        return;

      }


      const employee =
        list[index];


      const employeeId =
        String(
          employee.employeeId ||
          ""
        ).trim();


      const employeeName =
        String(
          employee.name ||
          ""
        ).trim();


      try {

        const photo =
          await getFacePhoto(
            employee.row
          );


        if (
          photo &&
          photo.ok &&
          photo.image
        ) {

          const image =
            await faceapi.fetchImage(
              photo.image
            );


          const detection =
            await faceapi
              .detectSingleFace(

                image,

                new faceapi
                  .TinyFaceDetectorOptions({

                    inputSize:
                      DETECTOR_INPUT_SIZE,

                    scoreThreshold:
                      0.5

                  })

              )
              .withFaceLandmarks(
                true
              )
              .withFaceDescriptor();


          if (detection) {

            descriptors.push({

              employeeId:
                employeeId,

              name:
                employeeName,

              descriptor:
                Array.from(
                  detection.descriptor
                )

            });

          }

        }

      } catch (error) {

        console.error(
          "PHOTO PROCESS ERROR:",
          employeeId,
          error
        );

      }


      completed++;


      setStatus(
        "PROCESSING FACE " +
        completed +
        "/" +
        list.length
      );

    }

  }


  const workers =
    [];


  const workerCount =
    Math.min(
      CONCURRENCY,
      list.length
    );


  for (
    let i = 0;
    i < workerCount;
    i++
  ) {

    workers.push(
      worker()
    );

  }


  await Promise.all(
    workers
  );


  if (
    descriptors.length === 0
  ) {

    throw new Error(
      "NO FACE DESCRIPTOR FOUND"
    );

  }


  setStatus(
    "SAVING FACE CACHE..."
  );


  await clearCache();


  for (
    let i = 0;
    i < descriptors.length;
    i += 20
  ) {

    const batch =
      descriptors.slice(
        i,
        i + 20
      );


    await Promise.all(

      batch.map(
        function(item) {

          return saveCacheItem(

            item.employeeId,

            item.name,

            item.descriptor

          );

        }
      )

    );

  }


  setSignature(
    makeSignature(
      list
    )
  );


  const cached =
    await getCache();


  faceMatcher =
    buildMatcher(
      cached
    );


  if (!faceMatcher) {

    throw new Error(
      "FACE CACHE FAILED"
    );

  }


  databaseLoaded =
    true;


  databaseInfo.innerText =
    "FACE READY: " +
    cached.length +
    " / " +
    list.length +
    " EMPLOYEE";


  setStatus(
    "FACE SYSTEM READY"
  );

}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadDatabase() {

  if (databaseLoaded) {
    return;
  }


  const data =
    await getFaceDatabase();


  if (
    !data ||
    !data.ok
  ) {

    throw new Error(

      data &&
      (
        data.message ||
        data.error
      )

        ?

        (
          data.message ||
          data.error
        )

        :

        "FACE DATABASE ERROR"

    );

  }


  employees =
    Array.isArray(
      data.faces
    )
      ?

      data.faces

      :

      [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "NO EMPLOYEE PHOTO FOUND"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  const signature =
    makeSignature(
      employees
    );


  const oldSignature =
    getSignature();


  const cached =
    await getCache();


  /*
   * CACHE VALID
   */

  if (
    oldSignature ===
      signature &&

    cached.length ===
      employees.length
  ) {

    faceMatcher =
      buildMatcher(
        cached
      );


    if (faceMatcher) {

      databaseLoaded =
        true;


      databaseInfo.innerText =
        "FACE CACHE READY: " +
        cached.length +
        " / " +
        employees.length +
        " EMPLOYEE";


      setStatus(
        "FACE SYSTEM READY"
      );


      return;

    }

  }


  /*
   * BUILD NEW CACHE
   */

  await buildFaceCache(
    employees
  );

}


/* =========================================================
   PRELOAD FACE SYSTEM
   ========================================================= */

async function preloadFaceSystem() {

  if (preloadPromise) {

    return preloadPromise;

  }


  preloadPromise =
    Promise.resolve()

      .then(
        async function() {

          /*
           * MODEL FIRST
           */

          await loadModels();


          /*
           * DATABASE SECOND
           */

          await loadDatabase();


          setStatus(
            "FACE SYSTEM READY"
          );

        }
      )

      .catch(
        function(error) {

          preloadPromise =
            null;


          console.error(
            "PRELOAD ERROR:",
            error
          );


          setStatus(
            "FACE SYSTEM ERROR"
          );


          resultBox.innerText =
            error.message ||
            "FACE SYSTEM ERROR";


          throw error;

        }
      );


  return preloadPromise;

}

/* =========================================================
   TIME PARSER
   ========================================================= */

function timeToMinutes(
  value
) {

  if (!value) {
    return null;
  }


  const text =
    String(
      value
    ).trim();


  const parts =
    text.split(
      /[:/]/
    );


  if (
    parts.length < 2
  ) {

    return null;

  }


  const hour =
    Number(
      parts[0]
    );


  const minute =
    Number(
      parts[1]
    );


  if (
    !Number.isFinite(
      hour
    ) ||

    !Number.isFinite(
      minute
    ) ||

    hour < 0 ||

    hour > 23 ||

    minute < 0 ||

    minute > 59
  ) {

    return null;

  }


  return (
    hour * 60 +
    minute
  );

}


/* =========================================================
   CHECK TIME GAP
   ========================================================= */

function validateTimeGap(
  target,
  checklist
) {

  if (!checklist) {

    return {
      ok: true
    };

  }


  const column =
    Number(
      target.column
    );


  /*
   * GROUP 1
   *
   * D → F
   */

  if (
    column === 5
  ) {

    const timeOut =
      checklist.systemTimeOut;


    if (
      timeOut &&
      timeOut !== "NOT YET"
    ) {

      const now =
        new Date();


      const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


      const outMinutes =
        timeToMinutes(
          timeOut
        );


      if (
        outMinutes !== null
      ) {

        let difference =
          currentMinutes -
          outMinutes;


        if (
          difference < 0
        ) {

          difference +=
            24 * 60;

        }


        /*
         * 1 menit atau kurang
         * TIDAK BOLEH
         */

        if (
          difference <= 1
        ) {

          return {

            ok: false,

            message:
              "TIME IN NOT ALLOWED\n\n" +
              "TIME OUT and TIME IN must be more than 1 minute apart."

          };

        }

      }

    }

  }


  /*
   * GROUP 2
   *
   * V → X
   */

  if (
    column === 24
  ) {

    const timeOut =
      checklist.timeOut;


    if (
      timeOut &&
      timeOut !== "NOT YET"
    ) {

      const now =
        new Date();


      const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


      const outMinutes =
        timeToMinutes(
          timeOut
        );


      if (
        outMinutes !== null
      ) {

        let difference =
          currentMinutes -
          outMinutes;


        if (
          difference < 0
        ) {

          difference +=
            24 * 60;

        }


        if (
          difference <= 1
        ) {

          return {

            ok: false,

            message:
              "TIME IN NOT ALLOWED\n\n" +
              "TIME OUT and TIME IN must be more than 1 minute apart."

          };

        }

      }

    }

  }


  /*
   * GROUP 3
   *
   * AG → AI
   */

  if (
    column === 35
  ) {

    const timeOut =
      checklist.timeOut;


    if (
      timeOut &&
      timeOut !== "NOT YET"
    ) {

      const now =
        new Date();


      const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


      const outMinutes =
        timeToMinutes(
          timeOut
        );


      if (
        outMinutes !== null
      ) {

        let difference =
          currentMinutes -
          outMinutes;


        if (
          difference < 0
        ) {

          difference +=
            24 * 60;

        }


        if (
          difference <= 1
        ) {

          return {

            ok: false,

            message:
              "TIME IN NOT ALLOWED\n\n" +
              "TIME OUT and TIME IN must be more than 1 minute apart."

          };

        }

      }

    }

  }


  return {
    ok: true
  };

}


/* =========================================================
   PRE-SCAN VALIDATION
   ========================================================= */

function validateBeforeCamera(
  target,
  checklist
) {

  if (!target) {

    return {

      ok: false,

      message:
        "TARGET NOT READY"

    };

  }


  const column =
    Number(
      target.column
    );


  /*
   * E
   *
   * G REMARK REQUIRED
   */

  if (
    column === 5
  ) {

    const remark =
      checklist
        ?

        String(
          checklist.remark ||
          ""
        ).trim()

        :

        "";


    if (
      !remark ||
      remark === "NOT YET"
    ) {

      return {

        ok: false,

        message:
          "REMARK REQUIRED\n\n" +
          "Please enter Remark in column G before scanning Time In."

      };

    }

  }


  /*
   * AI
   *
   * AK REMARK REQUIRED
   */

  if (
    column === 35
  ) {

    const remark =
      checklist
        ?

        String(
          checklist.remark ||
          ""
        ).trim()

        :

        "";


    if (
      !remark ||
      remark === "NOT YET"
    ) {

      return {

        ok: false,

        message:
          "REMARK REQUIRED\n\n" +
          "Please enter Remark in column AK before scanning Time In."

      };

    }

  }


  /*
   * TIME GAP
   */

  const timeValidation =
    validateTimeGap(
      target,
      checklist
    );


  if (
    !timeValidation.ok
  ) {

    return timeValidation;

  }


  return {
    ok: true
  };

}


/* =========================================================
   TARGET MONITOR
   ========================================================= */

function startTargetMonitor() {

  checkTarget();


  setInterval(
    checkTarget,
    TARGET_CHECK_INTERVAL
  );

}


/* =========================================================

async function sendScanToSheet(
  employeeId,
  employeeName
) {

    "scan",

    {

      employeeId:
        employeeId,

      employeeName:

    },

  );

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  if (scanning) {
    return;
  }


  try {

    /*
     * MAKE SURE FACE SYSTEM
     * IS READY FIRST
     */

    await preloadFaceSystem();


    setStatus(
      "STARTING CAMERA..."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "BROWSER DOES NOT SUPPORT CAMERA"
      );

    }


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              "user",

            width: {

              ideal:
                CAMERA_WIDTH

            },

            height: {

              ideal:
                CAMERA_HEIGHT

            }

          },

          audio:
            false

        });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning =
      true;


    scanLocked =
      false;


    stableCount =
      0;


    lastEmployee =
      "";


    setStatus(
      "LOOK AT THE CAMERA"
    );


    scanFace();


  } catch (error) {

    scanning =
      false;


    setStatus(
      "CAMERA ERROR"
    );


    resultBox.innerText =
      error.message ||
      "CAMERA ERROR";


    console.error(
      "CAMERA ERROR:",
      error
    );

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  scanning =
    false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  cameraStream =
    null;


  video.srcObject =
    null;


  video.style.display =
    "none";


  placeholder.style.display =
    "block";


  placeholder.innerText =
    "WAITING FOR TARGET...";


  stableCount =
    0;


  lastEmployee =
    "";

}


/* =========================================================
   CHECK TARGET
   ========================================================= */

async function checkTarget() {

  if (targetChecking) {
    return;
  }


  targetChecking =
    true;


  try {

    const data =
      await getCurrentTarget();


    if (
      !data ||
      !data.ok
    ) {

      return;

    }


    if (
      data.checklist
    ) {

      updateChecklist(
        data.checklist
      );

    }


    /*
     * TARGET NOT READY
     */

    if (
      !data.ready
    ) {

      if (
        currentTarget &&
        data.sheet ===
          currentTarget.sheet &&

        Number(data.row) ===
          Number(currentTarget.row) &&

        Number(data.column) ===
          Number(currentTarget.column)
      ) {

        stopCamera();


        currentTarget =
          null;


        scanLocked =
          false;


        stableCount =
          0;


        lastEmployee =
          "";


        setStatus(
          "SCAN COMPLETED"
        );

      }


      return;

    }


    if (
      !data.sheet ||
      !data.row ||
      !data.column
    ) {

      return;

    }


    const allowed = [

      1,
      5,
      20,
      24,
      31,
      35

    ];


    if (
      allowed.indexOf(
        Number(
          data.column
        )
      ) === -1
    ) {

      return;

    }


    const newKey =
      data.sheet +
      "|" +
      data.row +
      "|" +
      data.column;


    const oldKey =
      currentTarget

        ?

        currentTarget.sheet +
        "|" +
        currentTarget.row +
        "|" +
        currentTarget.column

        :

        "";


    /*
     * NEW TARGET
     */

    if (
      newKey !==
      oldKey
    ) {

      if (scanning) {

        stopCamera();

      }


      scanLocked =
        false;


      stableCount =
        0;


      lastEmployee =
        "";


      currentTarget = {

        sheet:
          data.sheet,

        row:
          Number(
            data.row
          ),

        column:
          Number(
            data.column
          )

      };


      targetInfo.innerText =
        "TARGET: " +
        data.sheet +
        "!" +
        columnToLetter(
          Number(
            data.column
          )
        ) +
        data.row;


      resultBox.innerText =
        "";


      distanceBox.innerText =
        "";


      updateChecklist(
        data.checklist
      );


      /*
       * PRE-SCAN VALIDATION
       */

      const validation =
        validateBeforeCamera(
          currentTarget,
          data.checklist
        );


      if (
        !validation.ok
      ) {

        showWarning(
          validation.message
        );


        setStatus(
          "ACTION REQUIRED"
        );


        stopCamera();


        return;

      }


      /*
       * CAMERA AUTO START
       */

      await startCamera();

    }


  } catch (error) {

    console.log(
      "TARGET CHECK ERROR:",
      error.message
    );

  } finally {

    targetChecking =
      false;

  }

}


/* =========================================================
   FACE SCAN
   ========================================================= */

async function scanFace() {

  if (!scanning) {
    return;
  }


  if (!currentTarget) {

    stopCamera();

    return;

  }


  try {

    if (!faceMatcher) {

      setStatus(
        "FACE DATABASE NOT READY"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /*
     * DETECT ONE FACE
     */

    const detection =
      await faceapi
        .detectSingleFace(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize:
                DETECTOR_INPUT_SIZE,

              scoreThreshold:
                0.5

            })

        )
        .withFaceLandmarks(
          true
        )
        .withFaceDescriptor();


    /*
     * NO FACE
     */

    if (!detection) {

      resultBox.innerText =
        "LOOK AT THE CAMERA";


      distanceBox.innerText =
        "";


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "SCANNING..."
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /*
     * MATCH
     */

    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    const employeeId =
      bestMatch.label;


    const distance =
      bestMatch.distance;


    distanceBox.innerText =
      "DISTANCE: " +
      distance.toFixed(4);


    /*
     * NOT MATCHED
     */

    if (
      employeeId ===
      "unknown"
    ) {

      resultBox.innerText =
        "FACE NOT MATCHED";


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "FACE NOT MATCHED"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /*
     * FIND EMPLOYEE
     */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ) ===
          String(
            employeeId
          );

        }
      );


    const employeeName =
      employee
        ?
        employee.name
        :
        "";


    /*
     * STABLE MATCH
     */

    if (
      lastEmployee ===
      employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;

      stableCount =
        1;

    }


    resultBox.innerText =
      employeeId +
      " - " +
      employeeName;


    setStatus(
      "MATCH " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH
    );


    /*
     * VERIFIED
     */

    if (
      stableCount >=
        REQUIRED_STABLE_MATCH &&

      !scanLocked
    ) {

      scanLocked =
        true;


      const target =
        currentTarget;


      if (!target) {

        scanLocked =
          false;

        stopCamera();

        return;

      }


      /*
       * CHECK TARGET AGAIN
       */

      try {

        const latestTarget =
          await getCurrentTarget();


        if (
          !latestTarget ||
          !latestTarget.ready
        ) {

          scanLocked =
            false;


          showWarning(
            "TARGET NOT READY"
          );


          setStatus(
            "TARGET NOT READY"
          );


          stopCamera();


          currentTarget =
            null;


          return;

        }


        const latestChecklist =
          latestTarget.checklist;


        if (
          latestChecklist
        ) {

          updateChecklist(
            latestChecklist
          );

        }


        /*
         * VALIDATE AGAIN
         */

        const validation =
          validateBeforeCamera(
            target,
            latestChecklist
          );


        if (
          !validation.ok
        ) {

          scanLocked =
            false;


          showWarning(
            validation.message
          );


          setStatus(
            "ACTION REQUIRED"
          );


          stableCount =
            0;


          lastEmployee =
            "";


          /*
           * KEEP CAMERA ON
           * FOR 5 SECONDS
           */

          setTimeout(
            function() {

              if (scanning) {

                scanFace();

              }

            },
            WARNING_TIME
          );


          return;

        }


      } catch (validationError) {

        scanLocked =
          false;


        showWarning(
          "TARGET CHECK ERROR"
        );


        setStatus(
          "TARGET CHECK ERROR"
        );


        setTimeout(
          function() {

            if (scanning) {

              scanFace();

            }

          },
          WARNING_TIME
        );


        return;

      }


      setStatus(
        "FACE VERIFIED"
      );


      /*
       * SEND TO SHEET
       */

      try {

        const result =
          await sendScanToSheet(

            employeeId,

            employeeName

          );


        /*
         * UPDATE CHECKLIST
         */

        if (
          result &&
          result.checklist
        ) {

          updateChecklist(
            result.checklist
          );

        }


        /*
         * SUCCESS
         */

        if (
          result &&
          result.ok
        ) {

          const employeeColumns = [

            1,
            20,
            31

          ];


          const isEmployeeScan =
            employeeColumns.indexOf(
              Number(
                target.column
              )
            ) !== -1;


          if (
            isEmployeeScan
          ) {

            resultBox.innerText =
              "✓ EMPLOYEE SAVED\n" +
              employeeId +
              " - " +
              employeeName;


            setStatus(
              "EMPLOYEE SCAN COMPLETED"
            );

          } else {

            resultBox.innerText =
              "✓ TIME IN SAVED\n" +
              employeeName +
              "\n" +
              (
                result.timeIn ||
                ""
              );


            setStatus(
              "TIME IN COMPLETED"
            );

          }


          /*
           * CAMERA OFF
           */

          stopCamera();


          currentTarget =
            null;


          scanLocked =
            false;


          return;

        }


        /*
         * REJECTED
         */

        scanLocked =
          false;


        stableCount =
          0;


        lastEmployee =
          "";


        const rejectionMessage =
          result &&
          (
            result.message ||
            result.error
          )

            ?

            (
              result.message ||
              result.error
            )

            :

            "SCAN REJECTED";


        resultBox.innerText =
          rejectionMessage;


        showWarning(
          rejectionMessage
        );


        setStatus(
          "SCAN REJECTED"
        );


        /*
         * CAMERA STAYS ON
         * WARNING 5 SEC
         */

        setTimeout(
          function() {

            if (scanning) {

              scanFace();

            }

          },
          WARNING_TIME
        );


        return;


      } catch (error) {

        scanLocked =
          false;


        stableCount =
          0;


        lastEmployee =
          "";


        setStatus(
          "SCAN ERROR"
        );


        resultBox.innerText =
          error.message ||
          "SCAN ERROR";


        showWarning(
          error.message ||
          "SCAN ERROR"
        );


        setTimeout(
          function() {

            if (scanning) {

              scanFace();

            }

          },
          WARNING_TIME
        );


        return;

      }

    }


  } catch (error) {

    console.error(
      "FACE SCAN ERROR:",
      error
    );

  }


  if (scanning) {

    setTimeout(
      scanFace,
      SCAN_INTERVAL
    );

  }

}


/* =========================================================
   COLUMN NUMBER → LETTER
   ========================================================= */

function columnToLetter(
  column
) {

  let letter =
    "";


  while (
    column > 0
  ) {

    const temp =
      (column - 1) %
      26;


    letter =
      String.fromCharCode(
        temp + 65
      ) +
      letter;


    column =
      Math.floor(
        (column - temp - 1) /
        26
      );

  }


  return letter;

}
