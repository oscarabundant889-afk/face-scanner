<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 25px 0;
}

#cameraBox {
  width: 90%;
  max-width: 800px;
  margin: auto;
  background: #222;
  border-radius: 15px;
  overflow: hidden;
}

#video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

#status {
  margin: 20px;
  font-size: 24px;
  font-weight: bold;
}

#result {
  font-size: 32px;
  font-weight: bold;
  margin: 20px;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}

</style>

</head>


<body>

<h1>FACE SCANNER</h1>


<div id="cameraBox">

<video
id="video"
autoplay
muted
playsinline>
</video>

</div>


<div id="status">
LOADING...
</div>


<div id="result">
</div>


<button onclick="startCamera()">
START CAMERA
</button>


<script>

/* =========================================
   PENTING
   MASUKKAN URL WEB APP ANDA DI SINI
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbx3EErsXwz9mv52-YgaT3wkplnB21WvW47_MwHWANVYdBlgHeVMvqCfE5cDu96Myz6vUQ/exec";


const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


let video = null;

let faceMatcher = null;

let employees = [];


/* =========================================
   LOAD MODELS
========================================= */

async function loadModels() {

  document.getElementById("status").innerText =
    "LOADING FACE MODEL...";


  await faceapi.nets.tinyFaceDetector.loadFromUri(
    MODEL_URL
  );


  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
    MODEL_URL
  );


  await faceapi.nets.faceRecognitionNet.loadFromUri(
    MODEL_URL
  );


}


/* =========================================
   LOAD DATABASE
========================================= */

async function loadDatabase() {

  document.getElementById("status").innerText =
    "LOADING EMPLOYEE PHOTO DATABASE...";


  const response =
    await fetch(
      API_URL + "?action=faces"
    );


  const data =
    await response.json();


  console.log(data);


  if (!data.ok) {

    throw new Error(
      "DATABASE ERROR"
    );

  }


  employees =
    data.faces || [];


  if (employees.length === 0) {

    throw new Error(
      "TIDAK ADA FOTO EMPLOYEE"
    );

  }


  const labeledDescriptors = [];


  for (
    const employee of employees
  ) {

    try {

      /*
       * Convert Base64 → Image
       */

      const image =
        await faceapi.fetchImage(
          employee.image
        );


      /*
       * Detect face dari foto database
       */

      const detection =
        await faceapi
          .detectSingleFace(
            image,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks(true)
          .withFaceDescriptor();


      if (!detection) {

        console.log(
          "FACE TIDAK TERDETEKSI: " +
          employee.employeeId
        );

        continue;

      }


      labeledDescriptors.push(

        new faceapi.LabeledFaceDescriptors(

          employee.employeeId,

          [
            detection.descriptor
          ]

        )

      );


      console.log(
        "FACE DATABASE READY: " +
        employee.employeeId +
        " - " +
        employee.name
      );


    } catch (error) {

      console.error(
        "PHOTO ERROR: " +
        employee.employeeId,
        error
      );

    }

  }


  if (
    labeledDescriptors.length === 0
  ) {

    throw new Error(
      "TIDAK ADA FOTO YANG BERHASIL DIPROSES"
    );

  }


  /*
   * Threshold 0.50
   *
   * Semakin kecil =
   * semakin ketat.
   */

  faceMatcher =
    new faceapi.FaceMatcher(
      labeledDescriptors,
      0.50
    );


  document.getElementById("status").innerText =
    "DATABASE READY: " +
    labeledDescriptors.length +
    " EMPLOYEE";

}


/* =========================================
   START CAMERA
========================================= */

async function startCamera() {

  try {

    document.getElementById("status").innerText =
      "STARTING CAMERA...";


    /*
     * Load model
     */

    await loadModels();


    /*
     * Load photo database
     */

    await loadDatabase();


    /*
     * Start webcam
     */

    video =
      document.getElementById("video");


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    document.getElementById("status").innerText =
      "CAMERA READY - LOOK AT CAMERA";


    video.onloadedmetadata =
      function() {

        scanFace();

      };


  } catch (error) {

    console.error(error);


    document.getElementById("status").innerText =
      "ERROR";


    document.getElementById("result").innerText =
      error.message;

  }

}


/* =========================================
   FACE SCAN
========================================= */

let lastEmployee = "";

let stableCount = 0;


async function scanFace() {

  if (
    !video ||
    video.readyState < 2
  ) {

    requestAnimationFrame(
      scanFace
    );

    return;

  }


  try {

    const detection =
      await faceapi
        .detectSingleFace(

          video,

          new faceapi.TinyFaceDetectorOptions({

            inputSize: 320,

            scoreThreshold: 0.6

          })

        )
        .withFaceLandmarks(true)
        .withFaceDescriptor();


    /*
     * Tidak ada wajah
     */

    if (!detection) {

      stableCount = 0;

      lastEmployee = "";

      document.getElementById("status").innerText =
        "NO FACE DETECTED";

      document.getElementById("result").innerText =
        "";

      requestAnimationFrame(
        scanFace
      );

      return;

    }


    /*
     * Cari wajah paling mirip
     */

    const match =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    console.log(
      "MATCH:",
      match.label,
      "DISTANCE:",
      match.distance
    );


    /*
     * UNKNOWN
     */

    if (
      match.label === "unknown"
    ) {

      stableCount = 0;

      lastEmployee = "";

      document.getElementById("status").innerText =
        "FACE NOT RECOGNIZED";

      document.getElementById("result").innerText =
        "UNKNOWN";

      requestAnimationFrame(
        scanFace
      );

      return;

    }


    /*
     * Employee ditemukan
     */

    if (
      match.label === lastEmployee
    ) {

      stableCount++;

    } else {

      lastEmployee =
        match.label;

      stableCount = 1;

    }


    /*
     * Harus stabil beberapa frame
     */

    if (
      stableCount >= 3
    ) {

      const employee =
        employees.find(
          function(item) {

            return String(
              item.employeeId
            ) === String(
              match.label
            );

          }
        );


      document.getElementById("status").innerText =
        "✅ FACE MATCH";


      document.getElementById("result").innerText =
        employee
          ? employee.employeeId +
            " - " +
            employee.name
          : match.label;


    } else {

      document.getElementById("status").innerText =
        "MATCHING...";

    }


  } catch (error) {

    console.error(error);

  }


  requestAnimationFrame(
    scanFace
  );

}

</script>

</body>

</html>
