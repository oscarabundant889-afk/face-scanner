<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 25px 0 20px 0;
  font-size: 40px;
}

#cameraBox {
  width: 90%;
  max-width: 900px;
  margin: auto;
  background: #222;
  border-radius: 15px;
  overflow: hidden;
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#video {
  width: 100%;
  display: none;
  transform: scaleX(-1);
}

#placeholder {
  font-size: 30px;
  color: #aaa;
  padding: 100px 20px;
}

#status {
  margin-top: 25px;
  font-size: 28px;
  font-weight: bold;
}

#result {
  margin-top: 15px;
  font-size: 38px;
  font-weight: bold;
  min-height: 50px;
}

#distance {
  margin-top: 10px;
  font-size: 18px;
  color: #aaa;
}

#databaseInfo {
  margin-top: 15px;
  font-size: 18px;
  color: #aaa;
}

button {
  margin-top: 25px;
  padding: 16px 35px;
  font-size: 22px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>

</head>

<body>

<h1>FACE SCANNER</h1>

<div id="cameraBox">

  <div id="placeholder">
    CAMERA READY
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

</div>

<div id="status">
  READY
</div>

<div id="result">
</div>

<div id="distance">
</div>

<div id="databaseInfo">
</div>

<button id="startButton">
  START CAMERA
</button>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


const MATCH_THRESHOLD = 0.50;

const REQUIRED_STABLE_MATCH = 3;


/* =====================================================
   ELEMENT
===================================================== */

const video =
document.getElementById("video");

const placeholder =
document.getElementById("placeholder");

const statusBox =
document.getElementById("status");

const resultBox =
document.getElementById("result");

const distanceBox =
document.getElementById("distance");

const databaseInfo =
document.getElementById("databaseInfo");

const startButton =
document.getElementById("startButton");


/* =====================================================
   VARIABLES
===================================================== */

let faceMatcher = null;

let employees = [];

let cameraStream = null;

let scanning = false;

let lastEmployee = "";

let stableCount = 0;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.innerText = message;

}


/* =====================================================
   LOAD FACE MODELS
===================================================== */

async function loadModels() {

  setStatus("LOADING FACE MODEL...");

  console.log("Loading Tiny Face Detector...");

  await faceapi.nets.tinyFaceDetector.loadFromUri(
    MODEL_URL
  );

  console.log("Loading Face Landmark...");

  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
    MODEL_URL
  );

  console.log("Loading Face Recognition...");

  await faceapi.nets.faceRecognitionNet.loadFromUri(
    MODEL_URL
  );

  console.log("ALL FACE MODELS READY");

}


/* =====================================================
   LOAD DATABASE
===================================================== */

async function loadDatabase() {

  setStatus("LOADING PHOTO DATABASE...");

  /*
   * Database sementara.
   *
   * Nanti akan diisi dari database.js
   */

  if (
    typeof FACE_DATABASE === "undefined"
  ) {

    throw new Error(
      "DATABASE.JS BELUM ADA"
    );

  }


  employees =
    Array.isArray(FACE_DATABASE)
      ? FACE_DATABASE
      : [];


  console.log(
    "TOTAL DATABASE:",
    employees.length
  );


  if (
    employees.length === 0
  ) {

    throw new Error(
      "TIDAK ADA DATA EMPLOYEE"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  const labeledDescriptors = [];


  /* ===================================================
     PROCESS PHOTO
  =================================================== */

  for (
    let i = 0;
    i < employees.length;
    i++
  ) {

    const employee =
      employees[i];


    const employeeId =
      String(
        employee.employeeId || ""
      ).trim();


    const employeeName =
      String(
        employee.name || ""
      ).trim();


    setStatus(
      "PROCESSING " +
      (i + 1) +
      "/" +
      employees.length +
      " | " +
      employeeId +
      " - " +
      employeeName
    );


    console.log(
      "PROCESS PHOTO:",
      employeeId,
      employeeName
    );


    if (
      !employee.image
    ) {

      console.warn(
        "PHOTO KOSONG:",
        employeeId
      );

      continue;

    }


    try {

      const image =
        await faceapi.fetchImage(
          employee.image
        );


      const detection =
        await faceapi
          .detectSingleFace(
            image,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks(true)
          .withFaceDescriptor();


      if (
        !detection
      ) {

        console.warn(
          "FACE TIDAK DITEMUKAN:",
          employeeId,
          employeeName
        );

        continue;

      }


      labeledDescriptors.push(
        new faceapi.LabeledFaceDescriptors(
          employeeId,
          [
            detection.descriptor
          ]
        )
      );


      console.log(
        "FACE READY:",
        employeeId,
        employeeName
      );


    } catch (error) {

      console.error(
        "PHOTO ERROR:",
        employeeId,
        error
      );

    }

  }


  /* ===================================================
     CHECK
  =================================================== */

  if (
    labeledDescriptors.length === 0
  ) {

    throw new Error(
      "TIDAK ADA FOTO YANG BERHASIL DIPROSES"
    );

  }


  /* ===================================================
     FACE MATCHER
  =================================================== */

  faceMatcher =
    new faceapi.FaceMatcher(
      labeledDescriptors,
      MATCH_THRESHOLD
    );


  databaseInfo.innerText =
    "FACE READY: " +
    labeledDescriptors.length +
    " EMPLOYEE";


  setStatus(
    "DATABASE READY"
  );


  console.log(
    "FACE DATABASE READY"
  );

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  try {

    startButton.disabled = true;

    resultBox.innerText = "";

    distanceBox.innerText = "";


    /* STEP 1 */

    await loadModels();


    /* STEP 2 */

    await loadDatabase();


    /* STEP 3 */

    setStatus(
      "STARTING CAMERA..."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "BROWSER TIDAK MENDUKUNG CAMERA"
      );

    }


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning = true;


    setStatus(
      "CAMERA READY - LOOK AT CAMERA"
    );


    startButton.innerText =
      "CAMERA RUNNING";


    scanFace();


  } catch (error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    setStatus(
      "ERROR"
    );


    resultBox.innerText =
      error.message ||
      "UNKNOWN ERROR";


    startButton.disabled =
      false;

  }

}


/* =====================================================
   SCAN FACE
===================================================== */

async function scanFace() {

  if (!scanning) {
    return;
  }


  try {

    if (
      video.readyState < 2
    ) {

      requestAnimationFrame(
        scanFace
      );

      return;

    }


    const detection =
      await faceapi
        .detectSingleFace(

          video,

          new faceapi.TinyFaceDetectorOptions({

            inputSize: 320,

            scoreThreshold: 0.6

          })

        )
        .withFaceLandmarks(true)
        .withFaceDescriptor();


    /* NO FACE */

    if (!detection) {

      lastEmployee = "";

      stableCount = 0;

      setStatus(
        "NO FACE DETECTED"
      );

      resultBox.innerText = "";

      distanceBox.innerText = "";

      requestAnimationFrame(
        scanFace
      );

      return;

    }


    /* FIND MATCH */

    const match =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    console.log(
      "FACE MATCH:",
      match.label,
      "| DISTANCE:",
      match.distance
    );


    /* UNKNOWN */

    if (
      match.label === "unknown"
    ) {

      lastEmployee = "";

      stableCount = 0;

      setStatus(
        "FACE NOT RECOGNIZED"
      );

      resultBox.innerText =
        "UNKNOWN";

      distanceBox.innerText =
        "Distance: " +
        match.distance.toFixed(3);


      requestAnimationFrame(
        scanFace
      );

      return;

    }


    /* EMPLOYEE */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ).trim() ===
          String(
            match.label
          ).trim();

        }
      );


    if (!employee) {

      lastEmployee = "";

      stableCount = 0;

      setStatus(
        "EMPLOYEE DATABASE ERROR"
      );

      resultBox.innerText =
        match.label;


      requestAnimationFrame(
        scanFace
      );

      return;

    }


    /* STABLE MATCH */

    if (
      match.label === lastEmployee
    ) {

      stableCount++;

    } else {

      lastEmployee =
        match.label;

      stableCount = 1;

    }


    setStatus(
      "MATCHING..."
    );


    resultBox.innerText =
      employee.employeeId +
      " - " +
      employee.name;


    distanceBox.innerText =
      "Distance: " +
      match.distance.toFixed(3) +
      " | Stable: " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH;


    /* CONFIRMED */

    if (
      stableCount >=
      REQUIRED_STABLE_MATCH
    ) {

      setStatus(
        "✅ FACE MATCH"
      );


      resultBox.innerText =
        employee.employeeId +
        " - " +
        employee.name;


      distanceBox.innerText =
        "MATCH CONFIRMED | Distance: " +
        match.distance.toFixed(3);


      console.log(
        "FACE MATCH CONFIRMED:",
        employee.employeeId,
        employee.name,
        match.distance
      );


      stableCount =
        REQUIRED_STABLE_MATCH;

    }


  } catch (error) {

    console.error(
      "SCAN ERROR:",
      error
    );

  }


  requestAnimationFrame(
    scanFace
  );

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
  "click",
  startCamera
);

</script>

<!-- DATABASE -->
<script src="database.js"></script>

</body>
</html>
