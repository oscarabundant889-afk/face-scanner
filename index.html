/* =========================================================
   API JSONP
   ========================================================= */

function apiRequest(
  action,
  params = {},
  timeoutMs = 30000
) {

  /*
     API READ:
     faces / photo / target
     boleh retry jika Apps Script sedang lambat/cold start.

     API WRITE:
     scan
     TIDAK retry otomatis supaya tidak berisiko
     melakukan scan dua kali.
  */

  const retryable =
    ["faces", "photo", "target"].includes(action);

  const maxAttempts =
    retryable ? 3 : 1;

  return new Promise(
    function(
      resolve,
      reject
    ) {

      let attempt = 0;

      function runAttempt() {

        attempt++;

        const callbackName =
          "FACE_CB_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2);

        const script =
          document.createElement(
            "script"
          );

        let finished =
          false;

        const thisTimeout =
          retryable
            ? Math.max(
                timeoutMs,
                45000
              )
            : timeoutMs;

        const timeout =
          setTimeout(
            function() {

              if (finished) {
                return;
              }

              finished =
                true;

              cleanup();

              if (
                retryable &&
                attempt < maxAttempts
              ) {

                setStatus(
                  "RETRYING FACE API " +
                  attempt +
                  "/" +
                  maxAttempts
                );

                setTimeout(
                  runAttempt,
                  1200
                );

                return;
              }

              reject(
                new Error(
                  "API TIMEOUT: " +
                  action
                )
              );

            },
            thisTimeout
          );


        window[callbackName] =
          function(data) {

            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();

            resolve(
              data
            );

          };


        script.onerror =
          function() {

            if (finished) {
              return;
            }

            finished =
              true;

            cleanup();


if (
  retryable &&
  attempt < maxAttempts
) {

  // TARGET sudah pernah terbaca.
  // Jangan tampilkan RECONNECTING ke user.
  if (action !== "target") {
    setStatus(
      "RECONNECTING FACE API " +
      attempt +
      "/" +
      maxAttempts
    );
  }

  setTimeout(
    runAttempt,
    1200
  );

  return;
}


            
            reject(
              new Error(
                "API CONNECTION ERROR: " +
                action
              )
            );

          };


        let url =
          API_URL +
          "?action=" +
          encodeURIComponent(
            action
          ) +
          "&callback=" +
          encodeURIComponent(
            callbackName
          ) +
          "&t=" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2);


        Object.keys(params)
          .forEach(
            function(key) {

              url +=
                "&" +
                encodeURIComponent(
                  key
                ) +
                "=" +
                encodeURIComponent(
                  params[key]
                );

            }
          );


        script.async =
          true;

        script.src =
          url;

        document.head.appendChild(
          script
        );


        function cleanup() {

          clearTimeout(
            timeout
          );

          try {

            delete window[
              callbackName
            ];

          } catch (e) {}


          script.remove();

        }

      }


      runAttempt();

    }
  );

}

/* =========================================================
   OPEN CACHE
   ========================================================= */

function openCache() {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const request =
        indexedDB.open(
          CACHE_DB_NAME,
          CACHE_DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                CACHE_STORE
              )
          ) {

            db.createObjectStore(
              CACHE_STORE,
              {
                keyPath:
                  "employeeId"
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error ||
            new Error(
              "CACHE OPEN ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================
   GET CACHE
   ========================================================= */

async function getCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readonly"
        );


      const request =
        tx.objectStore(
          CACHE_STORE
        ).getAll();


      request.onsuccess =
        function() {

          db.close();


          resolve(
            request.result ||
            []
          );

        };


      request.onerror =
        function() {

          db.close();


          reject(
            request.error ||
            new Error(
              "CACHE READ ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================
   SAVE CACHE
   ========================================================= */

async function saveCacheItems(
  items
) {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      const store =
        tx.objectStore(
          CACHE_STORE
        );


      items.forEach(
        function(item) {

          store.put(
            item
          );

        }
      );


      tx.oncomplete =
        function() {

          db.close();


          resolve();

        };


      tx.onerror =
        function() {

          db.close();


          reject(
            tx.error ||
            new Error(
              "CACHE SAVE ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================
   CLEAR CACHE
   ========================================================= */

async function clearCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      tx.objectStore(
        CACHE_STORE
      ).clear();


      tx.oncomplete =
        function() {

          db.close();


          resolve();

        };


      tx.onerror =
        function() {

          db.close();


          reject(
            tx.error ||
            new Error(
              "CACHE CLEAR ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================

function makeSignature(
  list
) {

  return list

      function(item) {

        return (

          String(
            item.employeeId ||
            ""

          "|" +

          String(
            item.name ||
            ""
          ).trim() +

          "|" +

          String(
            item.row ||
            ""
          )

        );

      }
    )
    .join(
      "||"
    );

}


function getSignature() {

  try {

    return (
      localStorage.getItem(
        CACHE_SIGNATURE
      ) ||
      ""
    );

  } catch (e) {

    return "";

  }

}


function setSignature(
  value
) {

  try {

    localStorage.setItem(
      CACHE_SIGNATURE,
      value
    );

  } catch (e) {}

}


/* =========================================================
   BUILD MATCHER
   ========================================================= */

function buildMatcher(
  cached
) {

  const labeled =
    [];


  cached.forEach(
    function(item) {

      try {

        if (
          !item.employeeId ||
          !Array.isArray(
            item.descriptor
          ) ||
          item.descriptor.length !==
            128
        ) {

          return;

        }


        labeled.push(

          new faceapi
            .LabeledFaceDescriptors(

              String(
                item.employeeId
              ),

              [
                new Float32Array(
                  item.descriptor
                )
              ]

            )

        );

      } catch (error) {

        console.error(
          "CACHE MATCHER ERROR:",
          item.employeeId,
          error
        );

      }

    }
  );


  if (
    !labeled.length
  ) {

    return null;

  }


  return new faceapi.FaceMatcher(
    labeled,
    MATCH_THRESHOLD
  );

}


/* =========================================================
   BUILD FACE CACHE
   ========================================================= */

async function buildFaceCache(
  list
) {

  const CONCURRENCY =
    5;


  let nextIndex =
    0;


  let completed =
    0;


  const descriptors =
    [];


  async function worker() {

    while (true) {

      const index =
        nextIndex++;


      if (
        index >=
        list.length
      ) {

        return;

      }


      const employee =
        list[index];


      const employeeId =
        String(
          employee.employeeId ||
          ""
        ).trim();


      const employeeName =
        String(
          employee.name ||
          ""
        ).trim();


      try {

        const photo =
          await getFacePhoto(
            employee.row
          );


        if (
          photo &&
          photo.ok &&
          photo.image
        ) {

          const image =
            await faceapi.fetchImage(
              photo.image
            );


          const detection =
            await faceapi

              .detectSingleFace(

                image,

                new faceapi
                  .TinyFaceDetectorOptions({

                    inputSize:
                      DETECTOR_INPUT_SIZE,

                    scoreThreshold:
                      0.5

                  })

              )

              .withFaceLandmarks(
                true
              )

              .withFaceDescriptor();


          if (
            detection
          ) {

            descriptors.push({

              employeeId:
                employeeId,

              name:
                employeeName,

              descriptor:
                Array.from(
                  detection.descriptor
                )

            });

          }

        }


      } catch (error) {

        console.error(
          "PHOTO PROCESS ERROR:",
          employeeId,
          error
        );

      }


      completed++;


      databaseInfo.innerText =
        "PROCESSING FACE " +
        completed +
        "/" +
        list.length;

    }

  }


  const workers =
    [];


  const workerCount =
    Math.min(
      CONCURRENCY,
      list.length
    );


  for (
    let i = 0;
    i < workerCount;
    i++
  ) {

    workers.push(
      worker()
    );

  }


  await Promise.all(
    workers
  );


  if (
    descriptors.length ===
    0
  ) {

    throw new Error(
      "NO FACE DESCRIPTOR FOUND"
    );

  }


  setStatus(
    "SAVING FACE CACHE..."
  );


  await clearCache();


  for (
    let i = 0;
    i < descriptors.length;
    i += 20
  ) {

    await saveCacheItems(
      descriptors.slice(
        i,
        i + 20
      )
    );

  }


  setSignature(
    makeSignature(
      list
    )
  );


  faceMatcher =
    buildMatcher(
      descriptors
    );


  if (
    !faceMatcher
  ) {

    throw new Error(
      "FACE CACHE FAILED"
    );

  }


  databaseLoaded =
    true;


  databaseInfo.innerText =
    "FACE READY: " +
    descriptors.length +
    " / " +
    list.length +
    " EMPLOYEE";

}


/* =========================================================
   LOAD DATABASE ONCE PER PAGE SESSION

   Saat halaman dibuka/di-refresh, database dibaca sekali.
   Setelah FACE SYSTEM READY, target scan tidak memanggil
   faces lagi. Selama halaman tetap terbuka 24 jam,
   descriptor yang sudah ada dipakai terus dari memory/cache.
   Jika ada karyawan/foto baru, refresh halaman secara manual.
   ========================================================= */

async function loadDatabaseOnce() {

  if (
    databaseLoaded
  ) {

    return;

  }


  setStatus(
    "LOADING FACE DATABASE..."
  );


  /*
     Ambil daftar employee
     dari FACE DATABASE.
  */

  const data =
    await getFaceDatabase();


  if (
    !data ||
    !data.ok
  ) {

    throw new Error(

      data &&
      (
        data.message ||
        data.error
      )

        ? (
            data.message ||
            data.error
          )

        : "FACE DATABASE ERROR"

    );

  }


  employees =
    Array.isArray(
      data.faces
    )
      ? data.faces
      : [];


  if (
    employees.length ===
    0
  ) {

    throw new Error(
      "NO EMPLOYEE PHOTO FOUND"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  /*
     Cek apakah descriptor
     sudah tersimpan.
  */

  const signature =
    makeSignature(
      employees
    );


  const oldSignature =
    getSignature();


  const cached =
    await getCache();


  /*
     CACHE MASIH VALID
  */

  if (

    oldSignature ===
      signature &&

    cached.length >
      0

  ) {

    faceMatcher =
      buildMatcher(
        cached
      );


    if (
      faceMatcher
    ) {

      databaseLoaded =
        true;


      databaseInfo.innerText =
        "FACE CACHE READY: " +
        cached.length +
        " / " +
        employees.length +
        " EMPLOYEE";


      return;

    }

  }


  /*
     CACHE BELUM ADA.
     Foto diproses sekali.
  */

  await loadModels();


  await buildFaceCache(
    employees
  );

}


/* =========================================================
   PRELOAD FACE SYSTEM
   ========================================================= */

async function preloadFaceSystem() {

  if (
    preloadPromise
  ) {

    return preloadPromise;

  }


  preloadPromise =
    (async function() {

      try {

        /*
           1. AMBIL DATABASE
        */

        await loadDatabaseOnce();


        /*
           2. MODEL

           Kalau database belum punya
           cache, loadDatabaseOnce()
           sudah load model.

           Kalau cache sudah ada,
           model perlu tetap di-load
           sebelum membuat matcher.
        */

        await loadModels();


        /*
           3. Pastikan database
              benar-benar siap.
        */

        if (
          !databaseLoaded
        ) {

          await loadDatabaseOnce();

        }


        /*
           4. READY
        */

        setStatus(
          "FACE SYSTEM READY"
        );


        /*
           Baru setelah face system
           siap, mulai cek target.
        */

        startTargetMonitor();

      } catch (error) {

        preloadPromise =
          null;


        console.error(
          "INITIAL LOAD ERROR:",
          error
        );


        setStatus(
          "FACE SYSTEM ERROR"
        );


        resultBox.innerText =
          error.message ||
          "FACE SYSTEM ERROR";

      }

    })();


  return preloadPromise;

}


/* =========================================================
   COLUMN NUMBER → LETTER
   ========================================================= */

function columnToLetter(
  column
) {

  let letter =
    "";


  while (
    column > 0
  ) {

    const temp =
      (column - 1) % 26;


    letter =
      String.fromCharCode(
        temp + 65
      ) +
      letter;


    column =
      Math.floor(
        (column - temp - 1) /
        26
      );

  }


  return letter;

}


/* =========================================================
   TIME
   ========================================================= */

function timeToMinutes(
  value
) {

  if (!value) {
    return null;
  }


  const parts =
    String(
      value
    )
      .trim()
      .split(
        /[:\/]/
      );


  if (
    parts.length <
    2
  ) {

    return null;

  }


  const hour =
    Number(
      parts[0]
    );


  const minute =
    Number(
      parts[1]
    );


  if (

    !Number.isFinite(
      hour
    ) ||

    !Number.isFinite(
      minute
    ) ||

    hour < 0 ||

    hour > 23 ||

    minute < 0 ||

    minute > 59

  ) {

    return null;

  }


  return (
    hour * 60 +
    minute
  );

}


/* =========================================================
   TIME GAP
   ========================================================= */

function validateTimeGap(
  target,
  checklist
) {

  if (!checklist) {
    return {
      ok: true
    };
  }

  const column =
    Number(target.column);

  /*
     TIME IN:
     E  = 5
     X  = 24
     AI = 35
  */

  if (
    ![5,24,35].includes(column)
  ) {

    return {
      ok: true
    };

  }

  const timeOut =
    String(
      checklist.timeOut || ""
    ).trim();

  /*
     Kalau Time Out belum ada,
     Time In boleh dilanjutkan.
  */

  if (
    !timeOut ||
    timeOut === "NOT YET"
  ) {

    return {
      ok: true
    };

  }

  const outMinutes =
    timeToMinutes(
      timeOut
    );

  if (
    outMinutes === null
  ) {

    return {
      ok: true
    };

  }

  /*
     AMBIL JAM COLOMBO
  */

  const colomboParts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:
          "Asia/Colombo",
        hour:
          "2-digit",
        minute:
          "2-digit",
        hourCycle:
          "h23"
      }
    )
    .formatToParts(
      new Date()
    );

  let hour = 0;
  let minute = 0;

  colomboParts.forEach(
    function(part) {

      if (
        part.type === "hour"
      ) {
        hour =
          Number(part.value);
      }

      if (
        part.type === "minute"
      ) {
        minute =
          Number(part.value);
      }

    }
  );

  const nowMinutes =
    hour * 60 +
    minute;

  /*
     HITUNG SELISIH
     termasuk lewat tengah malam
  */

  let difference =
    nowMinutes -
    outMinutes;

  if (
    difference < 0
  ) {

    difference +=
      24 * 60;

  }

  /*
     1 MENIT ATAU KURANG
     = TIDAK BOLEH
  */

  if (
    difference <= 1
  ) {

    return {

      ok: false,

      message:
        "TIME IN NOT ALLOWED\n\n" +
        "Time In must be more than 1 minute after Time Out."

    };

  }

  return {
    ok: true
  };

}
  

/* =========================================================
   VALIDATE BEFORE CAMERA
   ========================================================= */


function validateBeforeCamera(
  target,
  checklist
) {

  if (!target) {

    return {

      ok: false,

      message:
        "TARGET NOT READY"

    };

  }

  const column =
    Number(target.column);

  /*
     TIME IN E / X / AI
     harus sudah punya Employee No
  */

  if (
    [5,24,35].includes(column)
  ) {

    const employeeNo =
      checklist

        ? String(
            checklist.employeeNo ||
            ""
          ).trim()

        : "";

    if (
      !employeeNo ||
      employeeNo ===
        "NOT YET"
    ) {

      return {

        ok: false,

        message:
          "TIME IN NOT ALLOWED\n\n" +
          "Employee Number has not been scanned yet."

      };

    }

  }

  /*
     E → G WAJIB DIISI
  */

  if (
    column === 5
  ) {

    const remark =
      checklist

        ? String(
            checklist.remark ||
            ""
          ).trim()

        : "";

    if (
      !remark ||
      remark ===
        "NOT YET"
    ) {

      return {

        ok: false,

        message:
          "REMARK REQUIRED\n\n" +
          "Please enter Remark in column G before scanning Time In."

      };

    }

  }

  /*
     AI → AK WAJIB DIISI
  */

  if (
    column === 35
  ) {

    const remark =
      checklist

        ? String(
            checklist.remark ||
            ""
          ).trim()

        : "";

    if (
      !remark ||
      remark ===
        "NOT YET"
    ) {

      return {

        ok: false,

        message:
          "REMARK REQUIRED\n\n" +
          "Please enter Remark in column AK before scanning Time In."

      };

    }

  }

  /*
     CEK TIME GAP
  */

  return validateTimeGap(
    target,
    checklist
  );

}
  



/* =========================================================
   TARGET CHECK — FINAL
   ========================================================= */

async function checkTarget() {

  if (
    targetChecking ||
    !databaseLoaded ||
    scanning ||
    scanProcessing
  ) {
    return;
  }

  targetChecking = true;

  try {

    const data =
      await getCurrentTarget();

    /*
       Tidak ada target
    */

    if (
      !data ||
      !data.ok
    ) {

      return;

    }


    /*
       Update checklist
    */

    if (
      data.checklist
    ) {

      updateChecklist(
        data.checklist
      );

    }


    /*
       TARGET BELUM READY
    */

    if (
      !data.ready
    ) {

      stopCamera();

      currentTarget = null;

      scanLocked = false;
      stableCount = 0;
      lastEmployee = "";


      if (
        data.warning
      ) {

        lastWarning =
          String(
            data.warning
          );

        /*
           WARNING hanya muncul
           kalau belum ditutup user
        */

        if (
          dismissedWarning !==
          lastWarning
        ) {

          showWarning(
            lastWarning
          );

        }

        setStatus(
          "ACTION REQUIRED"
        );

      } else {

        targetInfo.innerText =
          "WAITING FOR TARGET";

      }

      return;

    }


    /*
       COLUMN
    */

    const column =
      Number(
        data.column
      );


    const allowed =
      [
        1,
        5,
        13,
        20,
        24,
        31,
        35
      ];


    if (
      !data.sheet ||
      !data.row ||
      !allowed.includes(
        column
      )
    ) {

      stopCamera();

      return;

    }


    /*
       TARGET KEY
    */

    const newKey =
      data.sheet +
      "|" +
      data.row +
      "|" +
      column;


    /*
       TARGET YANG BARU SELESAI
    */

    if (
      newKey ===
      completedTargetKey
    ) {

      cameraHold =
        true;

      stopCamera();

      return;

    }


    /*
       TARGET BERUBAH
       → WARNING LAMA BOLEH RESET
    */

    const oldKey =
      currentTarget
        ? (
            currentTarget.sheet +
            "|" +
            currentTarget.row +
            "|" +
            currentTarget.column
          )
        : "";


    if (
      oldKey &&
      oldKey !== newKey
    ) {

      dismissedWarning = "";
      lastWarning = "";

      completedTargetKey = "";

    }


    /*
       TARGET SAMA
    */

    if (
      newKey === oldKey
    ) {

      const sameValidation =
        validateBeforeCamera(
          currentTarget,
          data.checklist
        );


      /*
         TARGET SAMA TAPI SUDAH TIDAK VALID
      */

      if (
        !sameValidation.ok
      ) {

        stopCamera();

        lastWarning =
          sameValidation.message;


        if (
          dismissedWarning !==
          lastWarning
        ) {

          showWarning(
            lastWarning
          );

        }

        setStatus(
          "ACTION REQUIRED"
        );

      }

      return;

    }


    /*
       TARGET BARU
    */

    cameraHold =
      false;


    scanLocked = false;
    stableCount = 0;
    lastEmployee = "";


    currentTarget = {

      sheet:
        data.sheet,

      row:
        Number(
          data.row
        ),

      column:
        column

    };


    targetInfo.innerText =
      "TARGET: " +
      data.sheet +
      "!" +
      columnToLetter(
        column
      ) +
      data.row;


    resultBox.innerText =
      "";

    distanceBox.innerText =
      "";


    updateChecklist(
      data.checklist
    );


    /*
       VALIDATE
       SEBELUM CAMERA
    */

    const validation =
      validateBeforeCamera(
        currentTarget,
        data.checklist
      );


    if (
      !validation.ok
    ) {

      stopCamera();

      lastWarning =
        validation.message;


      /*
         WARNING MUNCUL SEKALI
      */

      if (
        dismissedWarning !==
        lastWarning
      ) {

        showWarning(
          lastWarning
        );

      }


      setStatus(
        "ACTION REQUIRED"
      );

      return;

    }


    /*
       SEMUA VALID
       → CAMERA BOLEH HIDUP
    */

    await startCamera();


  } catch (error) {

    console.error(
      "TARGET CHECK ERROR:",
      error
    );

  } finally {

    targetChecking =
      false;

  }

}

/* =========================================================
   START CAMERA - FINAL
   ========================================================= */


async function startCamera() {

  if (cameraHold) {
    return;
  }

  if (scanning) {
    return;
  }

  const requestId =
    ++cameraRequestId;

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          width: {
            ideal: CAMERA_WIDTH
          },
          height: {
            ideal: CAMERA_HEIGHT
          },
          facingMode: "user"
        },
        audio: false
      });

    /*
     * Kalau request camera ini sudah dibatalkan
     * sebelum getUserMedia selesai,
     * langsung matikan stream yang baru didapat.
     */
    if (
      requestId !== cameraRequestId ||
      cameraHold
    ) {

      stream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });

      return;
    }

    cameraStream =
      stream;

    cameraStream
      .getVideoTracks()
      .forEach(function(track) {
        track.enabled = true;
      });

    video.srcObject =
      cameraStream;

    await video.play();

    /*
     * Cek sekali lagi setelah video play.
     */
    if (
      requestId !== cameraRequestId ||
      cameraHold
    ) {

      stopCamera();

      return;
    }

    cameraBox.classList.add(
      "active"
    );

    scanning = true;

    stableCount = 0;
    lastEmployee = "";
    scanLocked = false;

    setStatus(
      "READY TO SCAN"
    );

    startScanLoop();

  } catch (error) {

    /*
     * Kalau request sudah dibatalkan,
     * jangan tampilkan error.
     */
    if (
      requestId !== cameraRequestId
    ) {
      return;
    }

    console.error(
      "CAMERA ERROR:",
      error
    );

    scanning = false;

    cameraStream = null;

    video.srcObject = null;

    cameraBox.classList.remove(
      "active"
    );

    setStatus(
      "CAMERA ERROR"
    );

    resultBox.innerText =
      "CAMERA ERROR\n" +
      (
        error &&
        error.message
          ? error.message
          : "Unable to access camera."
      );
  }
}

/* =========================================================
   STOP CAMERA - FINAL
   ========================================================= */

function stopCamera() {

  /*
   * Batalkan semua request camera
   * yang masih berjalan.
   */
  cameraRequestId++;

  scanning = false;

  scanLocked = false;

  stableCount = 0;

  lastEmployee = "";

  if (scanTimer) {

    clearInterval(
      scanTimer
    );

    scanTimer = null;
  }

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {

        try {
          track.stop();
        } catch (e) {
          console.error(
            "TRACK STOP ERROR:",
            e
          );
        }

      });

    cameraStream = null;
  }

  video.pause();

  video.srcObject = null;

  cameraBox.classList.remove(
    "active"
  );
}




  


  

/* =========================================================
   FIND CENTER FACE
   ========================================================= */

function findCenterFace(
  detections
) {

  if (
    !detections ||
    !detections.length
  ) {

    return null;

  }


  const width =
    video.videoWidth ||
    CAMERA_WIDTH;


  const height =
    video.videoHeight ||
    CAMERA_HEIGHT;


  const centerX =
    width / 2;


  const centerY =
    height / 2;


  let bestFace =
    null;


  let bestDistance =
    Infinity;


  detections.forEach(
    function(detection) {

      const box =
        detection.detection.box;


      const faceX =
        box.x +
        box.width / 2;


      const faceY =
        box.y +
        box.height / 2;


      const distance =
        Math.hypot(

          faceX -
            centerX,

          faceY -
            centerY

        );


      if (
        distance <
        bestDistance
      ) {

        bestDistance =
          distance;


        bestFace =
          detection;

      }

    }
  );


  if (
    !bestFace
  ) {

    return null;

  }


  /*
     Cek apakah wajah cukup dekat
     dengan tengah.
  */

  const box =
    bestFace.detection.box;


  const faceX =
    box.x +
    box.width / 2;


  const faceY =
    box.y +
    box.height / 2;


  const normalizedX =
    Math.abs(
      faceX -
      centerX
    ) /
    width;


  const normalizedY =
    Math.abs(
      faceY -
      centerY
    ) /
    height;


  if (

    normalizedX >
      CENTER_TOLERANCE ||

    normalizedY >
      CENTER_TOLERANCE

  ) {

    return null;

  }


  return bestFace;

}


/* =========================================================
   SCAN FACE
   ========================================================= */

async function scanFace() {

  if (
    !scanning ||
    scanLocked ||
    scanProcessing ||
    !faceMatcher
  ) {
    return;
  }

  scanProcessing = true;

  try {

  if (

    video.readyState <
      2 ||

    !video.videoWidth ||

    !video.videoHeight

  ) {

    return;

  }


    /*
       DETECT SEMUA WAJAH
    */

    const detections =
      await faceapi

        .detectAllFaces(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize:
                DETECTOR_INPUT_SIZE,

              scoreThreshold:
                0.5

            })

        )

        .withFaceLandmarks(
          true
        )

        .withFaceDescriptors();


    if (
      !detections.length
    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        "NO FACE DETECTED";


      distanceBox.innerText =
        "";


      return;

    }


    /*
       Kalau lebih dari satu orang,
       ambil yang paling dekat tengah.
    */

    const centerFace =
      findCenterFace(
        detections
      );


    if (
      !centerFace
    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        detections.length > 1

          ? "CENTER FACE ONLY"

          : "MOVE FACE TO CENTER";


      distanceBox.innerText =
        "";


      return;

    }


    /*
       MATCH
    */

    const match =
      faceMatcher.findBestMatch(
        centerFace.descriptor
      );


    const employeeId =
      String(
        match.label ||
        ""
      ).trim();


    const distance =
      Number(
        match.distance
      );


    distanceBox.innerText =
      "MATCH: " +
      employeeId +
      " | DIST: " +
      distance.toFixed(
        3
      );


    /*
       Tidak dikenal
    */

    if (

      !employeeId ||

      employeeId ===
        "unknown" ||

      distance >
        MATCH_THRESHOLD

    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        "FACE NOT RECOGNIZED";


      return;

    }


    /*
       Cari nama
    */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ).trim() ===
            employeeId;

        }
      );


    const employeeName =
      employee

        ? String(
            employee.name ||
            ""
          ).trim()

        : "";


    /*
       STABLE MATCH
    */

    if (
      lastEmployee ===
      employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;


      stableCount =
        1;

    }


    resultBox.innerText =
      "MATCH FOUND: " +
      employeeId +
      " " +
      employeeName +
      "\n" +
      "STABLE: " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH;


    if (
      stableCount <
      REQUIRED_STABLE_MATCH
    ) {

      return;

    }


    /*
       LOCK
    */

    scanLocked =
      true;


    setStatus(
      "PROCESSING..."
    );


    resultBox.innerText =
      "PROCESSING\n" +
      employeeId +
      " " +
      employeeName;


    /*
       SEND TO GOOGLE SHEETS
    */

    const response =
      await sendScanToSheet(

        employeeId,

        employeeName

      );


    /*
       GAGAL
    */

    if (

      !response ||
      !response.ok

    ) {

      scanLocked =
        false;


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "SCAN FAILED"
      );


      resultBox.innerText =

        response &&
        (
          response.message ||
          response.error
        )

          ? (
              response.message ||
              response.error
            )

          : "SCAN FAILED";


      return;

    }


    
/*
   SUCCESS
*/

setStatus(
  "SCAN SUCCESS"
);

resultBox.innerText =
  "SUCCESS\n" +
  employeeId +
  " " +
  employeeName;


stopCamera();

completedTargetKey =
  currentTarget
    ? (
        currentTarget.sheet +

        currentTarget.row +
        "|" +
        currentTarget.column
      )
    : "";

cameraHold = true;

currentTarget = null;

targetInfo.innerText =

setTimeout(

    resultBox.innerText =

  },

);

    );
