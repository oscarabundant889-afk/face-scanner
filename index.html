<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 15px 0 10px;
  font-size: 30px;
}

/* =========================
   CAMERA SMALL
========================= */

#cameraBox {
  width: 320px;
  height: 240px;
  margin: 10px auto;
  background: #222;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* camera */

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  transform: scaleX(-1);
}

/*
   AREA TENGAH
   Wajah yang berada di area ini
   akan menjadi target utama.
*/

#centerGuide {
  position: absolute;
  width: 150px;
  height: 190px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(255,255,255,0.65);
  border-radius: 75px 75px 55px 55px;
  pointer-events: none;
}

#placeholder {
  font-size: 18px;
  color: #aaa;
  padding: 20px;
}

/* =========================
   STATUS
========================= */

#status {
  margin-top: 12px;
  font-size: 22px;
  font-weight: bold;
}

#result {
  margin-top: 10px;
  font-size: 28px;
  font-weight: bold;
  min-height: 55px;
  white-space: pre-line;
}

#distance {
  margin-top: 5px;
  font-size: 16px;
  color: #aaa;
}

#targetInfo {
  margin-top: 8px;
  font-size: 18px;
  color: #aaa;
}

#databaseInfo {
  margin-top: 8px;
  font-size: 16px;
  color: #aaa;
}

/* =========================
   CHECKLIST
========================= */

#checklist {
  width: 320px;
  margin: 12px auto;
  background: #1b1b1b;
  border-radius: 10px;
  padding: 10px 14px;
  text-align: left;
  font-size: 16px;
  line-height: 1.45;
}

.check-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 5px;
  text-align: center;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

</style>

</head>

<body>

<h1>FACE SCANNER</h1>

<div id="cameraBox">

  <div id="placeholder">
    WAITING FOR TARGET...
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="centerGuide"></div>

</div>

<div id="status">
  WAITING FOR CELL
</div>

<div id="result"></div>

<div id="distance"></div>

<div id="targetInfo">
  WAITING FOR TARGET
</div>

<div id="checklist">

  <div class="check-title">
    ATTENDANCE STATUS
  </div>

  <div id="checklistContent">
    SELECT AN ATTENDANCE CELL
  </div>

</div>

<div id="databaseInfo"></div>

<button
  id="startButton"
  style="display:none;">
  START CAMERA
</button>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwGlmYYkvlm__QOQ1cyTOHB5Zi0eJwkGzaINKOTbTieG_z1E6dCBKkP9xYTX-vnwVoI/exec";


const MODEL_URL =
  "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


/*
   0.50 = normal
   Semakin kecil = lebih ketat
*/

const MATCH_THRESHOLD = 0.50;


/*
   Hanya perlu 2 frame stabil.
   Sebelumnya 3 sehingga terasa lebih lambat.
*/

const REQUIRED_STABLE_MATCH = 2;


/*
   Jarak antar scan.
   150ms lebih cepat daripada 300ms.
*/

const SCAN_INTERVAL = 150;


/*
   Ukuran detector.
   160 jauh lebih ringan daripada 224.
*/

const DETECTOR_INPUT_SIZE = 160;


/*
   Hanya wajah yang berada dekat
   dengan tengah kamera yang dipilih.
*/

const CENTER_TOLERANCE = 0.42;


/* =====================================================
   ELEMENT
===================================================== */

const video =
  document.getElementById("video");

const placeholder =
  document.getElementById("placeholder");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const distanceBox =
  document.getElementById("distance");

const targetInfo =
  document.getElementById("targetInfo");

const checklistContent =
  document.getElementById("checklistContent");

const databaseInfo =
  document.getElementById("databaseInfo");

const startButton =
  document.getElementById("startButton");


/* =====================================================
   VARIABLES
===================================================== */

let faceMatcher = null;

let employees = [];

let cameraStream = null;

let scanning = false;

let scanLocked = false;

let stableCount = 0;

let lastEmployee = "";

let modelsLoaded = false;

let databaseLoaded = false;

let targetChecking = false;

let currentTarget = null;

let targetMonitor = null;

let preloadPromise = null;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.innerText = message;

}


/* =====================================================
   API JSONP
===================================================== */

function apiRequest(
  action,
  params = {},
  timeoutMs = 30000
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "FACE_CALLBACK_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);

      const script =
        document.createElement("script");

      let finished = false;

      const timeout =
        setTimeout(
          function() {

            if (finished) return;

            finished = true;

            cleanup();

            reject(
              new Error(
                "API TIMEOUT: " + action
              )
            );

          },
          timeoutMs
        );


      window[callbackName] =
        function(data) {

          if (finished) return;

          finished = true;

          cleanup();

          resolve(data);

        };


      script.onerror =
        function() {

          if (finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "API CONNECTION ERROR: " +
              action
            )
          );

        };


      let url =
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&callback=" +
        encodeURIComponent(callbackName);


      Object.keys(params)
        .forEach(
          function(key) {

            url +=
              "&" +
              encodeURIComponent(key) +
              "=" +
              encodeURIComponent(
                params[key]
              );

          }
        );


      url += "&t=" + Date.now();

      script.src = url;

      document.body.appendChild(script);


      function cleanup() {

        clearTimeout(timeout);

        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

        script.remove();

      }

    }
  );

}


/* =====================================================
   CHECKLIST
===================================================== */

function renderChecklist(checklist) {

  if (!checklistContent) return;

  if (!checklist) {

    checklistContent.innerText =
      "SELECT AN ATTENDANCE CELL";

    return;

  }

  const lines = [];


  function add(label, value) {

    const filled =
      String(value || "").trim() !== "";

    lines.push(
      (filled ? "✓ " : "○ ") +
      label +
      (filled
        ? " : COMPLETED"
        : " : NOT YET")
    );

  }


  add(
    "EMPLOYEE NO",
    checklist.employeeNo
  );

  add(
    "NAME",
    checklist.name
  );

  add(
    "TIME OUT",
    checklist.timeOut
  );

  add(
    "SYSTEM TIME OUT",
    checklist.timeOutStamp
  );

  add(
    "TIME IN",
    checklist.timeIn
  );

  add(
    "SYSTEM TIME IN",
    checklist.timeInStamp
  );


  if (checklist.remarkRequired) {

    add(
      "REMARK",
      checklist.remark
    );

  }


  checklistContent.innerText =
    lines.join("\n");

}


/* =====================================================
   SET TARGET FROM URL
===================================================== */

async function setTargetFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const sheet =
    params.get("sheet");

  const row =
    params.get("row");

  const column =
    params.get("column");


  if (!sheet || !row || !column) {

    return false;

  }


  try {

    const result =
      await apiRequest(
        "setTarget",
        {
          sheet: sheet,
          row: row,
          column: column
        },
        15000
      );


    if (
      !result ||
      !result.ok
    ) {

      resultBox.innerText =
        result &&
        result.message
          ? result.message
          : "TARGET ERROR";

      setStatus(
        "TARGET ERROR"
      );

      return false;

    }


    currentTarget = {

      sheet: sheet,

      row: Number(row),

      column: Number(column)

    };


    const columnNames = {

      1: "A",
      5: "E",
      20: "T",
      24: "X",
      31: "AE",
      35: "AI"

    };


    const columnName =
      columnNames[
        Number(column)
      ] || "?";


    targetInfo.innerText =
      "TARGET: " +
      sheet +
      "!" +
      columnName +
      row;


    if (result.checklist) {

      renderChecklist(
        result.checklist
      );

    }


    return true;


  } catch (error) {

    console.error(
      "SET TARGET ERROR:",
      error
    );

    resultBox.innerText =
      error.message ||
      "TARGET ERROR";

    setStatus(
      "TARGET ERROR"
    );

    return false;

  }

}


/* =====================================================
   GET TARGET
===================================================== */

async function getCurrentTarget() {

  return await apiRequest(
    "target",
    {},
    10000
  );

}


/* =====================================================
   CHECK TARGET
===================================================== */

async function checkTarget() {

  if (targetChecking) return;

  targetChecking = true;


  try {

    const data =
      await getCurrentTarget();


    if (
      !data ||
      !data.ok ||
      !data.ready
    ) {

      return;

    }


    if (
      !data.sheet ||
      !data.row ||
      !data.column
    ) {

      return;

    }


    const allowedColumns = [
      1,
      5,
      20,
      24,
      31,
      35
    ];


    if (
      allowedColumns.indexOf(
        Number(data.column)
      ) === -1
    ) {

      return;

    }


    const newKey =
      data.sheet +
      "|" +
      data.row +
      "|" +
      data.column;


    const oldKey =
      currentTarget
        ? currentTarget.sheet +
          "|" +
          currentTarget.row +
          "|" +
          currentTarget.column
        : "";


    if (newKey === oldKey) {

      return;

    }


    if (scanning) {

      stopCamera();

    }


    scanLocked = false;

    stableCount = 0;

    lastEmployee = "";


    currentTarget = {

      sheet:
        data.sheet,

      row:
        Number(data.row),

      column:
        Number(data.column)

    };


    const columnNames = {

      1: "A",
      5: "E",
      20: "T",
      24: "X",
      31: "AE",
      35: "AI"

    };


    const columnName =
      columnNames[
        Number(data.column)
      ] || "?";


    targetInfo.innerText =
      "TARGET: " +
      data.sheet +
      "!" +
      columnName +
      data.row;


    if (data.checklist) {

      renderChecklist(
        data.checklist
      );

    }


    resultBox.innerText = "";

    distanceBox.innerText = "";


    await startCamera();


  } catch (error) {

    console.log(
      "TARGET ERROR:",
      error.message
    );

  } finally {

    targetChecking = false;

  }

}


/* =====================================================
   TARGET MONITOR
===================================================== */

function startTargetMonitor() {

  checkTarget();


  targetMonitor =
    setInterval(
      checkTarget,
      500
    );

}


/* =====================================================
   LOAD MODELS
===================================================== */

async function loadModels() {

  if (modelsLoaded) return;


  setStatus(
    "LOADING FACE MODEL..."
  );


  await faceapi.nets
    .tinyFaceDetector
    .loadFromUri(
      MODEL_URL
    );


  await faceapi.nets
    .faceLandmark68TinyNet
    .loadFromUri(
      MODEL_URL
    );


  await faceapi.nets
    .faceRecognitionNet
    .loadFromUri(
      MODEL_URL
    );


  modelsLoaded = true;

}


/* =====================================================
   FACE DATABASE
===================================================== */

async function getFaceDatabase() {

  return await apiRequest(
    "faces",
    {},
    30000
  );

}


async function getFacePhoto(row) {

  return await apiRequest(
    "photo",
    {
      row: row
    },
    30000
  );

}


/* =====================================================
   LOAD DATABASE
===================================================== */

async function loadDatabase() {

  if (databaseLoaded) return;


  setStatus(
    "LOADING PHOTO DATABASE..."
  );


  const data =
    await getFaceDatabase();


  if (
    !data ||
    !data.ok
  ) {

    throw new Error(
      data &&
      data.message
        ? data.message
        : "FACE DATABASE ERROR"
    );

  }


  employees =
    Array.isArray(data.faces)
      ? data.faces
      : [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "NO EMPLOYEE PHOTO FOUND"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  const labeledDescriptors = [];


  /*
     6 employee diproses bersamaan.
     Lebih cepat daripada satu-satu.
  */

  const CONCURRENCY = 6;

  let nextIndex = 0;

  let completed = 0;


  async function worker() {

    while (true) {

      const i =
        nextIndex++;


      if (
        i >= employees.length
      ) {

        return;

      }


      const employee =
        employees[i];


      try {

        const photo =
          await getFacePhoto(
            employee.row
          );


        if (
          photo &&
          photo.ok &&
          photo.image
        ) {

          const image =
            await faceapi.fetchImage(
              photo.image
            );


          const detection =
            await faceapi
              .detectSingleFace(
                image,
                new faceapi.TinyFaceDetectorOptions({
                  inputSize: 160,
                  scoreThreshold: 0.5
                })
              )
              .withFaceLandmarks(true)
              .withFaceDescriptor();


          if (detection) {

            labeledDescriptors.push(
              new faceapi.LabeledFaceDescriptors(
                String(
                  employee.employeeId
                ),
                [
                  detection.descriptor
                ]
              )
            );

          }

        }

      } catch (error) {

        console.log(
          "PHOTO ERROR:",
          employee.employeeId
        );

      }


      completed++;


      if (
        completed % 10 === 0 ||
        completed === employees.length
      ) {

        setStatus(
          "LOADING FACE " +
          completed +
          "/" +
          employees.length
        );

      }

    }

  }


  const workers = [];


  const workerCount =
    Math.min(
      CONCURRENCY,
      employees.length
    );


  for (
    let i = 0;
    i < workerCount;
    i++
  ) {

    workers.push(
      worker()
    );

  }


  await Promise.all(
    workers
  );


  if (
    labeledDescriptors.length === 0
  ) {

    throw new Error(
      "NO FACE DESCRIPTOR FOUND"
    );

  }


  faceMatcher =
    new faceapi.FaceMatcher(
      labeledDescriptors,
      MATCH_THRESHOLD
    );


  databaseLoaded = true;


  databaseInfo.innerText =
    "FACE READY: " +
    labeledDescriptors.length +
    " / " +
    employees.length +
    " EMPLOYEE";


  setStatus(
    "FACE DATABASE READY"
  );

}


/* =====================================================
   PRELOAD
===================================================== */

async function preloadFaceSystem() {

  if (preloadPromise) {

    return preloadPromise;

  }


  preloadPromise =
    (async function() {

      /*
         Model dan database dimulai bersamaan.
      */

      await loadModels();
await loadDatabase();


      setStatus(
        "FACE SYSTEM READY"
      );

    })()
    .catch(
      function(error) {

        preloadPromise = null;

        console.error(
          "PRELOAD ERROR:",
          error
        );


        setStatus(
          "FACE SYSTEM ERROR"
        );


        resultBox.innerText =
          error.message ||
          "FACE SYSTEM ERROR";


        throw error;

      }
    );


  return preloadPromise;

}


/* =====================================================
   SEND SCAN
===================================================== */

async function sendScanToSheet(
  employeeId,
  employeeName
) {

  return await apiRequest(
    "scan",
    {
      employeeId:
        employeeId,

      employeeName:
        employeeName
    },
    15000
  );

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  if (scanning) return;


  try {

    await preloadFaceSystem();


    setStatus(
      "STARTING CAMERA..."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "BROWSER DOES NOT SUPPORT CAMERA"
      );

    }


    /*
       640x480 cukup untuk face recognition
       dan jauh lebih ringan daripada 1280x720.
    */

    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: "user",

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            },

            frameRate: {
              ideal: 20,
              max: 24
            }

          },

          audio: false

        });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning = true;

    scanLocked = false;

    stableCount = 0;

    lastEmployee = "";


    setStatus(
      "LOOK AT THE CENTER"
    );


    scanFace();


  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    scanning = false;


    setStatus(
      "CAMERA ERROR"
    );


    resultBox.innerText =
      error.message ||
      "CAMERA ERROR";

  }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

  scanning = false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  cameraStream = null;


  video.srcObject = null;


  video.style.display =
    "none";


  placeholder.style.display =
    "block";


  placeholder.innerText =
    "WAITING FOR TARGET...";


  stableCount = 0;

  lastEmployee = "";

}


/* =====================================================
   FIND CENTER FACE
===================================================== */

function findCenterFace(
  detections
) {

  if (
    !detections ||
    detections.length === 0
  ) {

    return null;

  }


  const videoWidth =
    video.videoWidth;


  const videoHeight =
    video.videoHeight;


  if (
    !videoWidth ||
    !videoHeight
  ) {

    return null;

  }


  const centerX =
    videoWidth / 2;


  const centerY =
    videoHeight / 2;


  let bestFace = null;

  let bestDistance =
    Infinity;


  detections.forEach(
    function(item) {

      const box =
        item.detection.box;


      const faceCenterX =
        box.x +
        box.width / 2;


      const faceCenterY =
        box.y +
        box.height / 2;


      /*
         Jarak dari titik tengah kamera.
      */

      const dx =
        (faceCenterX -
          centerX) /
        videoWidth;


      const dy =
        (faceCenterY -
          centerY) /
        videoHeight;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /*
         Wajah harus cukup dekat
         dengan tengah kamera.
      */

      if (
        distance >
        CENTER_TOLERANCE
      ) {

        return;

      }


      if (
        distance <
        bestDistance
      ) {

        bestDistance =
          distance;

        bestFace =
          item;

      }

    }
  );


  return bestFace;

}


/* =====================================================
   FACE SCANNER
===================================================== */

async function scanFace() {

  if (!scanning) return;


  try {

    /*
       DETECT SEMUA WAJAH

       Kemudian hanya pilih
       wajah yang paling tengah.
    */

    const detections =
      await faceapi
        .detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions({

            inputSize:
              DETECTOR_INPUT_SIZE,

            scoreThreshold:
              0.50

          })
        )
        .withFaceLandmarks(true)
        .withFaceDescriptors();


    if (
      !detections ||
      detections.length === 0
    ) {

      resultBox.innerText =
        "NO FACE";

      distanceBox.innerText = "";

      stableCount = 0;

      lastEmployee = "";


      setStatus(
        "LOOK AT THE CENTER"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );

      return;

    }


    /*
       Kalau ada beberapa orang,
       pilih yang paling tengah.
    */

    const detection =
      findCenterFace(
        detections
      );


    if (!detection) {

      resultBox.innerText =
        "MOVE TO CENTER";

      distanceBox.innerText = "";

      stableCount = 0;

      lastEmployee = "";


      setStatus(
        "FACE MUST BE IN CENTER"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );

      return;

    }


    /*
       Cocokkan wajah tengah
       dengan database.
    */

    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    const employeeId =
      bestMatch.label;


    const distance =
      bestMatch.distance;


    distanceBox.innerText =
      "DISTANCE: " +
      distance.toFixed(4);


    /*
       Tidak cocok.
    */

    if (
      employeeId === "unknown"
    ) {

      resultBox.innerText =
        "UNKNOWN";

      stableCount = 0;

      lastEmployee = "";


      setStatus(
        "FACE NOT MATCHED"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );

      return;

    }


    /*
       Cari nama.
    */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ) === String(
            employeeId
          );

        }
      );


    const employeeName =
      employee
        ? employee.name
        : "";


    /*
       Stable match.
    */

    if (
      lastEmployee === employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;

      stableCount = 1;

    }


    resultBox.innerText =
      employeeId +
      " - " +
      employeeName;


    setStatus(
      "MATCH " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH
    );


    /*
       VERIFIED
    */

    if (
      stableCount >=
        REQUIRED_STABLE_MATCH &&
      !scanLocked
    ) {

      scanLocked = true;


      const targetAtScan =
        currentTarget
          ? {
              sheet:
                currentTarget.sheet,

              row:
                currentTarget.row,

              column:
                currentTarget.column
            }
          : null;


      if (!targetAtScan) {

        scanLocked = false;

        return;

      }


      setStatus(
        "FACE VERIFIED"
      );


      resultBox.innerText =
        "✓ " +
        employeeId +
        " - " +
        employeeName;


      try {

        const result =
          await sendScanToSheet(
            employeeId,
            employeeName
          );


        if (
          result &&
          result.ok
        ) {

          const employeeColumns = [
            1,
            20,
            31
          ];


          const isEmployeeScan =
            employeeColumns.indexOf(
              Number(
                targetAtScan.column
              )
            ) !== -1;


          if (isEmployeeScan) {

            resultBox.innerText =
              "✓ EMPLOYEE SAVED\n" +
              employeeId +
              " - " +
              employeeName;

          } else {

            resultBox.innerText =
              "✓ TIME IN SAVED\n" +
              employeeName +
              "\n" +
              result.timeIn;

          }


          setStatus(
            "SCAN SAVED"
          );


          stopCamera();


          currentTarget = null;

          stableCount = 0;

          lastEmployee = "";


        } else {

          scanLocked = false;

          stableCount = 0;

          lastEmployee = "";


          setStatus(
            "SCAN REJECTED"
          );


          resultBox.innerText =
            result &&
            result.message
              ? result.message
              : "SCAN REJECTED";


          if (scanning) {

            setTimeout(
              scanFace,
              500
            );

          }

          return;

        }


      } catch (error) {

        scanLocked = false;


        setStatus(
          "SCAN ERROR"
        );


        resultBox.innerText =
          error.message ||
          "SCAN ERROR";


        console.error(
          "SAVE ERROR:",
          error
        );

      }


      return;

    }


  } catch (error) {

    console.error(
      "FACE SCAN ERROR:",
      error
    );

  }


  if (scanning) {

    setTimeout(
      scanFace,
      SCAN_INTERVAL
    );

  }

}


/* =====================================================
   MANUAL BUTTON
===================================================== */

startButton.addEventListener(
  "click",
  function() {

    if (!scanning) {

      startCamera();

    }

  }
);


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
  "load",
  async function() {

    setStatus(
      "PREPARING FACE SYSTEM..."
    );


    databaseInfo.innerText =
      "PREPARING FACE DATABASE...";


    /*
       Load model + database
       sejak awal supaya ketika
       cell diklik camera cepat.
    */

    preloadFaceSystem()
      .catch(
        function() {}
      );


    await setTargetFromUrl();


    startTargetMonitor();

  }
);

</script>
