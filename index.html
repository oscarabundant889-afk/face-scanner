/* =========================================================
   JSONP API
   ========================================================= */

function apiRequest(
  action,
  params = {},
  timeoutMs = 30000
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const callbackName =
        "FACE_CB_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      let callbackCalled =
        false;


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}


        script.remove();

      }


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "API TIMEOUT: " +
                action
              )
            );

          },
          timeoutMs
        );


      window[callbackName] =
        function(data) {

          callbackCalled =
            true;


          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          resolve(data);

        };


      script.onload =
        function() {

          /*
           * Google Apps Script may report
           * script loaded before callback
           * is executed.
           *
           * Therefore do NOT resolve here.
           */

          if (
            !callbackCalled
          ) {

            console.log(
              "API SCRIPT LOADED:",
              action
            );

          }

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "API CONNECTION ERROR: " +
              action
            )
          );

        };


      let url =
        API_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&action=" +
        encodeURIComponent(
          action
        );


      Object.keys(params)
        .forEach(
          function(key) {

            url +=
              "&" +
              encodeURIComponent(
                key
              ) +
              "=" +
              encodeURIComponent(
                params[key]
              );

          }
        );


      url +=
        "&_=" +
        Date.now();


      script.src =
        url;


      script.async =
        true;


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   PING API
   ========================================================= */

/* =========================================================
   INDEXED DB
   ========================================================= */

function openCache() {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      if (
        !window.indexedDB
      ) {

        reject(
          new Error(
            "BROWSER CACHE NOT SUPPORTED"
          )
        );

        return;

      }


      const request =
        indexedDB.open(
          CACHE_DB_NAME,
          CACHE_DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                CACHE_STORE
              )
          ) {

            db.createObjectStore(
              CACHE_STORE,
              {
                keyPath:
                  "employeeId"
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error ||
            new Error(
              "CACHE OPEN ERROR"
            )
          );

        };

    }
  );

}


/* =========================================================
   GET CACHE
   ========================================================= */

async function getCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readonly"
        );


      const request =
        tx.objectStore(
          CACHE_STORE
        ).getAll();


      request.onsuccess =
        function() {

          db.close();

          resolve(
            request.result || []
          );

        };


      request.onerror =
        function() {

          db.close();

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   SAVE CACHE
   ========================================================= */

async function saveCache(
  employeeId,
  name,
  descriptor
) {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      tx.objectStore(
        CACHE_STORE
      ).put({

        employeeId:
          String(
            employeeId
          ),

        name:
          String(
            name || ""
          ),

        descriptor:
          Array.from(
            descriptor
          )

      });


      tx.oncomplete =
        function() {

          db.close();

          resolve();

        };


      tx.onerror =
        function() {

          db.close();

          reject(
            tx.error
          );

        };

    }
  );

}


/* =========================================================
   CLEAR CACHE
   ========================================================= */

async function clearCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      tx.objectStore(
        CACHE_STORE
      ).clear();


      tx.oncomplete =
        function() {

          db.close();

          resolve();

        };


      tx.onerror =
        function() {

          db.close();

          reject(
            tx.error
          );

        };

    }
  );

}


/* =========================================================
   CACHE SIGNATURE
   ========================================================= */

function makeSignature(
  list
) {

  return list
    .map(
      function(item) {

        return [

          String(
            item.employeeId ||
            ""
          ),

          String(
            item.name ||
            ""
          ),

          String(
            item.row ||
            ""
          )

        ].join("|");

      }
    )
    .join("||");

}


function getCacheSignature() {

  try {

    return (
      localStorage.getItem(
        CACHE_SIGNATURE
      ) || ""
    );

  } catch (e) {

    return "";

  }

}


function saveCacheSignature(
  value
) {

  try {

    localStorage.setItem(
      CACHE_SIGNATURE,
      value
    );

  } catch (e) {}

}


/* =========================================================
   BUILD FACE MATCHER
   ========================================================= */

function buildFaceMatcher(
  cached
) {

  const labeled =
    [];


  cached.forEach(
    function(item) {

      try {

        labeled.push(

          new faceapi
            .LabeledFaceDescriptors(

              String(
                item.employeeId
              ),

              [

                new Float32Array(
                  item.descriptor
                )

              ]

            )

        );

      } catch (error) {

        console.error(
          "CACHE DESCRIPTOR ERROR:",
          error
        );

      }

    }
  );


  if (
    labeled.length === 0
  ) {

    return null;

  }


  return new faceapi.FaceMatcher(
    labeled,
    MATCH_THRESHOLD
  );

}

/* =========================================================
   BUILD DATABASE
   ========================================================= */

async function buildDatabaseCache(
  list
) {

  const CONCURRENCY =
    8;


  const descriptors =
    [];


  let nextIndex =
    0;


  let completed =
    0;


  async function worker() {

    while (true) {

      const index =
        nextIndex++;


      if (
        index >=
        list.length
      ) {

        return;

      }


      const employee =
        list[index];


      const employeeId =
        String(
          employee.employeeId ||
          ""
        ).trim();


      const employeeName =
        String(
          employee.name ||
          ""
        ).trim();


      try {

        const photo =
          await getFacePhoto(
            employee.row
          );


        if (
          !photo ||
          !photo.ok ||
          !photo.image
        ) {

          completed++;

          continue;

        }


        const image =
          await faceapi.fetchImage(
            photo.image
          );


        const detection =
          await faceapi
            .detectSingleFace(

              image,

              new faceapi
                .TinyFaceDetectorOptions({

                  inputSize:
                    DETECTOR_INPUT_SIZE,

                  scoreThreshold:
                    0.5

                })

            )
            .withFaceLandmarks(
              true
            )
            .withFaceDescriptor();


        if (detection) {

          descriptors.push({

            employeeId:
              employeeId,

            name:
              employeeName,

            descriptor:
              Array.from(
                detection.descriptor
              )

          });

        }

      } catch (error) {

        console.error(
          "PHOTO ERROR:",
          employeeId,
          error
        );

      }


      completed++;


      databaseInfo.innerText =
        "PROCESSING FACE " +
        completed +
        " / " +
        list.length;

    }

  }


  const workers =
    [];


  const workerCount =
    Math.min(
      CONCURRENCY,
      list.length
    );


  for (
    let i = 0;
    i < workerCount;
    i++
  ) {

    workers.push(
      worker()
    );

  }


  await Promise.all(
    workers
  );


  if (
    descriptors.length === 0
  ) {

    throw new Error(
      "NO FACE DESCRIPTOR FOUND"
    );

  }


  /*
   * SAVE CACHE
   */

  setStatus(
    "SAVING FACE CACHE..."
  );


  await clearCache();


  for (
    let i = 0;
    i < descriptors.length;
    i += 20
  ) {

    const batch =
      descriptors.slice(
        i,
        i + 20
      );


    await Promise.all(

      batch.map(
        function(item) {

          return saveCache(

            item.employeeId,

            item.name,

            item.descriptor

          );

        }
      )

    );

  }


  saveCacheSignature(
    makeSignature(
      list
    )
  );


  const cached =
    await getCache();


  faceMatcher =
    buildFaceMatcher(
      cached
    );


  if (!faceMatcher) {

    throw new Error(
      "FACE MATCHER FAILED"
    );

  }


  databaseLoaded =
    true;


  databaseInfo.innerText =
    "FACE READY: " +
    cached.length +
    " / " +
    list.length +
    " EMPLOYEE";


  setStatus(
    "FACE DATABASE READY"
  );

}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadDatabase() {

  if (databaseLoaded) {
    return;
  }


  setStatus(
    "LOADING FACE DATABASE..."
  );


  /*
   * API FACES
   */

  let data;


  try {

    data =
      await getFaceDatabase();

  } catch (error) {

    throw new Error(
      "FACE DATABASE CONNECTION FAILED"
    );

  }


  if (
    !data ||
    !data.ok
  ) {

    throw new Error(

      data &&
      (
        data.message ||
        data.error
      )

        ?

        (
          data.message ||
          data.error
        )

        :

        "FACE DATABASE ERROR"

    );

  }


  employees =
    Array.isArray(
      data.faces
    )

      ?

      data.faces

      :

      [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "NO EMPLOYEE PHOTO FOUND"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  /*
   * CHECK CACHE
   */

  let cached = [];


  try {

    cached =
      await getCache();

  } catch (error) {

    cached =
      [];

  }


  const signature =
    makeSignature(
      employees
    );


  const oldSignature =
    getCacheSignature();


  /*
   * USE CACHE
   */

  if (

    oldSignature ===
      signature &&

    cached.length ===
      employees.length

  ) {

    faceMatcher =
      buildFaceMatcher(
        cached
      );


    if (faceMatcher) {

      databaseLoaded =
        true;


      databaseInfo.innerText =
        "FACE CACHE READY: " +
        cached.length +
        " / " +
        employees.length +
        " EMPLOYEE";


      setStatus(
        "FACE DATABASE READY"
      );


      return;

    }

  }


  /*
   * CACHE INVALID
   *
   * BUILD AGAIN
   */

  await buildDatabaseCache(
    employees
  );

}


/* =========================================================
   PRELOAD
   ========================================================= */

async function preloadFaceSystem() {

  if (preloadPromise) {

    return preloadPromise;

  }


  preloadPromise =
    (async function() {

      setStatus(
        "PREPARING FACE SYSTEM..."
      );


      /*
       * STEP 1
       * MODEL
       */

      await loadModels();


      /*
       * STEP 2
       * API
       */

      await testApiConnection();


      /*
       * STEP 3
       * DATABASE
       */

      await loadDatabase();


      /*
       * READY
       */

      setStatus(
        "FACE SYSTEM READY"
      );


    })()
    .catch(
      function(error) {

        preloadPromise =
          null;


        console.error(
          "FACE SYSTEM ERROR:",
          error
        );


        setStatus(
          "FACE SYSTEM ERROR"
        );


        resultBox.innerText =
          error.message ||
          "FACE SYSTEM ERROR";


        throw error;

      }
    );


  return preloadPromise;

}


/* =========================================================
   TARGET API
   ========================================================= */

async function getTarget() {

  return await apiRequest(
    "target",
    {},
    10000
  );

}


/* =========================================================
   COLUMN LETTER
   ========================================================= */

function columnToLetter(
  column
) {

  let result =
    "";


  while (
    column > 0
  ) {

    const temp =
      (column - 1) %
      26;


    result =
      String.fromCharCode(
        temp + 65
      ) +
      result;


    column =
      Math.floor(
        (column - temp - 1) /
        26
      );

  }


  return result;

}


/* =========================================================
   TIME → MINUTES
   ========================================================= */

function timeToMinutes(
  value
) {

  if (!value) {
    return null;
  }


  const text =
    String(
      value
    ).trim();


  const parts =
    text.split(
      /[:/]/
    );


  if (
    parts.length < 2
  ) {

    return null;

  }


  const hour =
    Number(
      parts[0]
    );


  const minute =
    Number(
      parts[1]
    );


  if (
    !Number.isFinite(
      hour
    ) ||

    !Number.isFinite(
      minute
    )
  ) {

    return null;

  }


  return (
    hour * 60 +
    minute
  );

}


/* =========================================================
   TIME GAP
   ========================================================= */

function validateTimeGap(
  target,
  checklist
) {

  if (!target) {

    return {
      ok: true
    };

  }


  if (!checklist) {

    return {
      ok: true
    };

  }


  const column =
    Number(
      target.column
    );


  let previousTime =
    "";


  /*
   * E
   *
   * D = SYSTEM TIME OUT
   */

  if (
    column === 5
  ) {

    previousTime =
      checklist.timeOutStamp;

  }


  /*
   * X
   *
   * V = TIME OUT
   */

  if (
    column === 24
  ) {

    previousTime =
      checklist.timeOut;

  }


  /*
   * AI
   *
   * AG = TIME OUT
   */

  if (
    column === 35
  ) {

    previousTime =
      checklist.timeOut;

  }


  if (
    !previousTime ||
    previousTime === "NOT YET"
  ) {

    return {
      ok: true
    };

  }


  const previousMinutes =
    timeToMinutes(
      previousTime
    );


  if (
    previousMinutes === null
  ) {

    return {
      ok: true
    };

  }


  const now =
    new Date();


  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  let difference =
    currentMinutes -
    previousMinutes;


  /*
   * CROSS MIDNIGHT
   */

  if (
    difference < 0
  ) {

    difference +=
      24 * 60;

  }


  /*
   * HARUS LEBIH DARI 1 MENIT
   */

  if (
    difference <= 1
  ) {

    return {

      ok: false,

      message:
        "TIME IN NOT ALLOWED\n\n" +
        "TIME OUT and TIME IN must be more than 1 minute apart."

    };

  }


  return {
    ok: true
  };

}


/* =========================================================
   PRE CAMERA VALIDATION
   ========================================================= */

function validateBeforeCamera(
  target,
  checklist
) {

  if (!target) {

    return {

      ok: false,

      message:
        "TARGET NOT READY"

    };

  }


  const column =
    Number(
      target.column
    );


  /*
   * E
   *
   * G REQUIRED
   */

  if (
    column === 5
  ) {

    const remark =
      checklist
        ?

        String(
          checklist.remark ||
          ""
        ).trim()

        :

        "";


    if (
      !remark ||
      remark === "NOT YET"
    ) {

      return {

        ok: false,

        message:
          "REMARK REQUIRED\n\n" +
          "Please enter Remark in column G before scanning Time In."

      };

    }

  }


  /*
   * AI
   *
   * AK REQUIRED
   */

  if (
    column === 35
  ) {

    const remark =
      checklist
        ?

        String(
          checklist.remark ||
          ""
        ).trim()

        :

        "";


    if (
      !remark ||
      remark === "NOT YET"
    ) {

      return {

        ok: false,

        message:
          "REMARK REQUIRED\n\n" +
          "Please enter Remark in column AK before scanning Time In."

      };

    }

  }


  /*
   * TIME GAP
   */

  const gap =
    validateTimeGap(
      target,
      checklist
    );


  if (
    !gap.ok
  ) {

    return gap;

  }


  return {
    ok: true
  };

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  scanning =
    false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  cameraStream =
    null;


  video.srcObject =
    null;


  video.style.display =
    "none";


  placeholder.style.display =
    "block";


  placeholder.innerText =
    "WAITING FOR TARGET...";


  stableCount =
    0;


  lastEmployee =
    "";

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  if (scanning) {
    return;
  }


  try {

    /*
     * MAKE SURE SYSTEM READY
     */

    await preloadFaceSystem();


    /*
     * VALIDATE TARGET AGAIN
     */

    const data =
      await getTarget();


    if (
      !data ||
      !data.ok ||
      !data.ready
    ) {

      showWarning(
        "TARGET NOT READY"
      );


      setStatus(
        "TARGET NOT READY"
      );


      return;

    }


    if (
      data.checklist
    ) {

      updateChecklist(
        data.checklist
      );

    }


    const validation =
      validateBeforeCamera(
        data,
        data.checklist
      );


    if (
      !validation.ok
    ) {

      showWarning(
        validation.message
      );


      setStatus(
        "ACTION REQUIRED"
      );


      return;

    }


    setStatus(
      "STARTING CAMERA..."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "CAMERA NOT SUPPORTED"
      );

    }


    /*
     * LOW CAMERA RESOLUTION
     *
     * DISPLAY IS SMALL
     */

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              "user",

            width: {

              ideal:
                CAMERA_WIDTH

            },

            height: {

              ideal:
                CAMERA_HEIGHT

            }

          },

          audio:
            false

        });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning =
      true;


    scanLocked =
      false;


    stableCount =
      0;


    lastEmployee =
      "";


    setStatus(
      "LOOK AT THE CAMERA"
    );


    scanFace();

  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    stopCamera();


    setStatus(
      "CAMERA ERROR"
    );


    resultBox.innerText =
      error.message ||
      "CAMERA ERROR";

  }

}


/* =========================================================
   SEND SCAN
   ========================================================= */

async function sendScan(
  employeeId,
  employeeName
) {

  return await apiRequest(

    "scan",

    {

      employeeId:
        employeeId,

      employeeName:
        employeeName

    },

    15000

  );

}


/* =========================================================
   FACE SCANNING
   ========================================================= */

async function scanFace() {

  if (!scanning) {
    return;
  }


  if (!faceMatcher) {

    setStatus(
      "FACE DATABASE NOT READY"
    );


    setTimeout(
      scanFace,
      SCAN_INTERVAL
    );


    return;

  }


  try {

    /*
     * IMPORTANT:
     *
     * detect ALL faces.
     *
     * This prevents scanning when
     * more than one person is visible.
     */

    const detections =
      await faceapi
        .detectAllFaces(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize:
                DETECTOR_INPUT_SIZE,

              scoreThreshold:
                0.5

            })

        )
        .withFaceLandmarks(
          true
        )
        .withFaceDescriptors();


    /*
     * NO FACE
     */

    if (
      detections.length === 0
    ) {

      resultBox.innerText =
        "LOOK AT THE CAMERA";


      distanceBox.innerText =
        "";


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "SCANNING..."
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /*
     * MORE THAN ONE FACE
     */

    if (
      detections.length > 1
    ) {

      resultBox.innerText =
        "ONE PERSON ONLY";


      distanceBox.innerText =
        "";


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "MULTIPLE FACES DETECTED"
      );


      showWarning(
        "ONE PERSON ONLY\n\n" +
        "Please keep other people out of the camera."
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /*
     * EXACTLY ONE FACE
     */

    const detection =
      detections[0];


    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    const employeeId =
      bestMatch.label;


    const distance =
      bestMatch.distance;


    distanceBox.innerText =
      "DISTANCE: " +
      distance.toFixed(4);


    /*
     * UNKNOWN
     */

    if (
      employeeId ===
      "unknown"
    ) {

      resultBox.innerText =
        "FACE NOT MATCHED";


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "FACE NOT MATCHED"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /*
     * FIND EMPLOYEE
     */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ) ===
          String(
            employeeId
          );

        }
      );


    const employeeName =
      employee
        ?

        employee.name

        :

        "";


    /*
     * STABLE MATCH
     */

    if (
      lastEmployee ===
      employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;

      stableCount =
        1;

    }


    resultBox.innerText =
      employeeId +
      " - " +
      employeeName;


    setStatus(

      "MATCH " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH

    );


    /*
     * VERIFIED
     */

    if (

      stableCount >=
        REQUIRED_STABLE_MATCH &&

      !scanLocked

    ) {

      scanLocked =
        true;


      /*
       * CHECK TARGET AGAIN
       */

      let latestTarget;


      try {

        latestTarget =
          await getTarget();

      } catch (error) {

        scanLocked =
          false;


        showWarning(
          "TARGET CHECK ERROR"
        );


        setStatus(
          "TARGET CHECK ERROR"
        );


        setTimeout(
          scanFace,
          WARNING_TIME
        );


        return;

      }


      if (
        !latestTarget ||
        !latestTarget.ok ||
        !latestTarget.ready
      ) {

        scanLocked =
          false;


        showWarning(
          "TARGET NOT READY"
        );


        setStatus(
          "TARGET NOT READY"
        );


        stopCamera();


        return;

      }


      if (
        latestTarget.checklist
      ) {

        updateChecklist(
          latestTarget.checklist
        );

      }


      /*
       * VALIDATE AGAIN
       */

      const validation =
        validateBeforeCamera(

          latestTarget,

          latestTarget.checklist

        );


      if (
        !validation.ok
      ) {

        scanLocked =
          false;


        stableCount =
          0;


        lastEmployee =
          "";


        showWarning(
          validation.message
        );


        setStatus(
          "ACTION REQUIRED"
        );


        setTimeout(
          scanFace,
          WARNING_TIME
        );


        return;

      }


      /*
       * SEND TO API
       */

      setStatus(
        "FACE VERIFIED"
      );


      try {

        const result =
          await sendScan(

            employeeId,

            employeeName

          );


        /*
         * UPDATE CHECKLIST
         */

        if (
          result &&
          result.checklist
        ) {

          updateChecklist(
            result.checklist
          );

        }


        /*
         * SUCCESS
         */

        if (
          result &&
          result.ok
        ) {

          const employeeColumns = [

            1,
            20,
            31

          ];


          const isEmployeeScan =
            employeeColumns.indexOf(
              Number(
                latestTarget.column
              )
            ) !== -1;


          if (
            isEmployeeScan
          ) {

            resultBox.innerText =
              "✓ EMPLOYEE SAVED\n" +
              employeeId +
              " - " +
              employeeName;


            setStatus(
              "EMPLOYEE SCAN COMPLETED"
            );

          } else {

            resultBox.innerText =
              "✓ TIME IN SAVED\n" +
              employeeName +
              "\n" +
              (
                result.timeIn ||
                ""
              );


            setStatus(
              "TIME IN COMPLETED"
            );

          }


          /*
           * CAMERA OFF
           */

          stopCamera();


          currentTarget =
            null;


          scanLocked =
            false;


          return;

        }


        /*
         * REJECTED
         */

        scanLocked =
          false;


        stableCount =
          0;


        lastEmployee =
          "";


        const message =
          result &&
          (
            result.message ||
            result.error
          )

            ?

            (
              result.message ||
              result.error
            )

            :

            "SCAN REJECTED";


        resultBox.innerText =
          message;


        showWarning(
          message
        );


        setStatus(
          "SCAN REJECTED"
        );


        /*
         * CAMERA STAYS ON
         */

        setTimeout(
          scanFace,
          WARNING_TIME
        );


        return;


      } catch (error) {

        scanLocked =
          false;


        stableCount =
          0;


        lastEmployee =
          "";


        resultBox.innerText =
          error.message ||
          "SCAN ERROR";


        showWarning(
          error.message ||
          "SCAN ERROR"
        );


        setStatus(
          "SCAN ERROR"
        );


        setTimeout(
          scanFace,
          WARNING_TIME
        );


        return;

      }

    }


  } catch (error) {

    console.error(
      "FACE SCAN ERROR:",
      error
    );

  }


  /*
   * CONTINUE SCANNING
   */

  if (scanning) {

    setTimeout(
      scanFace,
      SCAN_INTERVAL
    );

  }

}


/* =========================================================
   TARGET MONITOR
   ========================================================= */

function startTargetMonitor() {

  checkTarget();


  setInterval(
    checkTarget,
    TARGET_CHECK_INTERVAL
  );

}


/* =========================================================
   CHECK TARGET
   ========================================================= */

async function checkTarget() {

  if (targetChecking) {
    return;
  }


  targetChecking =
    true;


  try {

    /*
     * FACE SYSTEM HARUS READY
     */

    if (
      !databaseLoaded ||
      !faceMatcher
    ) {

      return;

    }


    const data =
      await getTarget();


    if (
      !data ||
      !data.ok
    ) {

      return;

    }


    /*
     * UPDATE CHECKLIST
     */

    if (
      data.checklist
    ) {

      updateChecklist(
        data.checklist
      );

    }


    /*
     * TARGET NOT READY
     */

    if (
      !data.ready
    ) {

      if (scanning) {

        stopCamera();

      }


      return;

    }


    /*
     * VALID TARGET
     */

    if (
      !data.sheet ||
      !data.row ||
      !data.column
    ) {

      return;

    }


    const allowed =
      [

        1,
        5,
        20,
        24,
        31,
        35

      ];


    if (
      allowed.indexOf(
        Number(
          data.column
        )
      ) === -1
    ) {

      return;

    }


    const newKey =
      data.sheet +
      "|" +
      data.row +
      "|" +
      data.column;


    const oldKey =
      currentTarget

        ?

        currentTarget.sheet +
        "|" +
        currentTarget.row +
        "|" +
        currentTarget.column

        :

        "";


    /*
     * NEW TARGET
     */

    if (
      newKey !==
      oldKey
    ) {

      if (scanning) {

        stopCamera();

      }


      currentTarget = {

        sheet:
          data.sheet,

        row:
          Number(
            data.row
          ),

        column:
          Number(
            data.column
          )

      };


      scanLocked =
        false;


      stableCount =
        0;


      lastEmployee =
        "";


      targetInfo.innerText =
        "TARGET: " +
        data.sheet +
        "!" +
        columnToLetter(
          Number(
            data.column
          )
        ) +
        data.row;


      resultBox.innerText =
        "";


      distanceBox.innerText =
        "";


      /*
       * VALIDATE
       */

      const validation =
        validateBeforeCamera(

          currentTarget,

          data.checklist

        );


      if (
        !validation.ok
      ) {

        showWarning(
          validation.message
        );


        setStatus(
          "ACTION REQUIRED"
        );


        return;

      }


      /*
       * AUTO CAMERA
       */

      await startCamera();

    }


  } catch (error) {

    console.log(
      "TARGET CHECK:",
      error.message
    );

  } finally {

    targetChecking =
      false;

  }

}


/* =========================================================
   CLEAR CACHE
   ========================================================= */

window.clearFaceCache =
  async function() {

    try {

      await clearCache();


      localStorage.removeItem(
        CACHE_SIGNATURE
      );


      databaseLoaded =
        false;


      faceMatcher =
        null;


      employees =
        [];


      preloadPromise =
        null;


      databaseInfo.innerText =
        "CACHE CLEARED";


      setStatus(
        "CACHE CLEARED - REFRESH PAGE"
      );


    } catch (error) {

      console.error(
        error
      );

    }

  };


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  "load",
  async function() {

    try {

      setStatus(
        "STARTING FACE SYSTEM..."
      );


      targetInfo.innerText =
        "WAITING FOR TARGET";


      databaseInfo.innerText =
        "PREPARING FACE DATABASE...";


      /*

       */

      await preloadFaceSystem();


      /*
       * AFTER READY
       * START TARGET MONITOR
       */

      setStatus(
        "FACE SYSTEM READY"
      );


      startTargetMonitor();


    } catch (error) {

      console.error(
        "PAGE START ERROR:",
        error
      );


      setStatus(
        "FACE SYSTEM ERROR"
      );


      resultBox.innerText =
        error.message ||
        "FACE SYSTEM ERROR";

    }

  }
);
