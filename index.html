<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:8px 10px 18px;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center
}

h1{
  margin:4px 0 8px;
  font-size:30px
}

#cameraBox{
  width:320px;
  height:240px;
  margin:0 auto;
  background:#222;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center
}

#video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  transform:scaleX(-1)
}

#cameraBox.active #video{
  display:block
}

#placeholder{
  font-size:19px;
  color:#aaa;
  padding:15px
}

#cameraBox.active #placeholder{
  display:none
}

#centerGuide{
  position:absolute;
  width:150px;
  height:190px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.65);
  border-radius:75px 75px 55px 55px;
  pointer-events:none;
  display:none
}

#cameraBox.active #centerGuide{
  display:block
}

#status{
  margin-top:8px;
  font-size:21px;
  font-weight:bold
}

#result{
  margin-top:5px;
  font-size:22px;
  font-weight:bold;
  min-height:30px;
  white-space:pre-line
}

#warning{
  position:fixed;
  left:50%;
  top:50%;
  transform:
    translate(-50%,-50%)
    perspective(1000px)
    rotateX(0deg);
  width:380px;
  max-width:90vw;
  padding:38px 30px 30px;
  background:
    linear-gradient(
      145deg,
      #252525 0%,
      #111 45%,
      #050505 100%
    );
  border-radius:26px;
  border:1px solid rgba(255,180,0,.45);
  box-shadow:
    0 35px 90px rgba(0,0,0,.85),
    0 0 35px rgba(255,170,0,.18),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -12px 30px rgba(0,0,0,.65);
  color:#fff;
  font-size:19px;
  font-weight:bold;
  line-height:1.5;
  text-align:center;
  white-space:pre-line;
  z-index:99999;
  display:none;
  overflow:hidden;
  animation:
    warning3D
    .35s
    cubic-bezier(.2,.8,.2,1)
}

#warning::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:
    linear-gradient(
      90deg,
      transparent,
      #ffcc66,
      #fff,
      #ff9900,
      transparent
    );
  box-shadow:
    0 0 15px
      rgba(255,170,0,.8)
}

#warningIcon{
  width:76px;
  height:76px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  color:#ffd166;
  background:
    radial-gradient(
      circle,
      rgba(255,190,60,.20),
      rgba(255,120,0,.04)
    );
  border:1px solid rgba(255,190,60,.35);
  border-radius:50%;
  box-shadow:
    0 0 15px rgba(255,190,60,.35),
    0 0 35px rgba(255,140,0,.18),
    inset 0 0 20px rgba(255,190,60,.08);
  animation:
    warningPulse
    1.5s
    ease-in-out
    infinite
}

@keyframes warningPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

#warningTitle{
  font-size:23px;
  font-weight:900;
  letter-spacing:.5px;
  margin-bottom:18px;
  color:#fff;
  text-shadow:
    0 2px 5px rgba(0,0,0,.8),
    0 0 12px rgba(255,190,80,.25)
}

#warningMessage{
  font-size:17px;
  line-height:1.55;
  white-space:pre-line;
  margin-bottom:26px;
  color:#e8e8e8
}

#warningClose{
  position:absolute;
  top:12px;
  right:12px;
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:
    linear-gradient(
      145deg,
      #444,
      #222
    );
  color:#fff;
  font-size:23px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:
    0 5px 15px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.15);
  transition:.2s
}

#warningClose:hover{
  transform:
    rotate(90deg)
    scale(1.08);
  box-shadow:
    0 0 15px
      rgba(255,255,255,.2)
}

#warningOk{
  min-width:125px;
  padding:13px 30px;
  border:none;
  border-radius:12px;
  background:
    linear-gradient(
      145deg,
      #ffffff,
      #dcdcdc
    );
  color:#111;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  box-shadow:
    0 8px 20px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.9);
  transition:.2s
}

#warningOk:hover{
  transform:
    translateY(-2px)
    scale(1.04)
}

@keyframes warning3D{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      perspective(1000px)
      rotateX(-35deg)
      rotateY(8deg)
      scale(.65)
  }

  55%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      perspective(1000px)
      rotateX(7deg)
      rotateY(-2deg)
      scale(1.04)
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      perspective(1000px)
      rotateX(0deg)
      rotateY(0deg)
      scale(1)
  }
}

#warning::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      circle at center,
      rgba(255,170,0,.05),
      rgba(0,0,0,.72)
    );
  backdrop-filter:blur(6px);
  z-index:-1
}

#distance,
#targetInfo,
#databaseInfo{
  margin-top:3px;
  font-size:14px;
  color:#aaa
}

#checklist{
  width:320px;
  margin:7px auto;
  text-align:left;
  background:#222;
  border-radius:10px;
  overflow:hidden
}

.checkRow{
  display:grid;
  grid-template-columns:125px 1fr;
  border-bottom:1px solid #444
}

.checkLabel{
  padding:6px;
  font-weight:bold;
  background:#292929;
  font-size:13px
}

.checkValue{
  padding:6px;
  color:#ddd;
  font-size:13px
}

@media(max-width:380px){
  #cameraBox,
  #checklist,
  #warning{
    width:300px
  }
}
</style>
</head>

<script>

/* =========================================================
   FACE SCANNER FINAL
   ========================================================= */


/* =========================================================
   CONFIG
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwGlmYYkvlm__QOQ1cyTOHB5Zi0eJwkGzaINKOTbTieG_z1E6dCBKkP9xYTX-vnwVoI/exec";


const MODEL_URL =
  "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


const MATCH_THRESHOLD =
  0.50;


const REQUIRED_STABLE_MATCH =
  2;


const CAMERA_WIDTH =
  640;


const CAMERA_HEIGHT =
  480;


const DETECTOR_INPUT_SIZE =
  128;


const TARGET_CHECK_INTERVAL =
  250;


const SCAN_INTERVAL =
  100;


const WARNING_TIME =
  0;


const CENTER_TOLERANCE =
  0.40;


/* =========================================================
   CACHE
   ========================================================= */

const CACHE_DB_NAME =
  "FACE_SCANNER_CACHE_FINAL";


const CACHE_DB_VERSION =
  1;


const CACHE_STORE =
  "DESCRIPTORS";


const CACHE_SIGNATURE =
  "FACE_DATABASE_SIGNATURE_FINAL";


/* =========================================================
   ELEMENTS
   ========================================================= */

const video =
  document.getElementById(
    "video"
  );


const cameraBox =
  document.getElementById(
    "cameraBox"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const resultBox =
  document.getElementById(
    "result"
  );


const distanceBox =
  document.getElementById(
    "distance"
  );


const targetInfo =
  document.getElementById(
    "targetInfo"
  );


const databaseInfo =
  document.getElementById(
    "databaseInfo"
  );


const warningBox =
  document.getElementById(
    "warning"
  );


/* =========================================================
   STATE
   ========================================================= */

let employees =
  [];


let faceMatcher =
  null;


let cameraStream =
  null;


/*
   TOKEN CAMERA

   Setiap start camera mendapatkan token baru.

   Kalau stopCamera() dipanggil ketika
   getUserMedia() masih menunggu,
   token akan berubah.

   Request lama otomatis dibatalkan.
*/

let cameraRequestToken =
  0;


let scanTimer =
  null;


let targetTimer =
  null;


let scanning =
  false;


let scanLocked =
  false;


let stableCount =
  0;


let lastEmployee =
  "";


let modelsLoaded =
  false;


let databaseLoaded =
  false;


let currentTarget =
  null;


let preloadPromise =
  null;


let targetChecking =
  false;


let completedTargetKey =
  "";


let cameraHold =
  false;


let scanProcessing =
  false;


let warningTimer =
  null;


let lastWarning =
  "";


let dismissedWarning =
  "";


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  text
) {

  statusBox.innerText =
    text || "";

}


/* =========================================================
   WARNING
   ========================================================= */

function showWarning(
  text
) {

  clearTimeout(
    warningTimer
  );

  if (!text) {

    warningBox.style.display =
      "none";

    return;

  }

  const parts =
    String(text).split(
      "\n\n"
    );

  const title =
    parts[0] ||
    "WARNING";

  const message =
    parts
      .slice(1)
      .join("\n\n") ||
    "";

  document.getElementById(
    "warningTitle"
  ).innerText =
    title;

  document.getElementById(
    "warningMessage"
  ).innerText =
    message;

  warningBox.style.display =
    "block";

}


/*
   CLOSE WARNING

   Warning yang sama tidak akan
   muncul terus selama target sama.
*/

document.getElementById(
  "warningClose"
).addEventListener(
  "click",
  function() {

    dismissedWarning =
      lastWarning;

    warningBox.style.display =
      "none";

  }
);


/*
   OK WARNING
*/

document.getElementById(
  "warningOk"
).addEventListener(
  "click",
  function() {

    dismissedWarning =
      lastWarning;

    warningBox.style.display =
      "none";

  }
);


/* =========================================================
   CHECKLIST
   ========================================================= */

function updateChecklist(
  checklist
) {

  if (!checklist) {
    return;
  }

  document.getElementById(
    "checkEmployee"
  ).innerText =
    checklist.employeeNo ||
    "NOT YET";

  document.getElementById(
    "checkName"
  ).innerText =
    checklist.name ||
    "NOT YET";

  document.getElementById(
    "checkTimeout"
  ).innerText =
    checklist.timeOut ||
    "NOT YET";

  document.getElementById(
    "checkTimeoutStamp"
  ).innerText =
    checklist.systemTimeOut ||
    "NOT YET";

  document.getElementById(
    "checkTimeIn"
  ).innerText =
    checklist.timeIn ||
    "NOT YET";

  document.getElementById(
    "checkTimeInStamp"
  ).innerText =
    checklist.systemTimeIn ||
    "NOT YET";

  document.getElementById(
    "checkRemark"
  ).innerText =
    checklist.remark ||
    "NOT YET";

}


/* =========================================================
   COLUMN LETTER
   ========================================================= */

function columnToLetter(
  column
) {

  let temp =
    Number(column);

  let letter =
    "";

  while (
    temp > 0
  ) {

    const mod =
      (temp - 1) %
      26;

    letter =
      String.fromCharCode(
        65 + mod
      ) +
      letter;

    temp =
      Math.floor(
        (temp - 1) / 26
      );

  }

  return letter;

}


/* =========================================================
   API
   ========================================================= */

async function apiRequest(
  action,
  payload
) {

  const body =
    Object.assign(
      {
        action: action
      },
      payload || {}
    );

  const response =
    await fetch(
      API_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:
          JSON.stringify(body)
      }
    );

  return await response.json();

}


/* =========================================================
   GET CURRENT TARGET
   ========================================================= */

async function getCurrentTarget() {

  try {

    const response =
      await apiRequest(
        "getCurrentTarget"
      );

    return response;

  } catch (error) {

    console.error(
      "TARGET ERROR:",
      error
    );

    return {
      ok:false
    };

  }

}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadFaceDatabase() {

  const response =
    await apiRequest(
      "getFaces"
    );

  if (
    !response ||
    !response.ok
  ) {

    throw new Error(
      "FACE DATABASE FAILED"
    );

  }

  employees =
    Array.isArray(
      response.faces
    )
      ? response.faces
      : [];

  databaseInfo.innerText =
    "FACE DATABASE: " +
    employees.length +
    " FACES";

}


/* =========================================================
   INDEXED DB
   ========================================================= */

function openCacheDB() {

  return new Promise(
    function(resolve,reject) {

      const request =
        indexedDB.open(
          CACHE_DB_NAME,
          CACHE_DB_VERSION
        );

      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;

          if (
            !db.objectStoreNames.contains(
              CACHE_STORE
            )
          ) {

            db.createObjectStore(
              CACHE_STORE
            );

          }

        };

      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   CACHE READ
   ========================================================= */

async function readFaceCache() {

  try {

    const db =
      await openCacheDB();

    return new Promise(
      function(resolve) {

        const tx =
          db.transaction(
            CACHE_STORE,
            "readonly"
          );

        const store =
          tx.objectStore(
            CACHE_STORE
          );

        const request =
          store.get(
            CACHE_SIGNATURE
          );

        request.onsuccess =
          function() {

            resolve(
              request.result ||
              null
            );

          };

        request.onerror =
          function() {

            resolve(
              null
            );

          };

      }
    );

  } catch (error) {

    return null;

  }

}


/* =========================================================
   CACHE WRITE
   ========================================================= */

async function writeFaceCache(
  value
) {

  try {

    const db =
      await openCacheDB();

    return new Promise(
      function(resolve) {

        const tx =
          db.transaction(
            CACHE_STORE,
            "readwrite"
          );

        const store =
          tx.objectStore(
            CACHE_STORE
          );

        store.put(
          value,
          CACHE_SIGNATURE
        );

        tx.oncomplete =
          function() {

            resolve(
              true
            );

          };

        tx.onerror =
          function() {

            resolve(
              false
            );

          };

      }
    );

  } catch (error) {

    return false;

  }

}


/* =========================================================
   LOAD MODELS
   ========================================================= */

async function loadModels() {

  await Promise.all([

    faceapi.nets.tinyFaceDetector.loadFromUri(
      MODEL_URL
    ),

    faceapi.nets.faceLandmark68Net.loadFromUri(
      MODEL_URL
    ),

    faceapi.nets.faceRecognitionNet.loadFromUri(
      MODEL_URL
    )

  ]);

  modelsLoaded =
    true;

}


/* =========================================================
   BUILD FACE MATCHER
   ========================================================= */

async function buildFaceMatcher() {

  const cache =
    await readFaceCache();

  /*
     Kalau cache cocok dengan database
     dan descriptor masih valid,
     gunakan cache.
  */

  if (
    cache &&
    Array.isArray(
      cache.descriptors
    ) &&
    cache.descriptors.length
  ) {

    try {

      const labeledDescriptors =
        cache.descriptors.map(
          function(item) {

            return new faceapi.LabeledFaceDescriptors(

              String(
                item.employeeId
              ),

              [
                new Float32Array(
                  item.descriptor
                )
              ]

            );

          }
        );

      faceMatcher =
        new faceapi.FaceMatcher(
          labeledDescriptors,
          MATCH_THRESHOLD
        );

      return;

    } catch (error) {

      console.warn(
        "CACHE INVALID:",
        error
      );

    }

  }


  /*
     Kalau belum ada cache,
     proses foto database.
  */

  const descriptors =
    [];

  for (
    const employee of employees
  ) {

    if (
      !employee.photo
    ) {

      continue;

    }

    try {

      const image =
        await faceapi.fetchImage(
          employee.photo
        );

      const detection =
        await faceapi
          .detectSingleFace(
            image,
            new faceapi
              .TinyFaceDetectorOptions({
                inputSize:
                  DETECTOR_INPUT_SIZE,
                scoreThreshold:
                  0.5
              })
          )
          .withFaceLandmarks()
          .withFaceDescriptor();

      if (
        !detection
      ) {

        continue;

      }

      descriptors.push({

        employeeId:
          String(
            employee.employeeId
          ),

        descriptor:
          Array.from(
            detection.descriptor
          )

      });

    } catch (error) {

      console.warn(
        "PHOTO ERROR:",
        employee.employeeId,
        error
      );

    }

  }


  if (
    !descriptors.length
  ) {

    throw new Error(
      "NO VALID FACE DATABASE"
    );

  }


  await writeFaceCache({

    descriptors:
      descriptors

  });


  const labeledDescriptors =
    descriptors.map(
      function(item) {

        return new faceapi.LabeledFaceDescriptors(

          String(
            item.employeeId
          ),

          [
            new Float32Array(
              item.descriptor
            )
          ]

        );

      }
    );


  faceMatcher =
    new faceapi.FaceMatcher(
      labeledDescriptors,
      MATCH_THRESHOLD
    );

}


/* =========================================================
   PRELOAD
   ========================================================= */

async function preloadFaceSystem() {

  if (
    preloadPromise
  ) {

    return preloadPromise;

  }

  preloadPromise =
    (async function() {

      try {

        setStatus(
          "LOADING FACE MODEL..."
        );

        await loadModels();

        setStatus(
          "LOADING FACE DATABASE..."
        );

        await loadFaceDatabase();

        setStatus(
          "BUILDING FACE CACHE..."
        );

        await buildFaceMatcher();

        databaseLoaded =
          true;

        setStatus(
          "FACE SYSTEM READY"
        );

        databaseInfo.innerText =
          "FACE DATABASE READY: " +
          employees.length +
          " FACES";

        /*
           Setelah system ready,
           mulai cek target.
        */

        checkTarget();

      } catch (error) {

        console.error(
          "PRELOAD ERROR:",
          error
        );

        setStatus(
          "FACE SYSTEM ERROR"
        );

        resultBox.innerText =
          error.message ||
          "FACE SYSTEM FAILED";

      }

    })();

  return preloadPromise;

}


/* =========================================================
   TIME PARSER
   ========================================================= */

function parseTimeToMinutes(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return null;

  }

  const text =
    String(
      value
    ).trim();

  if (
    !text
  ) {

    return null;

  }

  /*
     Terima HH:mm
     atau HH/mm.
  */

  const match =
    text.match(
      /^(\d{1,2})[:\/](\d{2})$/
    );

  if (
    !match
  ) {

    return null;

  }

  const hour =
    Number(
      match[1]
    );

  const minute =
    Number(
      match[2]
    );

  if (
    hour < 0 ||
    hour > 23 ||
    minute < 0 ||
    minute > 59
  ) {

    return null;

  }

  return (
    hour * 60 +
    minute
  );

}


/* =========================================================
   TIME GAP
   ========================================================= */

function validateTimeGap(
  target,
  checklist
) {

  /*
     Hanya berlaku untuk
     E / X / AI.
  */

  const column =
    Number(
      target.column
    );

  if (
    ![
      5,
      24,
      35
    ].includes(
      column
    )
  ) {

    return {
      ok:true
    };

  }


  if (
    !checklist
  ) {

    return {
      ok:false,
      message:
        "TIME IN NOT ALLOWED\n\n" +
        "Attendance information is not ready yet."
    };

  }


  const timeOutText =
    checklist.systemTimeOut &&
    checklist.systemTimeOut !==
      "NOT YET"

      ? checklist.systemTimeOut

      : checklist.timeOut &&
        checklist.timeOut !==
          "NOT YET"

        ? checklist.timeOut

        : "";


  const outMinutes =
    parseTimeToMinutes(
      timeOutText
    );


  if (
    outMinutes === null
  ) {

    return {
      ok:false,
      message:
        "TIME IN NOT ALLOWED\n\n" +
        "Time Out has not been recorded yet."
    };

  }


  /*
     Waktu sekarang Colombo.
  */

  const colomboParts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:
          "Asia/Colombo",
        hour:
          "2-digit",
        minute:
          "2-digit",
        hour12:
          false
      }
    ).formatToParts(
      new Date()
    );


  const hourPart =
    colomboParts.find(
      function(p) {
        return p.type ===
          "hour";
      }
    );


  const minutePart =
    colomboParts.find(
      function(p) {
        return p.type ===
          "minute";
      }
    );


  const colomboHour =
    Number(
      hourPart.value
    );


  const colomboMinute =
    Number(
      minutePart.value
    );


  const nowMinutes =
    colomboHour * 60 +
    colomboMinute;


  /*
     Hitung selisih.
     Support lewat tengah malam.
  */

  let difference =
    nowMinutes -
    outMinutes;


  if (
    difference < 0
  ) {

    difference +=
      24 * 60;

  }


  /*
     HARUS LEBIH DARI 1 MENIT.

     0 menit  -> TIDAK BOLEH
     1 menit  -> TIDAK BOLEH
     2 menit+ -> BOLEH
  */

  if (
    difference <= 1
  ) {

    return {

      ok:false,

      message:
        "TIME IN NOT ALLOWED\n\n" +
        "Time In must be more than 1 minute after Time Out."

    };

  }


  return {
    ok:true
  };

}


/* =========================================================
   VALIDATE BEFORE CAMERA
   ========================================================= */

function validateBeforeCamera(
  target,
  checklist
) {

  if (
    !target
  ) {

    return {

      ok:false,

      message:
        "TARGET NOT READY\n\n" +
        "Please select a valid scan target."

    };

  }


  const column =
    Number(
      target.column
    );


  /*
     E
     A harus ada
     G wajib isi
  */

  if (
    column === 5
  ) {

    const employeeNo =
      checklist
        ? String(
            checklist.employeeNo ||
            ""
          ).trim()
        : "";


    if (
      !employeeNo ||
      employeeNo ===
        "NOT YET"
    ) {

      return {

        ok:false,

        message:
          "TIME IN NOT ALLOWED\n\n" +
          "Please scan Employee No in column A first."

      };

    }


    const remark =
      checklist
        ? String(
            checklist.remark ||
            ""
          ).trim()
        : "";


    if (
      !remark ||
      remark ===
        "NOT YET"
    ) {

      return {

        ok:false,

        message:
          "REMARK REQUIRED\n\n" +
          "Please enter Remark in column G before scanning Time In."

      };

    }

  }


  /*
     AI
     AE harus ada
     AK wajib isi
  */

  if (
    column === 35
  ) {

    const employeeNo =
      checklist
        ? String(
            checklist.employeeNo ||
            ""
          ).trim()
        : "";


    if (
      !employeeNo ||
      employeeNo ===
        "NOT YET"
    ) {

      return {

        ok:false,

        message:
          "TIME IN NOT ALLOWED\n\n" +
          "Please scan Employee No in column AE first."

      };

    }


    const remark =
      checklist
        ? String(
            checklist.remark ||
            ""
          ).trim()
        : "";


    if (
      !remark ||
      remark ===
        "NOT YET"
    ) {

      return {

        ok:false,

        message:
          "REMARK REQUIRED\n\n" +
          "Please enter Remark in column AK before scanning Time In."

      };

    }

  }


  /*
     X
     T harus ada
     Remark tidak diperlukan.
  */

  if (
    column === 24
  ) {

    const employeeNo =
      checklist
        ? String(
            checklist.employeeNo ||
            ""
          ).trim()
        : "";


    if (
      !employeeNo ||
      employeeNo ===
        "NOT YET"
    ) {

      return {

        ok:false,

        message:
          "TIME IN NOT ALLOWED\n\n" +
          "Please scan Employee No in column T first."

      };

    }

  }


  /*
     TIME GAP
  */

  const gap =
    validateTimeGap(
      target,
      checklist
    );


  if (
    !gap.ok
  ) {

    return {

      ok:false,

      message:
        gap.message

    };

  }


  return {
    ok:true
  };

}


/* =========================================================
   TARGET CHECK
   ========================================================= */

async function checkTarget() {

  if (
    targetChecking ||
    !databaseLoaded ||
    scanning ||
    scanProcessing
  ) {

    return;

  }


  targetChecking =
    true;


  try {

    const data =
      await getCurrentTarget();


    if (
      !data ||
      !data.ok
    ) {

      return;

    }


    if (
      data.checklist
    ) {

      updateChecklist(
        data.checklist
      );

    }


    /*
       TARGET TIDAK READY
    */

    if (
      !data.ready
    ) {

      stopCamera();


      currentTarget =
        null;


      scanLocked =
        false;


      stableCount =
        0;


      lastEmployee =
        "";


      if (
        data.warning
      ) {

        if (
          data.warning !==
          dismissedWarning
        ) {

          lastWarning =
            data.warning;

          showWarning(
            data.warning
          );

        }

        setStatus(
          "ACTION REQUIRED"
        );

      } else {

        targetInfo.innerText =
          "WAITING FOR TARGET";

      }


      return;

    }


    const column =
      Number(
        data.column
      );


    const allowed =
      [
        1,
        5,
        13,
        20,
        24,
        31,
        35
      ];


    if (
      !data.sheet ||
      !data.row ||
      !allowed.includes(
        column
      )
    ) {

      return;

    }


    const newKey =
      data.sheet +
      "|" +
      data.row +
      "|" +
      column;


    /*
       TARGET SUDAH BERHASIL DI-SCAN.

       Jangan hidupkan camera lagi
       sampai target benar-benar berubah.
    */

    if (
      newKey ===
      completedTargetKey
    ) {

      cameraHold =
        true;

      stopCamera();

      return;

    }


    /*
       TARGET BERUBAH.

       Karena ini target baru,
       warning lama boleh digunakan lagi.
    */

    if (
      currentTarget &&
      (
        currentTarget.sheet +
        "|" +
        currentTarget.row +
        "|" +
        currentTarget.column
      ) !==
      newKey
    ) {

      dismissedWarning =
        "";

      lastWarning =
        "";

      completedTargetKey =
        "";

      cameraHold =
        false;

    }


    const oldKey =
      currentTarget

        ? currentTarget.sheet +
          "|" +
          currentTarget.row +
          "|" +
          currentTarget.column

        : "";


    /*
       TARGET SAMA

       Jangan membuat target baru.

       Tetapi WAJIB re-check validation.

       Ini penting:
       - G baru diisi
       - AK baru diisi
       - waktu sudah lewat >1 menit

       Setelah valid → camera ON.
    */

    if (
      newKey ===
      oldKey
    ) {

      const sameValidation =
        validateBeforeCamera(
          currentTarget,
          data.checklist
        );


      if (
        !sameValidation.ok
      ) {

        lastWarning =
          sameValidation.message;


        if (
          sameValidation.message !==
          dismissedWarning
        ) {

          showWarning(
            sameValidation.message
          );

        }


        setStatus(
          "ACTION REQUIRED"
        );


        stopCamera();


        return;

      }


      /*
         TARGET SAMA TAPI SEKARANG VALID.
         CAMERA BOLEH HIDUP.
      */

      if (
        !cameraHold &&
        !scanning &&
        !scanProcessing
      ) {

        await startCamera();

      }


      return;

    }


    /*
       TARGET BARU
    */

    cameraHold =
      false;


    scanLocked =
      false;


    stableCount =
      0;


    lastEmployee =
      "";


    currentTarget = {

      sheet:
        data.sheet,

      row:
        Number(
          data.row
        ),

      column:
        column

    };


    targetInfo.innerText =
      "TARGET: " +
      data.sheet +
      "!" +
      columnToLetter(
        column
      ) +
      data.row;


    resultBox.innerText =
      "";


    distanceBox.innerText =
      "";


    updateChecklist(
      data.checklist
    );


    const validation =
      validateBeforeCamera(
        currentTarget,
        data.checklist
      );


    if (
      !validation.ok
    ) {

      lastWarning =
        validation.message;


      if (
        validation.message !==
        dismissedWarning
      ) {

        showWarning(
          validation.message
        );

      }


      setStatus(
        "ACTION REQUIRED"
      );


      stopCamera();


      return;

    }


    /*
       TARGET VALID.
       CAMERA ON.
    */

    await startCamera();

  } catch (error) {

    console.error(
      "CHECK TARGET ERROR:",
      error
    );

  } finally {

    targetChecking =
      false;

  }

}


/* =========================================================
   TARGET TIMER
   ========================================================= */

if (
  !targetTimer
) {

  checkTarget();

  targetTimer =
    setInterval(
      checkTarget,
      TARGET_CHECK_INTERVAL
    );

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  if (
    scanning ||
    cameraHold
  ) {

    return;

  }


  if (
    !modelsLoaded ||
    !databaseLoaded ||
    !faceMatcher
  ) {

    setStatus(
      "FACE SYSTEM NOT READY"
    );

    return;

  }


  if (
    !currentTarget
  ) {

    return;

  }


  try {

    /*
       TOKEN BARU
    */

    const requestToken =
      ++cameraRequestToken;


    let stream =
      cameraStream;


    /*
       Kalau belum ada stream,
       minta permission camera.
    */

    if (
      !stream
    ) {

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            width:{
              ideal:
                CAMERA_WIDTH
            },

            height:{
              ideal:
                CAMERA_HEIGHT
            },

            facingMode:
              "user"

          },

          audio:false

        });


      /*
         SELAMA getUserMedia() MENUNGGU,
         bisa saja user sudah scan SUCCESS
         dan stopCamera() dipanggil.

         Kalau token berubah,
         stream BARU langsung dimatikan.
      */

      if (
        requestToken !==
          cameraRequestToken ||
        cameraHold ||
        !currentTarget
      ) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

        return;

      }


      cameraStream =
        stream;

    }


    /*
       CHECK LAGI SEBELUM CAMERA ON
    */

    if (
      requestToken !==
        cameraRequestToken ||
      cameraHold ||
      !currentTarget
    ) {

      return;

    }


    cameraStream
      .getVideoTracks()
      .forEach(
        function(track) {

          track.enabled =
            true;

        }
      );


    video.srcObject =
      cameraStream;


    await video.play();


    /*
       CHECK LAGI SETELAH play()

       Ini mencegah camera muncul
       kalau stopCamera() terjadi
       selama await video.play().
    */

    if (
      requestToken !==
        cameraRequestToken ||
      cameraHold ||
      !currentTarget
    ) {

      stopCamera();

      return;

    }


    cameraBox.classList.add(
      "active"
    );


    scanning =
      true;


    scanLocked =
      false;


    stableCount =
      0;


    lastEmployee =
      "";


    setStatus(
      "CAMERA READY"
    );


    resultBox.innerText =
      "LOOK AT THE CAMERA";


    startScanLoop();

  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    scanning =
      false;


    setStatus(
      "CAMERA ERROR"
    );


    resultBox.innerText =
      "PLEASE ALLOW CAMERA ACCESS";

  }

}


/* =========================================================
   SCAN LOOP
   ========================================================= */

function startScanLoop() {

  if (
    scanTimer
  ) {

    return;

  }


  scanTimer =
    setInterval(
      scanFace,
      SCAN_INTERVAL
    );


  scanFace();

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  /*
     INVALIDATE SEMUA REQUEST CAMERA LAMA.

     Ini bagian penting.
  */

  cameraRequestToken++;


  scanning =
    false;


  scanLocked =
    false;


  stableCount =
    0;


  lastEmployee =
    "";


  if (
    scanTimer
  ) {

    clearInterval(
      scanTimer
    );


    scanTimer =
      null;

  }


  if (
    cameraStream
  ) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    cameraStream =
      null;

  }


  video.srcObject =
    null;


  cameraBox.classList.remove(
    "active"
  );

}


/* =========================================================
   FIND CENTER FACE
   ========================================================= */

function findCenterFace(
  detections
) {

  if (
    !detections ||
    !detections.length
  ) {

    return null;

  }


  const width =
    video.videoWidth ||
    CAMERA_WIDTH;


  const height =
    video.videoHeight ||
    CAMERA_HEIGHT;


  const centerX =
    width / 2;


  const centerY =
    height / 2;


  let bestFace =
    null;


  let bestDistance =
    Infinity;


  detections.forEach(
    function(detection) {

      const box =
        detection.detection.box;


      const faceX =
        box.x +
        box.width / 2;


      const faceY =
        box.y +
        box.height / 2;


      const distance =
        Math.hypot(

          faceX -
            centerX,

          faceY -
            centerY

        );


      if (
        distance <
        bestDistance
      ) {

        bestDistance =
          distance;


        bestFace =
          detection;

      }

    }
  );


  if (
    !bestFace
  ) {

    return null;

  }


  const box =
    bestFace.detection.box;


  const faceX =
    box.x +
    box.width / 2;


  const faceY =
    box.y +
    box.height / 2;


  const normalizedX =
    Math.abs(
      faceX -
      centerX
    ) /
    width;


  const normalizedY =
    Math.abs(
      faceY -
      centerY
    ) /
    height;


  if (
    normalizedX >
      CENTER_TOLERANCE ||
    normalizedY >
      CENTER_TOLERANCE
  ) {

    return null;

  }


  return bestFace;

}


/* =========================================================
   SEND SCAN
   ========================================================= */

async function sendScanToSheet(
  employeeId,
  employeeName
) {

  try {

    return await apiRequest(
      "scanFace",
      {
        employeeId:
          employeeId,

        employeeName:
          employeeName
      }
    );

  } catch (error) {

    console.error(
      "SEND SCAN ERROR:",
      error
    );

    return {
      ok:false,
      message:
        "SCAN REQUEST FAILED"
    };

  }

}


/* =========================================================
   SCAN FACE
   ========================================================= */

async function scanFace() {

  if (
    !scanning ||
    scanLocked ||
    scanProcessing ||
    !faceMatcher
  ) {

    return;

  }


  scanProcessing =
    true;


  try {

    if (
      video.readyState <
        2 ||
      !video.videoWidth ||
      !video.videoHeight
    ) {

      return;

    }


    /*
       DETECT SEMUA WAJAH
    */

    const detections =
      await faceapi

        .detectAllFaces(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize:
                DETECTOR_INPUT_SIZE,

              scoreThreshold:
                0.5

            })

        )

        .withFaceLandmarks(
          true
        )

        .withFaceDescriptors();


    if (
      !detections.length
    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        "NO FACE DETECTED";


      distanceBox.innerText =
        "";


      return;

    }


    /*
       Kalau lebih dari satu orang,
       ambil yang paling dekat tengah.
    */

    const centerFace =
      findCenterFace(
        detections
      );


    if (
      !centerFace
    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        detections.length > 1

          ? "CENTER FACE ONLY"

          : "MOVE FACE TO CENTER";


      distanceBox.innerText =
        "";


      return;

    }


    /*
       MATCH
    */

    const match =
      faceMatcher.findBestMatch(
        centerFace.descriptor
      );


    const employeeId =
      String(
        match.label ||
        ""
      ).trim();


    const distance =
      Number(
        match.distance
      );


    distanceBox.innerText =
      "MATCH: " +
      employeeId +
      " | DIST: " +
      distance.toFixed(
        3
      );


    /*
       FACE TIDAK DIKENAL
    */

    if (
      !employeeId ||
      employeeId ===
        "unknown" ||
      distance >
        MATCH_THRESHOLD
    ) {

      stableCount =
        0;


      lastEmployee =
        "";


      resultBox.innerText =
        "FACE NOT RECOGNIZED";


      return;

    }


    /*
       CARI NAMA
    */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ).trim() ===
            employeeId;

        }
      );


    const employeeName =
      employee

        ? String(
            employee.name ||
            ""
          ).trim()

        : "";


    /*
       STABLE MATCH
    */

    if (
      lastEmployee ===
      employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;


      stableCount =
        1;

    }


    resultBox.innerText =
      "MATCH FOUND: " +
      employeeId +
      " " +
      employeeName +
      "\n" +
      "STABLE: " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH;


    if (
      stableCount <
      REQUIRED_STABLE_MATCH
    ) {

      return;

    }


    /*
       LOCK SCAN
    */

    scanLocked =
      true;


    setStatus(
      "PROCESSING..."
    );


    resultBox.innerText =
      "PROCESSING\n" +
      employeeId +
      " " +
      employeeName;


    /*
       SEND TO GOOGLE SHEETS
    */

    const response =
      await sendScanToSheet(

        employeeId,

        employeeName

      );


    /*
       GAGAL
    */

    if (
      !response ||
      !response.ok
    ) {

      scanLocked =
        false;


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "SCAN FAILED"
      );


      resultBox.innerText =

        response &&
        (
          response.message ||
          response.error
        )

          ? (
              response.message ||
              response.error
            )

          : "SCAN FAILED";


      return;

    }


    /*
       SUCCESS
    */

    setStatus(
      "SCAN SUCCESS"
    );


    resultBox.innerText =
      "SUCCESS\n" +
      employeeId +
      " " +
      employeeName;


    /*
       SIMPAN TARGET YANG BARU SAJA SELESAI
       SEBELUM currentTarget DIKOSONGKAN.
    */

    const finishedTargetKey =
      currentTarget

        ? (
            currentTarget.sheet +
            "|" +
            currentTarget.row +
            "|" +
            currentTarget.column
          )

        : "";


    completedTargetKey =
      finishedTargetKey;


    /*
       CAMERA OFF LANGSUNG
    */

    stopCamera();


    /*
       TAHAN CAMERA.

       Target yang sama tidak boleh
       menghidupkan camera kembali.
    */

    cameraHold =
      true;


    currentTarget =
      null;


    targetInfo.innerText =
      "WAITING FOR TARGET";


    /*
       SUCCESS ditampilkan sebentar.
    */

    setTimeout(
      function() {

        resultBox.innerText =
          "";

      },
      1800
    );


  } catch (error) {

    console.error(
      "SCAN ERROR:",
      error
    );


    stableCount =
      0;


    lastEmployee =
      "";


    resultBox.innerText =
      "SCAN ERROR";

  } finally {

    scanProcessing =
      false;

  }

}


/* =========================================================
   PAGE START
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    preloadFaceSystem();

  }
);


/* =========================================================
   SAFETY
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);

   TAB SAFETY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.hidden
    ) {

      stopCamera();

    }

  }
);
