<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin: 25px;
}

#cameraBox {
  width: 90%;
  max-width: 800px;
  margin: auto;
  background: #222;
  border-radius: 15px;
  overflow: hidden;
}

#video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

#status {
  font-size: 24px;
  font-weight: bold;
  margin: 20px;
}

#result {
  font-size: 32px;
  font-weight: bold;
  margin: 20px;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
}

</style>

</head>


<body>

<h1>FACE SCANNER</h1>

<div id="cameraBox">

<video
id="video"
autoplay
muted
playsinline>
</video>

</div>

<div id="status">
LOADING...
</div>

<div id="result">
</div>

<button id="startButton">
START CAMERA
</button>


<script>

/* =====================================
   WEB APP API
===================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx3EErsXwz9mv52-YgaT3wkplnB21WvW47_MwHWANVYdBlgHeVMvqCfE5cDu96Myz6vUQ/exec";


/* =====================================
   FACE MODELS
===================================== */

const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


let video =
document.getElementById("video");

let statusBox =
document.getElementById("status");

let resultBox =
document.getElementById("result");

let startButton =
document.getElementById("startButton");


let faceMatcher = null;

let employees = [];


/* =====================================
   LOAD MODELS
===================================== */

async function loadModels() {

  statusBox.innerText =
    "LOADING FACE MODEL...";


  await faceapi.nets.tinyFaceDetector.loadFromUri(
    MODEL_URL
  );


  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
    MODEL_URL
  );


  await faceapi.nets.faceRecognitionNet.loadFromUri(
    MODEL_URL
  );

}


/* =====================================
   JSONP API
===================================== */

function apiJSONP(action) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_CALLBACK_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error("API TIMEOUT")
        );

      }, 30000);

    function cleanup() {

      clearTimeout(timeout);

      delete window[callbackName];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

    }

    window[callbackName] =
      function(data) {

        cleanup();

        resolve(data);

      };

    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "API CONNECTION ERROR"
          )
        );

      };

    script.src =
      API_URL +
      "?action=" +
      encodeURIComponent(action) +
      "&callback=" +
      encodeURIComponent(callbackName);

    document.body.appendChild(
      script
    );

  });

}


/* =====================================
   LOAD DATABASE
===================================== */

async function loadDatabase() {

  statusBox.innerText =
    "LOADING PHOTO DATABASE...";


  const data =
    await apiJSONP("faces");


  console.log(
    "DATABASE:",
    data
  );


  if (!data.ok) {

    throw new Error(
      data.message ||
      "FACE DATABASE ERROR"
    );

  }


  employees =
    data.faces || [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "NO PHOTO FOUND"
    );

  }


  const labeledDescriptors = [];


  for (
    const employee of employees
  ) {

    statusBox.innerText =
      "PROCESSING " +
      employee.employeeId +
      " - " +
      employee.name;


    try {

      const image =
        await faceapi.fetchImage(
          employee.image
        );


      const detection =
        await faceapi
          .detectSingleFace(

            image,

            new faceapi.TinyFaceDetectorOptions({

              inputSize: 320,

              scoreThreshold: 0.5

            })

          )
          .withFaceLandmarks(true)
          .withFaceDescriptor();


      if (!detection) {

        console.log(
          "FACE NOT FOUND:",
          employee.employeeId
        );

        continue;

      }


      labeledDescriptors.push(

        new faceapi.LabeledFaceDescriptors(

          String(
            employee.employeeId
          ),

          [
            detection.descriptor
          ]

        )

      );


      console.log(
        "FACE READY:",
        employee.employeeId,
        employee.name
      );


    } catch (error) {

      console.error(
        "PHOTO ERROR:",
        employee.employeeId,
        error
      );

    }

  }


  if (
    labeledDescriptors.length === 0
  ) {

    throw new Error(
      "NO FACE FOUND IN DATABASE PHOTOS"
    );

  }


  faceMatcher =
    new faceapi.FaceMatcher(

      labeledDescriptors,

      0.50

    );


  statusBox.innerText =
    "DATABASE READY - " +
    labeledDescriptors.length +
    " EMPLOYEE";

}
  


/* =====================================
   START CAMERA
===================================== */

async function startCamera() {

  try {

    startButton.disabled = true;


    await loadModels();


    await loadDatabase();


    statusBox.innerText =
      "STARTING CAMERA...";


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },

        audio: false

      });


    video.srcObject =
      stream;


    statusBox.innerText =
      "CAMERA READY - LOOK AT CAMERA";


    video.onloadedmetadata =
      function() {

        scanFace();

      };


  } catch (error) {

    console.error(error);


    statusBox.innerText =
      "ERROR";


    resultBox.innerText =
      error.message;


    startButton.disabled = false;

  }

}


/* =====================================
   FACE SCAN
===================================== */

let lastMatch = "";

let stableCount = 0;


async function scanFace() {

  try {

    const detection =
      await faceapi
        .detectSingleFace(

          video,

          new faceapi.TinyFaceDetectorOptions({

            inputSize: 320,

            scoreThreshold: 0.6

          })

        )
        .withFaceLandmarks(true)
        .withFaceDescriptor();


    if (!detection) {

      lastMatch = "";

      stableCount = 0;

      statusBox.innerText =
        "NO FACE DETECTED";

      resultBox.innerText =
        "";

      requestAnimationFrame(
        scanFace
      );

      return;

    }


    const match =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    console.log(
      "MATCH:",
      match.label,
      "DISTANCE:",
      match.distance
    );


    if (
      match.label === "unknown"
    ) {

      lastMatch = "";

      stableCount = 0;

      statusBox.innerText =
        "FACE NOT RECOGNIZED";

      resultBox.innerText =
        "UNKNOWN";

      requestAnimationFrame(
        scanFace
      );

      return;

    }


    if (
      match.label === lastMatch
    ) {

      stableCount++;

    } else {

      lastMatch =
        match.label;

      stableCount = 1;

    }


    if (
      stableCount >= 3
    ) {

      const employee =
        employees.find(
          function(item) {

            return String(
              item.employeeId
            ) === String(
              match.label
            );

          }
        );


      statusBox.innerText =
        "✅ FACE MATCH";


      resultBox.innerText =
        employee
          ? employee.employeeId +
            " - " +
            employee.name
          : match.label;


    } else {

      statusBox.innerText =
        "MATCHING...";

    }


  } catch (error) {

    console.error(error);

  }


  requestAnimationFrame(
    scanFace
  );

}


/* =====================================
   BUTTON
===================================== */

startButton.onclick =
  startCamera;

</script>

</body>

</html>
