<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 25px 0 20px 0;
  font-size: 40px;
}

#cameraBox {
  width: 90%;
  max-width: 900px;
  margin: auto;
  background: #222;
  border-radius: 15px;
  overflow: hidden;
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#video {
  width: 100%;
  display: none;
  transform: scaleX(-1);
}

#placeholder {
  font-size: 30px;
  color: #aaa;
  padding: 100px 20px;
}

#status {
  margin-top: 25px;
  font-size: 28px;
  font-weight: bold;
}

#result {
  margin-top: 15px;
  font-size: 38px;
  font-weight: bold;
  min-height: 50px;
}

#distance {
  margin-top: 10px;
  font-size: 18px;
  color: #aaa;
}

#databaseInfo {
  margin-top: 15px;
  font-size: 18px;
  color: #aaa;
}

button {
  margin-top: 25px;
  padding: 16px 35px;
  font-size: 22px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>

</head>


<body>

<h1>FACE SCANNER</h1>


<div id="cameraBox">

  <div id="placeholder">
    CAMERA READY
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

</div>


<div id="status">
  READY
</div>


<div id="result">
</div>


<div id="distance">
</div>


<div id="databaseInfo">
</div>


<button id="startButton">
  START CAMERA
</button>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5FW5HHWCMMR4HcC_ob8qmi8OtAtTyvtCgWOX608YKRF-Cze0p5lKwuxbeOFuXK9tVMg/exec";


const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


const MATCH_THRESHOLD = 0.50;


const REQUIRED_STABLE_MATCH = 3;


/* =====================================================
   ELEMENT
===================================================== */

const video =
document.getElementById("video");


const placeholder =
document.getElementById("placeholder");


const statusBox =
document.getElementById("status");


const resultBox =
document.getElementById("result");


const distanceBox =
document.getElementById("distance");


const databaseInfo =
document.getElementById("databaseInfo");


const startButton =
document.getElementById("startButton");


/* =====================================================
   VARIABLES
===================================================== */

let faceMatcher = null;

let employees = [];

let cameraStream = null;

let scanning = false;

let lastEmployee = "";

let stableCount = 0;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.innerText = message;

}


/* =====================================================
   GET DATABASE
   JSONP
===================================================== */

function getFaceDatabase() {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_DATABASE_CALLBACK_" +
      Date.now();


    const script =
      document.createElement("script");


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "FACE API TIMEOUT"
          )
        );

      }, 30000);


    window[callbackName] =
      function(data) {

        cleanup();

        if (!data) {

          reject(
            new Error(
              "FACE API TIDAK MEMBERIKAN DATA"
            )
          );

          return;
        }


        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "FACE API CONNECTION ERROR"
          )
        );

      };


    script.src =
      API_URL +
      "?action=faces" +
      "&callback=" +
      callbackName +
      "&t=" +
      Date.now();


    document.body.appendChild(
      script
    );


    function cleanup() {

      clearTimeout(timeout);


      try {

        delete window[callbackName];

      } catch (e) {}


      if (script) {

        script.remove();

      }

    }

  });

}


/* =====================================================
   LOAD FACE MODELS
===================================================== */

async function loadModels() {

  setStatus(
    "LOADING FACE MODEL..."
  );


  console.log(
    "Loading Tiny Face Detector..."
  );


  await faceapi.nets.tinyFaceDetector.loadFromUri(
    MODEL_URL
  );


  console.log(
    "Loading Face Landmark..."
  );


  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
    MODEL_URL
  );


  console.log(
    "Loading Face Recognition..."
  );


  await faceapi.nets.faceRecognitionNet.loadFromUri(
    MODEL_URL
  );


  console.log(
    "ALL FACE MODELS READY"
  );

}


/* =====================================================
   LOAD PHOTO DATABASE
===================================================== */
async function loadDatabase() {

  setStatus(
    "LOADING PHOTO DATABASE..."
  );

  console.log(
    "REQUESTING FACE DATABASE..."
  );

  const data =
    await getFaceDatabase();

  console.log(
    "FACE DATABASE:",
    data
  );

  if (!data.ok) {

    throw new Error(
      data.message ||
      "FACE DATABASE ERROR"
    );

  }

  employees =
    Array.isArray(data.faces)
      ? data.faces
      : [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "TIDAK ADA FOTO EMPLOYEE"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  const labeledDescriptors = [];


  for (
    let i = 0;
    i < employees.length;
    i++
  ) {

    const employee =
      employees[i];


    const employeeId =
      String(
        employee.employeeId || ""
      ).trim();


    const employeeName =
      String(
        employee.name || ""
      ).trim();


    setStatus(
      "LOADING PHOTO " +
      (i + 1) +
      "/" +
      employees.length +
      " | " +
      employeeId +
      " - " +
      employeeName
    );


    console.log(
      "GET PHOTO:",
      employeeId,
      employeeName
    );


    try {

      const photo =
        await getFacePhoto(
          employee.row
        );


      if (!photo.ok) {

        console.warn(
          "PHOTO ERROR:",
          employeeId,
          photo.message
        );

        continue;

      }


      const image =
        await faceapi.fetchImage(
          photo.image
        );


      const detection =
        await faceapi
          .detectSingleFace(

            image,

            new faceapi.TinyFaceDetectorOptions({

              inputSize: 320,

              scoreThreshold: 0.5

            })

          )
          .withFaceLandmarks(true)
          .withFaceDescriptor();


      if (!detection) {

        console.warn(
          "FACE TIDAK DITEMUKAN:",
          employeeId,
          employeeName
        );

        continue;

      }


      labeledDescriptors.push(

        new faceapi.LabeledFaceDescriptors(

          employeeId,

          [
            detection.descriptor
          ]

        )

      );


      console.log(
        "FACE READY:",
        employeeId,
        employeeName
      );


    } catch (error) {

      console.error(
        "PHOTO PROCESS ERROR:",
        employeeId,
        error
      );

    }

  }


  if (
    labeledDescriptors.length === 0
  ) {

    throw new Error(
      "TIDAK ADA FOTO YANG BERHASIL DIPROSES"
    );

  }


  faceMatcher =
    new faceapi.FaceMatcher(

      labeledDescriptors,

      MATCH_THRESHOLD

    );


  databaseInfo.innerText =
    "FACE READY: " +
    labeledDescriptors.length +
    " EMPLOYEE";


  setStatus(
    "DATABASE READY"
  );


  console.log(
    "FACE DATABASE READY"
  );

}

      function getFacePhoto(row) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_PHOTO_CALLBACK_" +
      Date.now();


    const script =
      document.createElement("script");


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "PHOTO API TIMEOUT"
          )
        );

      }, 30000);


    window[callbackName] =
      function(data) {

        cleanup();

        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "PHOTO API CONNECTION ERROR"
          )
        );

      };


    script.src =
      API_URL +
      "?action=photo" +
      "&row=" +
      encodeURIComponent(row) +
      "&callback=" +
      callbackName +
      "&t=" +
      Date.now();


    document.body.appendChild(
      script
    );


    function cleanup() {

      clearTimeout(timeout);

      try {

        delete window[callbackName];

      } catch (e) {}

      script.remove();

    }

  });

}
