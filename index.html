/* =========================================================
   API REQUEST JSONP
   ========================================================= */

function apiRequest(
  action,
  params = {},
  timeoutMs = 30000
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const callbackName =
        "FACE_CALLBACK_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "API TIMEOUT: " +
                action
              )
            );

          },
          timeoutMs
        );


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          resolve(data);

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "API CONNECTION ERROR: " +
              action
            )
          );

        };


      let url =
        API_URL +
        "?action=" +
        encodeURIComponent(
          action
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      Object.keys(params)
        .forEach(
          function(key) {

            url +=
              "&" +
              encodeURIComponent(
                key
              ) +
              "=" +
              encodeURIComponent(
                params[key]
              );

          }
        );


      url +=
        "&t=" +
        Date.now();


      script.src =
        url;


      document.body.appendChild(
        script
      );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}


        script.remove();

      }

    }
  );

}


/* =========================================================
   INDEXEDDB
   ========================================================= */

function openCache() {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const request =
        indexedDB.open(
          CACHE_DB_NAME,
          CACHE_DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                CACHE_STORE
              )
          ) {

            db.createObjectStore(
              CACHE_STORE,
              {
                keyPath:
                  "employeeId"
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   GET CACHE
   ========================================================= */

async function getCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readonly"
        );


      const store =
        tx.objectStore(
          CACHE_STORE
        );


      const request =
        store.getAll();


      request.onsuccess =
        function() {

          db.close();


          resolve(
            request.result ||
            []
          );

        };


      request.onerror =
        function() {

          db.close();


          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   SAVE CACHE
   ========================================================= */

async function saveCacheItem(
  employeeId,
  name,
  descriptor
) {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      tx.objectStore(
        CACHE_STORE
      ).put({

        employeeId:
          String(
            employeeId
          ),

        name:
          String(
            name || ""
          ),

        descriptor:
          Array.from(
            descriptor
          )

      });


      tx.oncomplete =
        function() {

          db.close();

          resolve();

        };


      tx.onerror =
        function() {

          db.close();

          reject(
            tx.error
          );

        };

    }
  );

}


/* =========================================================
   CLEAR CACHE
   ========================================================= */

async function clearCache() {

  const db =
    await openCache();


  return new Promise(
    function(
      resolve,
      reject
    ) {

      const tx =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      tx.objectStore(
        CACHE_STORE
      ).clear();


      tx.oncomplete =
        function() {

          db.close();

          resolve();

        };


      tx.onerror =
        function() {

          db.close();

          reject(
            tx.error
          );

        };

    }
  );

}


/* =========================================================
   SIGNATURE
   ========================================================= */

function makeSignature(
  list
) {

  return list
    .map(
      function(item) {

        return (
          String(
            item.employeeId ||
            ""
          ) +
          "|" +
          String(
            item.name ||
            ""
          ) +
          "|" +
          String(
            item.row ||
            ""
          )
        );

      }
    )
    .join("||");

}


function getSignature() {

  try {

    return (
      localStorage.getItem(
        CACHE_SIGNATURE
      ) || ""
    );

  } catch (e) {

    return "";

  }

}


function setSignature(
  value
) {

  try {

    localStorage.setItem(
      CACHE_SIGNATURE,
      value
    );

  } catch (e) {}

}

/* =========================================================
   BUILD MATCHER
   ========================================================= */

function buildMatcher(
  cached
) {

  const labeled = [];


  cached.forEach(
    function(item) {

      try {

        labeled.push(

          new faceapi
            .LabeledFaceDescriptors(

              String(
                item.employeeId
              ),

              [
                new Float32Array(
                  item.descriptor
                )
              ]

            )

        );

      } catch (error) {

        console.error(
          "CACHE ERROR:",
          error
        );

      }

    }
  );


  if (
    labeled.length === 0
  ) {

    return null;

  }


  return new faceapi.FaceMatcher(
    labeled,
    MATCH_THRESHOLD
  );

}


/* =========================================================
   BUILD FACE CACHE
   ========================================================= */

async function buildFaceCache(
  list
) {

  const CONCURRENCY =
    8;


  let nextIndex =
    0;


  let completed =
    0;


  const descriptors =
    [];


  async function worker() {

    while (true) {

      const index =
        nextIndex++;


      if (
        index >=
        list.length
      ) {

        return;

      }


      const employee =
        list[index];


      const employeeId =
        String(
          employee.employeeId ||
          ""
        ).trim();


      const employeeName =
        String(
          employee.name ||
          ""
        ).trim();


      try {

        const photo =
          await getFacePhoto(
            employee.row
          );


        if (
          photo &&
          photo.ok &&
          photo.image
        ) {

          const image =
            await faceapi.fetchImage(
              photo.image
            );


          const detection =
            await faceapi
              .detectSingleFace(

                image,

                new faceapi
                  .TinyFaceDetectorOptions({

                    inputSize:
                      DETECTOR_INPUT_SIZE,

                    scoreThreshold:
                      0.5

                  })

              )
              .withFaceLandmarks(
                true
              )
              .withFaceDescriptor();


          if (detection) {

            descriptors.push({

              employeeId:
                employeeId,

              name:
                employeeName,

              descriptor:
                Array.from(
                  detection.descriptor
                )

            });

          }

        }

      } catch (error) {

        console.error(
          "PHOTO PROCESS ERROR:",
          employeeId,
          error
        );

      }


      completed++;


      setStatus(
        "PROCESSING FACE " +
        completed +
        "/" +
        list.length
      );

    }

  }


  const workers =
    [];


  const workerCount =
    Math.min(
      CONCURRENCY,
      list.length
    );


  for (
    let i = 0;
    i < workerCount;
    i++
  ) {

    workers.push(
      worker()
    );

  }


  await Promise.all(
    workers
  );


  if (
    descriptors.length === 0
  ) {

    throw new Error(
      "NO FACE DESCRIPTOR FOUND"
    );

  }


  setStatus(
    "SAVING FACE CACHE..."
  );


  await clearCache();


  /*
   * Save batches.
   */

  for (
    let i = 0;
    i < descriptors.length;
    i += 20
  ) {

    const batch =
      descriptors.slice(
        i,
        i + 20
      );


    await Promise.all(

      batch.map(
        function(item) {

          return saveCacheItem(

            item.employeeId,

            item.name,

            item.descriptor

          );

        }
      )

    );

  }


  setSignature(
    makeSignature(
      list
    )
  );


  const cached =
    await getCache();


  faceMatcher =
    buildMatcher(
      cached
    );


  if (!faceMatcher) {

    throw new Error(
      "FACE CACHE FAILED"
    );

  }


  databaseLoaded =
    true;


  databaseInfo.innerText =
    "FACE READY: " +
    cached.length +
    " / " +
    list.length +
    " EMPLOYEE";


  setStatus(
    "FACE SYSTEM READY"
  );

}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadDatabase() {

  if (databaseLoaded) {
    return;
  }


  const data =
    await getFaceDatabase();


  if (
    !data ||
    !data.ok
  ) {

    throw new Error(
      data &&
      (
        data.message ||
        data.error
      )
        ? (
            data.message ||
            data.error
          )
        : "FACE DATABASE ERROR"
    );

  }


  employees =
    Array.isArray(
      data.faces
    )
      ? data.faces
      : [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "NO EMPLOYEE PHOTO FOUND"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  const signature =
    makeSignature(
      employees
    );


  const oldSignature =
    getSignature();


  const cached =
    await getCache();


  /*
   * Existing valid cache.
   */

  if (
    oldSignature ===
      signature &&
    cached.length ===
      employees.length
  ) {

    faceMatcher =
      buildMatcher(
        cached
      );


    if (faceMatcher) {

      databaseLoaded =
        true;


      databaseInfo.innerText =
        "FACE CACHE READY: " +
        cached.length +
        " / " +
        employees.length +
        " EMPLOYEE";


      setStatus(
        "FACE SYSTEM READY"
      );


      return;

    }

  }


  /*
   * No valid cache.
   */

  await buildFaceCache(
    employees
  );

}


/* =========================================================
   PRELOAD
   ========================================================= */

async function preloadFaceSystem() {

  if (preloadPromise) {

    return preloadPromise;

  }


  preloadPromise =
    Promise.all([

      loadModels(),

      loadDatabase()

    ])
    .then(
      function() {

        setStatus(
          "FACE SYSTEM READY"
        );

      }
    )
    .catch(
      function(error) {

        preloadPromise =
          null;


        console.error(
          "PRELOAD ERROR:",
          error
        );


        setStatus(
          "FACE SYSTEM ERROR"
        );


        resultBox.innerText =
          error.message ||
          "FACE SYSTEM ERROR";


        throw error;

      }
    );


  return preloadPromise;

}

    }


    /*
     * If target is not READY,
     * show checklist if available.
     */

    if (
      data.checklist
    ) {

      updateChecklist(
        data.checklist
      );

    }



/* =====================================================
   TARGET TIDAK READY
   ===================================================== */

if (!data.ready) {

  /*
   * Jika target sebelumnya sudah selesai
   * atau status sudah SCANNED,
   * langsung matikan camera.
   */

  if (
    currentTarget &&
    data.sheet === currentTarget.sheet &&
    Number(data.row) === Number(currentTarget.row) &&
    Number(data.column) === Number(currentTarget.column)
  ) {

    stopCamera();

    currentTarget = null;

    scanLocked = false;

    stableCount = 0;

    lastEmployee = "";

    setStatus(
      "SCAN COMPLETED"
    );

  }

  return;

}

    


    if (
      !data.sheet ||
      !data.row ||
      !data.column
    ) {

      return;

    }


    const allowed = [

      1,
      5,
      20,
      24,
      31,
      35

    ];


    if (
      allowed.indexOf(
        Number(
          data.column
        )
      ) === -1
    ) {

      return;

    }


    const newKey =
      data.sheet +
      "|" +
      data.row +
      "|" +
      data.column;


    const oldKey =
      currentTarget

        ? currentTarget.sheet +
          "|" +
          currentTarget.row +
          "|" +
          currentTarget.column

        : "";


    if (
      newKey !==
      oldKey
    ) {

      if (scanning) {

        stopCamera();

      }


      scanLocked =
        false;


      stableCount =
        0;


      lastEmployee =
        "";


      currentTarget = {

        sheet:
          data.sheet,

        row:
          Number(
            data.row
          ),

        column:
          Number(
            data.column
          )

      };


      targetInfo.innerText =
        "TARGET: " +
        data.sheet +
        "!" +
        columnToLetter(
          Number(
            data.column
          )
        ) +
        data.row;


      resultBox.innerText =
        "";


      distanceBox.innerText =
        "";


      updateChecklist(
        data.checklist
      );


      /*
       * AUTOMATIC CAMERA
       */

      await startCamera();

    }


  } catch (error) {

    console.log(
      "TARGET CHECK ERROR:",
      error.message
    );

  } finally {

    targetChecking =
      false;

  }

}

   ========================================================= */

async function startCamera() {

  if (scanning) {
    return;
  }


  try {

    /*
     * If cache already exists,
     * this returns very quickly.
     */

    await preloadFaceSystem();


    setStatus(
      "STARTING CAMERA..."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ) {

      throw new Error(
        "BROWSER TIDAK MENDUKUNG CAMERA"
      );

    }


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              "user",

            width: {

              ideal:
                CAMERA_WIDTH

            },

            height: {

              ideal:
                CAMERA_HEIGHT

            }

          },

          audio:
            false

        });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning =
      true;


    scanLocked =
      false;


    stableCount =
      0;


    lastEmployee =
      "";


    setStatus(
      "LOOK AT THE CAMERA"
    );


    scanFace();


  } catch (error) {

    scanning =
      false;


    setStatus(
      "CAMERA ERROR"
    );


    resultBox.innerText =
      error.message ||
      "CAMERA ERROR";


    console.error(
      "CAMERA ERROR:",
      error
    );

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  scanning =
    false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  cameraStream =
    null;


  video.srcObject =
    null;


  video.style.display =
    "none";


  placeholder.style.display =
    "block";


  placeholder.innerText =
    "WAITING FOR TARGET...";


  stableCount =
    0;


  lastEmployee =
    "";

}


/* =========================================================
   FACE SCAN
   ========================================================= */

async function scanFace() {

  if (!scanning) {
    return;
  }


  if (!currentTarget) {

  stopCamera();

  return;

}


  try {

    if (!faceMatcher) {

      setStatus(
        "FACE DATABASE NOT READY"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    const detection =
      await faceapi
        .detectSingleFace(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize:
                DETECTOR_INPUT_SIZE,

              scoreThreshold:
                0.5

            })

        )
        .withFaceLandmarks(
          true
        )
        .withFaceDescriptor();


    /* =====================================================
       NO FACE
       ===================================================== */

    if (!detection) {

      resultBox.innerText =
        "LOOK AT THE CAMERA";


      distanceBox.innerText =
        "";


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "SCANNING..."
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /* =====================================================
       MATCH
       ===================================================== */

    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    const employeeId =
      bestMatch.label;


    const distance =
      bestMatch.distance;


    distanceBox.innerText =
      "DISTANCE: " +
      distance.toFixed(4);


    /* =====================================================
       UNKNOWN
       ===================================================== */

    if (
      employeeId ===
      "unknown"
    ) {

      resultBox.innerText =
        "FACE NOT MATCHED";


      stableCount =
        0;


      lastEmployee =
        "";


      setStatus(
        "FACE NOT MATCHED"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /* =====================================================
       FIND EMPLOYEE
       ===================================================== */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ) === String(
            employeeId
          );

        }
      );


    const employeeName =
      employee
        ? employee.name
        : "";


    /* =====================================================
       STABLE MATCH
       ===================================================== */

    if (
      lastEmployee ===
      employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;

      stableCount =
        1;

    }


    resultBox.innerText =
      employeeId +
      " - " +
      employeeName;


    setStatus(
      "MATCH " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH
    );


    /* =====================================================
       VERIFIED
       ===================================================== */

    if (
      stableCount >=
        REQUIRED_STABLE_MATCH &&
      !scanLocked
    ) {

      scanLocked =
        true;


      const target =
        currentTarget;


      if (!target) {

        scanLocked =
          false;

        return;

      }


      setStatus(
        "FACE VERIFIED"
      );


      try {

        const result =
          await sendScanToSheet(

            employeeId,

            employeeName

          );


        /*
         * Update checklist first.
         */

        if (
          result &&
          result.checklist
        ) {

          updateChecklist(
            result.checklist
          );

        }


        /* =================================================
           SUCCESS
           ================================================= */

        if (
          result &&
          result.ok
        ) {

          const employeeColumns = [

            1,
            20,
            31

          ];


          const isEmployeeScan =
            employeeColumns.indexOf(
              Number(
                target.column
              )
            ) !== -1;


          if (
            isEmployeeScan
          ) {

            resultBox.innerText =
              "✓ EMPLOYEE SAVED\n" +
              employeeId +
              " - " +
              employeeName;


            setStatus(
              "EMPLOYEE SCAN COMPLETED"
            );

          } else {

            resultBox.innerText =
              "✓ TIME IN SAVED\n" +
              employeeName +
              "\n" +
              (
                result.timeIn ||
                ""
              );


            setStatus(
              "TIME IN COMPLETED"
            );

          }


          /*
           * CAMERA OFF
           */

          stopCamera();


          currentTarget =
            null;


          scanLocked =
            false;


          return;

        }


        /* =================================================
           REJECTED
           ================================================= */

        scanLocked =
          false;


        stableCount =
          0;


        lastEmployee =
          "";


        resultBox.innerText =
          result &&
          (
            result.message ||
            result.error
          )
            ? (
                result.message ||
                result.error
              )
            : "SCAN REJECTED";


        setStatus(
          "SCAN REJECTED"
        );


        /*
         * Keep camera ON.
         *
         * This is important for:
         * Remark missing
         * Face mismatch
         * etc.
         */

        if (scanning) {

          setTimeout(
            scanFace,
            700
          );

        }


        return;


      } catch (error) {

        scanLocked =
          false;


        stableCount =
          0;


        lastEmployee =
          "";


        setStatus(
          "SCAN ERROR"
        );


        resultBox.innerText =
          error.message ||
          "SCAN ERROR";


        console.error(
          "SAVE ERROR:",
          error
        );


        if (scanning) {

          setTimeout(
            scanFace,
            700
          );

        }


        return;

      }

    }


  } catch (error) {

    console.error(
      "FACE SCAN ERROR:",
      error
    );

  }


  if (scanning) {

    setTimeout(
      scanFace,
      SCAN_INTERVAL
    );

  }

}


/* =========================================================
   MANUAL CACHE RESET
   ========================================================= */

window.clearFaceScannerCache =
  async function() {

    await clearCache();


    localStorage.removeItem(
      CACHE_SIGNATURE
    );


    databaseLoaded =
      false;


    faceMatcher =
      null;


    employees =
      [];


    preloadPromise =
      null;


    databaseInfo.innerText =
      "CACHE CLEARED";


    setStatus(
      "CACHE CLEARED - RELOAD PAGE"
    );

  };


/* =========================================================
   COLUMN NUMBER → LETTER
   ========================================================= */

function columnToLetter(
  column
) {

  let letter = "";


  while (
    column > 0
  ) {

    const temp =
      (column - 1) % 26;


    letter =
      String.fromCharCode(
        temp + 65
      ) +
      letter;


    column =
      Math.floor(
        (column - temp - 1) /
        26
      );

  }


  return letter;

}


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    setStatus(
      "PREPARING FACE SYSTEM..."
    );


    targetInfo.innerText =
      "WAITING FOR TARGET";


    databaseInfo.innerText =
      "LOADING FACE DATABASE...";


    /*
     * PRELOAD:
     *
     * Models
     * +
     * cached descriptors
     *
     * start immediately.
     */

    preloadFaceSystem()
      .catch(
        function(error) {

          console.error(
            "PRELOAD ERROR:",
            error
          );

        }
      );


    /*
     * Monitor Google Sheet.
     */

    startTargetMonitor();

  }
);
