<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 25px 0 20px;
  font-size: 40px;
}

#cameraBox {
  width: 90%;
  max-width: 900px;
  margin: auto;
  background: #222;
  border-radius: 15px;
  overflow: hidden;
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#video {
  width: 100%;
  display: none;
  transform: scaleX(-1);
}

#placeholder {
  font-size: 30px;
  color: #aaa;
  padding: 100px 20px;
}

#status {
  margin-top: 25px;
  font-size: 28px;
  font-weight: bold;
}

#result {
  margin-top: 15px;
  font-size: 38px;
  font-weight: bold;
  min-height: 50px;
  white-space: pre-line;
}

#distance {
  margin-top: 10px;
  font-size: 18px;
  color: #aaa;
}

#databaseInfo {
  margin-top: 15px;
  font-size: 18px;
  color: #aaa;
}

#targetInfo {
  margin-top: 15px;
  font-size: 22px;
  color: #aaa;
}

button {
  margin-top: 25px;
  padding: 16px 35px;
  font-size: 22px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>

</head>

<body>

<h1>FACE SCANNER</h1>

<div id="cameraBox">

  <div id="placeholder">
    WAITING FOR TARGET...
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

</div>

<div id="status">
  WAITING FOR CELL
</div>

<div id="result"></div>

<div id="distance"></div>

<div id="targetInfo"></div>

<div id="databaseInfo"></div>

<button
  id="startButton"
  style="display:none;">
  START CAMERA
</button>


<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwGlmYYkvlm__QOQ1cyTOHB5Zi0eJwkGzaINKOTbTieG_z1E6dCBKkP9xYTX-vnwVoI/exec";


const MODEL_URL =
  "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


const MATCH_THRESHOLD = 0.50;


const REQUIRED_STABLE_MATCH = 3;


/* =====================================================
   ELEMENT
   ===================================================== */

const video =
  document.getElementById("video");

const placeholder =
  document.getElementById("placeholder");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const distanceBox =
  document.getElementById("distance");

const databaseInfo =
  document.getElementById("databaseInfo");

const targetInfo =
  document.getElementById("targetInfo");

const startButton =
  document.getElementById("startButton");


/* =====================================================
   VARIABLES
   ===================================================== */

let faceMatcher = null;

let employees = [];

let cameraStream = null;

let scanning = false;

let scanLocked = false;

let stableCount = 0;

let lastEmployee = "";

let modelsLoaded = false;

let databaseLoaded = false;

let targetChecking = false;

let currentTarget = null;

let targetMonitor = null;

let preloadPromise = null;


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(message) {

  statusBox.innerText = message;

}


/* =====================================================
   JSONP REQUEST
   ===================================================== */

function apiRequest(
  action,
  params = {},
  timeoutMs = 30000
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "FACE_CALLBACK_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);

      const script =
        document.createElement("script");

      let finished = false;

      const timeout =
        setTimeout(
          function() {

            if (finished) return;

            finished = true;

            cleanup();

            reject(
              new Error(
                "API TIMEOUT: " +
                action
              )
            );

          },
          timeoutMs
        );


      window[callbackName] =
        function(data) {

          if (finished) return;

          finished = true;

          cleanup();

          resolve(data);

        };


      script.onerror =
        function() {

          if (finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "API CONNECTION ERROR: " +
              action
            )
          );

        };


      let url =
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&callback=" +
        encodeURIComponent(callbackName);


      Object.keys(params)
        .forEach(
          function(key) {

            url +=
              "&" +
              encodeURIComponent(key) +
              "=" +
              encodeURIComponent(
                params[key]
              );

          }
        );


      url +=
        "&t=" +
        Date.now();


      script.src = url;

      document.body.appendChild(
        script
      );


      function cleanup() {

        clearTimeout(timeout);

        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

        if (script) {

          script.remove();

        }

      }

    }
  );

}


/* =====================================================
   SET TARGET FROM URL
   ===================================================== */

async function setTargetFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const sheet =
    params.get("sheet");

  const row =
    params.get("row");

  const column =
    params.get("column");


  if (!sheet || !row || !column) {

    return false;

  }


  try {

    setStatus(
      "SETTING TARGET..."
    );


    const result =
      await apiRequest(
        "setTarget",
        {
          sheet: sheet,
          row: row,
          column: column
        },
        15000
      );


    if (
      !result ||
      !result.ok
    ) {

      resultBox.innerText =
        result &&
        result.message
          ? result.message
          : "GAGAL SET TARGET";

      setStatus(
        "TARGET ERROR"
      );

      return false;

    }


    const columnNames = {

      1: "A",
      5: "E",
      20: "T",
      24: "X",
      31: "AE",
      35: "AI"

    };


    const columnName =
      columnNames[
        Number(column)
      ] || "?";


    currentTarget = {

      sheet:
        sheet,

      row:
        Number(row),

      column:
        Number(column)

    };


    targetInfo.innerText =
      "TARGET: " +
      sheet +
      "!" +
      columnName +
      row;


    return true;


  } catch (error) {

    console.error(
      "SET TARGET ERROR:",
      error
    );


    resultBox.innerText =
      error.message ||
      "GAGAL SET TARGET";


    setStatus(
      "TARGET ERROR"
    );


    return false;

  }

}


/* =====================================================
   GET CURRENT TARGET
   ===================================================== */

async function getCurrentTarget() {

  return await apiRequest(
    "target",
    {},
    10000
  );

}


/* =====================================================
   TARGET CHECK
   ===================================================== */

async function checkTarget() {

  if (targetChecking) {

    return;

  }


  targetChecking = true;


  try {

    const data =
      await getCurrentTarget();


    if (
      !data ||
      !data.ok
    ) {

      return;

    }


    if (
      !data.ready
    ) {

      return;

    }


    if (
      !data.sheet ||
      !data.row ||
      !data.column
    ) {

      return;

    }


    const allowedFaceColumns = [

      1,
      5,
      20,
      24,
      31,
      35

    ];


    if (
      allowedFaceColumns.indexOf(
        Number(data.column)
      ) === -1
    ) {

      return;

    }


    const newKey =
      data.sheet +
      "|" +
      data.row +
      "|" +
      data.column;


    const oldKey =
      currentTarget
        ? currentTarget.sheet +
          "|" +
          currentTarget.row +
          "|" +
          currentTarget.column
        : "";


    if (
      newKey !== oldKey
    ) {

      if (scanning) {

        stopCamera();

      }


      scanLocked = false;

      stableCount = 0;

      lastEmployee = "";


      currentTarget = {

        sheet:
          data.sheet,

        row:
          Number(data.row),

        column:
          Number(data.column)

      };


      const columnNames = {

        1: "A",
        5: "E",
        20: "T",
        24: "X",
        31: "AE",
        35: "AI"

      };


      const columnName =
        columnNames[
          Number(data.column)
        ] || "?";


      targetInfo.innerText =
        "TARGET: " +
        data.sheet +
        "!" +
        columnName +
        data.row;


      resultBox.innerText = "";

      distanceBox.innerText = "";


      await startCamera();

    }


  } catch (error) {

    console.log(
      "TARGET CHECK ERROR:",
      error.message
    );

  } finally {

    targetChecking = false;

  }

}


/* =====================================================
   START TARGET MONITOR
   ===================================================== */

function startTargetMonitor() {

  checkTarget();


  targetMonitor =
    setInterval(
      checkTarget,
      500
    );

}


/* =====================================================
   LOAD MODELS
   ===================================================== */

async function loadModels() {

  if (modelsLoaded) {

    return;

  }


  setStatus(
    "LOADING FACE MODEL..."
  );


  await faceapi.nets
    .tinyFaceDetector
    .loadFromUri(
      MODEL_URL
    );


  await faceapi.nets
    .faceLandmark68TinyNet
    .loadFromUri(
      MODEL_URL
    );


  await faceapi.nets
    .faceRecognitionNet
    .loadFromUri(
      MODEL_URL
    );


  modelsLoaded = true;

}


/* =====================================================
   GET FACE DATABASE
   ===================================================== */

async function getFaceDatabase() {

  return await apiRequest(
    "faces",
    {},
    30000
  );

}


/* =====================================================
   GET PHOTO
   ===================================================== */

async function getFacePhoto(row) {

  return await apiRequest(
    "photo",
    {
      row: row
    },
    30000
  );

}


/* =====================================================
   LOAD DATABASE
   ===================================================== */

async function loadDatabase() {

  if (databaseLoaded) {
    return;
  }

  setStatus("LOADING PHOTO DATABASE...");

  const data = await getFaceDatabase();

  if (!data || !data.ok) {
    throw new Error(
      data && data.message
        ? data.message
        : "FACE DATABASE ERROR"
    );
  }

  employees = Array.isArray(data.faces)
    ? data.faces
    : [];

  if (employees.length === 0) {
    throw new Error("NO EMPLOYEE PHOTO FOUND");
  }

  databaseInfo.innerText =
    "PHOTO DATABASE: " + employees.length + " EMPLOYEE";

  const labeledDescriptors = [];
  let completed = 0;

  /*
   * Process several photos at the same time.
   * This is much faster than processing 250 photos one-by-one.
   */
  const CONCURRENCY = 6;
  let nextIndex = 0;

  async function worker() {
    while (true) {
      const i = nextIndex++;
      if (i >= employees.length) return;

      const employee = employees[i];
      const employeeId = String(employee.employeeId || "").trim();
      const employeeName = String(employee.name || "").trim();

      try {
        const photo = await getFacePhoto(employee.row);

        if (photo && photo.ok && photo.image) {
          const image = await faceapi.fetchImage(photo.image);

          const detection = await faceapi
            .detectSingleFace(
              image,
              new faceapi.TinyFaceDetectorOptions({
                inputSize: 224,
                scoreThreshold: 0.5
              })
            )
            .withFaceLandmarks(true)
            .withFaceDescriptor();

          if (detection) {
            labeledDescriptors.push(
              new faceapi.LabeledFaceDescriptors(
                employeeId,
                [detection.descriptor]
              )
            );
          }
        }
      } catch (error) {
        console.error(
          "PHOTO PROCESS ERROR:",
          employeeId,
          error
        );
      }

      completed++;

      if (
        completed === employees.length ||
        completed % 10 === 0
      ) {
        setStatus(
          "LOADING FACE " +
          completed + "/" + employees.length
        );
      }
    }
  }

  const workers = [];
  const workerCount = Math.min(
    CONCURRENCY,
    employees.length
  );

  for (let i = 0; i < workerCount; i++) {
    workers.push(worker());
  }

  await Promise.all(workers);

  if (labeledDescriptors.length === 0) {
    throw new Error("NO FACE DESCRIPTOR FOUND");
  }

  faceMatcher = new faceapi.FaceMatcher(
    labeledDescriptors,
    MATCH_THRESHOLD
  );

  databaseLoaded = true;

  databaseInfo.innerText =
    "FACE READY: " +
    labeledDescriptors.length +
    " / " +
    employees.length +
    " EMPLOYEE";

  setStatus("FACE DATABASE READY");
}


/* =====================================================
   PRELOAD MODELS + DATABASE
   ===================================================== */
async function preloadFaceSystem() {

  if (preloadPromise) {
    return preloadPromise;
  }

  preloadPromise = (async function() {
    setStatus("PREPARING FACE SYSTEM...");

    /* Load model and employee list in parallel. */
    await Promise.all([
      loadModels(),
      loadDatabase()
    ]);

    setStatus("FACE SYSTEM READY");
  })().catch(function(error) {
    preloadPromise = null;
    console.error("PRELOAD ERROR:", error);

    setStatus("FACE SYSTEM ERROR");
    resultBox.innerText =
      error.message || "FACE SYSTEM ERROR";

    throw error;
  });

  return preloadPromise;
}


/* =====================================================
   SEND SCAN TO GOOGLE SHEET
   ===================================================== */

async function sendScanToSheet(
  employeeId,
  employeeName
) {

  return await apiRequest(
    "scan",
    {
      employeeId:
        employeeId,

      employeeName:
        employeeName
    },
    15000
  );

}


/* =====================================================
   START CAMERA
   ===================================================== */

async function startCamera() {

  if (scanning) {

    return;

  }


  try {

    setStatus(
      "PREPARING CAMERA..."
    );

    await preloadFaceSystem();

    setStatus(
      "STARTING CAMERA..."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "BROWSER TIDAK MENDUKUNG CAMERA"
      );

    }


    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              "user",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning = true;

    scanLocked = false;

    stableCount = 0;

    lastEmployee = "";


    setStatus(
      "SCANNING..."
    );


    scanFace();


  } catch (error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    scanning = false;


    setStatus(
      "CAMERA ERROR"
    );


    resultBox.innerText =
      error.message ||
      "CAMERA ERROR";


    currentTarget = null;

  }

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

function stopCamera() {

  scanning = false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  cameraStream = null;


  video.srcObject = null;


  video.style.display =
    "none";


  placeholder.style.display =
    "block";


  placeholder.innerText =
    "WAITING FOR TARGET...";


  stableCount = 0;

  lastEmployee = "";

}


/* =====================================================
   FACE SCANNER
   ===================================================== */

async function scanFace() {

  if (!scanning) {

    return;

  }


  try {

    const detection =
      await faceapi
        .detectSingleFace(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 224,
            scoreThreshold: 0.5
          })
        )
        .withFaceLandmarks(true)
        .withFaceDescriptor();


    /*
      Tidak ada wajah.
    */

    if (!detection) {

      resultBox.innerText =
        "NO FACE";


      distanceBox.innerText =
        "";


      stableCount = 0;

      lastEmployee = "";


      setStatus(
        "SCANNING..."
      );


      setTimeout(
        scanFace,
        300
      );


      return;

    }


    /*
      Cari wajah terbaik.
    */

    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    const employeeId =
      bestMatch.label;


    const distance =
      bestMatch.distance;


    distanceBox.innerText =
      "DISTANCE: " +
      distance.toFixed(4);


    /*
      Tidak cocok.
    */

    if (
      employeeId === "unknown"
    ) {

      resultBox.innerText =
        "UNKNOWN";


      stableCount = 0;

      lastEmployee = "";


      setStatus(
        "FACE NOT MATCHED"
      );


      setTimeout(
        scanFace,
        300
      );


      return;

    }


    /*
      Cari nama employee.
    */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ) === String(
            employeeId
          );

        }
      );


    const employeeName =
      employee
        ? employee.name
        : "";


    /*
      Stable match.
    */

    if (
      lastEmployee === employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;

      stableCount = 1;

    }


    resultBox.innerText =
      employeeId +
      " - " +
      employeeName;


    setStatus(
      "MATCH " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH
    );


    /*
      FACE VERIFIED
    */

    if (
      stableCount >=
        REQUIRED_STABLE_MATCH &&
      !scanLocked
    ) {

      scanLocked = true;


      const targetAtScan =
        currentTarget
          ? {
              sheet:
                currentTarget.sheet,

              row:
                currentTarget.row,

              column:
                currentTarget.column
            }
          : null;


      if (!targetAtScan) {

        scanLocked = false;

        return;

      }


      setStatus(
        "FACE VERIFIED"
      );


      resultBox.innerText =
        "✓ " +
        employeeId +
        " - " +
        employeeName;


      try {

        const result =
          await sendScanToSheet(
            employeeId,
            employeeName
          );


        if (
          result &&
          result.ok
        ) {

          const employeeColumns = [
            1,
            20,
            31
          ];


          const isEmployeeScan =
            employeeColumns.indexOf(
              Number(
                targetAtScan.column
              )
            ) !== -1;


          if (
            isEmployeeScan
          ) {

            resultBox.innerText =
              "✓ EMPLOYEE SAVED\n" +
              employeeId +
              " - " +
              employeeName;

          } else {

            resultBox.innerText =
              "✓ TIME IN SAVED\n" +
              employeeName +
              "\n" +
              result.timeIn;

          }


          setStatus(
            "SCAN SAVED"
          );


          stopCamera();


          currentTarget =
            null;


          stableCount =
            0;

          lastEmployee =
            "";


        } else {

          scanLocked = false;

          setStatus(
            "SCAN REJECTED"
          );

          resultBox.innerText =
            result &&
            result.message
              ? result.message
              : "GAGAL SIMPAN";

          /*
           * RETRY OTOMATIS
           * Tidak perlu refresh setelah Remark diisi.
           */
          stableCount = 0;
          lastEmployee = "";

          if (scanning) {
            setTimeout(
              scanFace,
              700
            );
          }

          return;
        }


      } catch (error) {

        scanLocked = false;


        setStatus(
          "SCAN ERROR"
        );


        resultBox.innerText =
          error.message ||
          "GAGAL SIMPAN";


        console.error(
          "SAVE ERROR:",
          error
        );

      }


      stableCount = 0;

      lastEmployee = "";


      return;

    }


  } catch (error) {

    console.error(
      "FACE SCAN ERROR:",
      error
    );

  }


  /*
    Lanjut scanning.
  */

  if (scanning) {

    setTimeout(
      scanFace,
      300
    );

  }

}


/* =====================================================
   MANUAL BUTTON
   ===================================================== */

startButton.addEventListener(
  "click",
  function() {

    if (!scanning) {

      startCamera();

    }

  }
);


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
  "load",
  async function() {

    setStatus(
      "WAITING FOR CAMERA BUTTON..."
    );


    targetInfo.innerText =
      "WAITING FOR CAMERA BUTTON";


    databaseInfo.innerText =
      "PREPARING FACE DATABASE...";


    /*
      Preload model + 250 employee faces once.
      Setelah ini klik cell akan membuka camera jauh lebih cepat.
    */
    preloadFaceSystem().catch(function() {});


    /*
      Ambil target dari URL.
    */

    await setTargetFromUrl();


    /*
      Mulai monitor target.
    */

    startTargetMonitor();

  }
);

</script>

</body>
</html>
