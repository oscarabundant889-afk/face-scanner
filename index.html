<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

<body>

<h1>FACE SCANNER</h1>

<div id="cameraBox">

  <div id="placeholder">
    WAITING FOR TARGET...
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

</div>

<div id="status">
  WAITING FOR CELL
</div>

<div id="result"></div>

<div id="distance"></div>

<div id="targetInfo"></div>

<div id="databaseInfo"></div>

<button
  id="startButton"
  style="display:none;">
  START CAMERA
</button>

<script>

/* =========================================================
   FACE SCANNER - FAST CACHE VERSION
   ========================================================= */


/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwGlmYYkvlm__QOQ1cyTOHB5Zi0eJwkGzaINKOTbTieG_z1E6dCBKkP9xYTX-vnwVoI/exec";


const MODEL_URL =
  "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


/*
 * Face match threshold.
 *
 * Smaller = stricter
 * Larger  = more tolerant
 */

const MATCH_THRESHOLD = 0.50;


/*
 * Require same face several times
 * before saving.
 */

const REQUIRED_STABLE_MATCH = 3;


/*
 * Camera resolution.
 *
 * 640x480 is enough for face recognition
 * and is faster than 1280x720.
 */

const CAMERA_WIDTH = 640;
const CAMERA_HEIGHT = 480;


/*
 * Detection size.
 *
 * Smaller = faster.
 */

const DETECTOR_INPUT_SIZE = 224;


/*
 * How often scanner checks Google Sheet
 * for a new selected cell.
 */

const TARGET_CHECK_INTERVAL = 500;


/*
 * Face scan interval.
 */

const SCAN_INTERVAL = 250;


/*
 * IndexedDB database.
 */

const CACHE_DB_NAME =
  "FACE_SCANNER_CACHE_DB";

const CACHE_DB_VERSION = 1;

const CACHE_STORE =
  "FACE_DESCRIPTORS";


/* =========================================================
   ELEMENT
   ========================================================= */

const video =
  document.getElementById("video");

const placeholder =
  document.getElementById("placeholder");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const distanceBox =
  document.getElementById("distance");

const databaseInfo =
  document.getElementById("databaseInfo");

const targetInfo =
  document.getElementById("targetInfo");

const startButton =
  document.getElementById("startButton");


/* =========================================================
   VARIABLES
   ========================================================= */

let faceMatcher = null;

let employees = [];

let cameraStream = null;

let scanning = false;

let scanLocked = false;

let stableCount = 0;

let lastEmployee = "";

let modelsLoaded = false;

let databaseLoaded = false;

let targetChecking = false;

let currentTarget = null;

let targetMonitor = null;

let preloadPromise = null;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message) {

  statusBox.innerText =
    message;

}


/* =========================================================
   JSONP API
   ========================================================= */

function apiRequest(
  action,
  params = {},
  timeoutMs = 30000
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "FACE_CALLBACK_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement("script");


      let finished = false;


      const timeout =
        setTimeout(
          function() {

            if (finished) return;

            finished = true;

            cleanup();

            reject(
              new Error(
                "API TIMEOUT: " +
                action
              )
            );

          },
          timeoutMs
        );


      window[callbackName] =
        function(data) {

          if (finished) return;

          finished = true;

          cleanup();

          resolve(data);

        };


      script.onerror =
        function() {

          if (finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "API CONNECTION ERROR: " +
              action
            )
          );

        };


      let url =
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&callback=" +
        encodeURIComponent(callbackName);


      Object.keys(params)
        .forEach(
          function(key) {

            url +=
              "&" +
              encodeURIComponent(key) +
              "=" +
              encodeURIComponent(
                params[key]
              );

          }
        );


      url +=
        "&t=" +
        Date.now();


      script.src = url;


      document.body.appendChild(
        script
      );


      function cleanup() {

        clearTimeout(timeout);

        try {

          delete window[
            callbackName
          ];

        } catch (e) {}


        if (script) {

          script.remove();

        }

      }

    }
  );

}


/* =========================================================
   INDEXEDDB
   ========================================================= */

function openFaceCache() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          CACHE_DB_NAME,
          CACHE_DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(CACHE_STORE)
          ) {

            db.createObjectStore(
              CACHE_STORE,
              {
                keyPath: "employeeId"
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   CACHE - SAVE
   ========================================================= */

async function saveDescriptorToCache(
  employeeId,
  employeeName,
  descriptor
) {

  const db =
    await openFaceCache();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      const store =
        transaction.objectStore(
          CACHE_STORE
        );


      store.put({

        employeeId:
          String(employeeId),

        name:
          String(employeeName || ""),

        descriptor:
          Array.from(descriptor),

        savedAt:
          Date.now()

      });


      transaction.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaction.onerror =
        function() {

          db.close();

          reject(
            transaction.error
          );

        };

    }
  );

}


/* =========================================================
   CACHE - READ ALL
   ========================================================= */

async function getAllCachedDescriptors() {

  const db =
    await openFaceCache();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          CACHE_STORE,
          "readonly"
        );


      const store =
        transaction.objectStore(
          CACHE_STORE
        );


      const request =
        store.getAll();


      request.onsuccess =
        function() {

          db.close();

          resolve(
            request.result || []
          );

        };


      request.onerror =
        function() {

          db.close();

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   CACHE - CLEAR
   ========================================================= */

async function clearFaceCache() {

  const db =
    await openFaceCache();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          CACHE_STORE,
          "readwrite"
        );


      const store =
        transaction.objectStore(
          CACHE_STORE
        );


      const request =
        store.clear();


      request.onsuccess =
        function() {

          db.close();

          resolve();

        };


      request.onerror =
        function() {

          db.close();

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   DATABASE SIGNATURE
   ========================================================= */

function makeDatabaseSignature(
  list
) {

  return list
    .map(
      function(item) {

        return (
          String(
            item.employeeId || ""
          ) +
          "|" +
          String(
            item.name || ""
          ) +
          "|" +
          String(
            item.row || ""
          )
        );

      }
    )
    .join("||");

}


/* =========================================================
   CACHE META
   ========================================================= */

const CACHE_META_KEY =
  "FACE_SCANNER_DATABASE_SIGNATURE";


function getCachedSignature() {

  try {

    return localStorage.getItem(
      CACHE_META_KEY
    ) || "";

  } catch (e) {

    return "";

  }

}


function saveCachedSignature(
  signature
) {

  try {

    localStorage.setItem(
      CACHE_META_KEY,
      signature
    );

  } catch (e) {}

}


/* =========================================================
   LOAD MODELS
   ========================================================= */

async function loadModels() {

  if (modelsLoaded) {

    return;

  }


  setStatus(
    "LOADING FACE MODEL..."
  );


  await faceapi.nets
    .tinyFaceDetector
    .loadFromUri(
      MODEL_URL
    );


  await faceapi.nets
    .faceLandmark68TinyNet
    .loadFromUri(
      MODEL_URL
    );


  await faceapi.nets
    .faceRecognitionNet
    .loadFromUri(
      MODEL_URL
    );


  modelsLoaded = true;

}


/* =========================================================
   GET FACE DATABASE LIST
   ========================================================= */

async function getFaceDatabase() {

  return await apiRequest(
    "faces",
    {},
    30000
  );

}


/* =========================================================
   GET PHOTO
   ========================================================= */

async function getFacePhoto(row) {

  return await apiRequest(
    "photo",
    {
      row: row
    },
    30000
  );

}


/* =========================================================
   CREATE MATCHER FROM CACHE
   ========================================================= */

function createMatcherFromCache(
  cached
) {

  const labeledDescriptors = [];


  cached.forEach(
    function(item) {

      try {

        const descriptor =
          new Float32Array(
            item.descriptor
          );


        labeledDescriptors.push(

          new faceapi.LabeledFaceDescriptors(

            String(
              item.employeeId
            ),

            [
              descriptor
            ]

          )

        );

      } catch (error) {

        console.error(
          "CACHE DESCRIPTOR ERROR:",
          item.employeeId,
          error
        );

      }

    }
  );


  if (
    labeledDescriptors.length === 0
  ) {

    return null;

  }


  return new faceapi.FaceMatcher(
    labeledDescriptors,
    MATCH_THRESHOLD
  );

}


/* =========================================================
   BUILD DATABASE
   FIRST TIME ONLY
   ========================================================= */

async function buildFaceDatabase(
  employeesList
) {

  setStatus(
    "PREPARING 250 FACE DATABASE..."
  );


  const labeledDescriptors = [];


  const CONCURRENCY = 8;

  let nextIndex = 0;

  let completed = 0;


  async function worker() {

    while (true) {

      const index =
        nextIndex++;


      if (
        index >=
        employeesList.length
      ) {

        return;

      }


      const employee =
        employeesList[index];


      const employeeId =
        String(
          employee.employeeId || ""
        ).trim();


      const employeeName =
        String(
          employee.name || ""
        ).trim();


      try {

        const photo =
          await getFacePhoto(
            employee.row
          );


        if (
          photo &&
          photo.ok &&
          photo.image
        ) {

          const image =
            await faceapi.fetchImage(
              photo.image
            );


          const detection =
            await faceapi
              .detectSingleFace(
                image,
                new faceapi
                  .TinyFaceDetectorOptions({
                    inputSize:
                      DETECTOR_INPUT_SIZE,

                    scoreThreshold:
                      0.5
                  })
              )
              .withFaceLandmarks(true)
              .withFaceDescriptor();


          if (detection) {

            labeledDescriptors.push({

              employeeId:
                employeeId,

              name:
                employeeName,

              descriptor:
                Array.from(
                  detection.descriptor
                )

            });

          }

        }

      } catch (error) {

        console.error(
          "PHOTO ERROR:",
          employeeId,
          error
        );

      }


      completed++;


      setStatus(
        "PROCESSING FACE " +
        completed +
        "/" +
        employeesList.length
      );

    }

  }


  const workers = [];


  const workerCount =
    Math.min(
      CONCURRENCY,
      employeesList.length
    );


  for (
    let i = 0;
    i < workerCount;
    i++
  ) {

    workers.push(
      worker()
    );

  }


  await Promise.all(
    workers
  );


  if (
    labeledDescriptors.length === 0
  ) {

    throw new Error(
      "NO FACE DESCRIPTOR FOUND"
    );

  }


  /*
   * Save every descriptor
   * into IndexedDB.
   */

  setStatus(
    "SAVING FACE CACHE..."
  );


  await clearFaceCache();


  for (
    const item of
    labeledDescriptors
  ) {

    await saveDescriptorToCache(
      item.employeeId,
      item.name,
      item.descriptor
    );

  }


  /*
   * Save database signature.
   */

  saveCachedSignature(
    makeDatabaseSignature(
      employeesList
    )
  );


  /*
   * Build matcher.
   */

  faceMatcher =
    createMatcherFromCache(
      await getAllCachedDescriptors()
    );


  if (!faceMatcher) {

    throw new Error(
      "FACE CACHE FAILED"
    );

  }


  databaseLoaded = true;


  databaseInfo.innerText =
    "FACE READY: " +
    labeledDescriptors.length +
    " / " +
    employeesList.length +
    " EMPLOYEE";


  setStatus(
    "FACE DATABASE READY"
  );

}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadDatabase() {

  if (databaseLoaded) {

    return;

  }


  /*
   * Get employee list first.
   *
   * This is very small compared with
   * downloading 250 photos.
   */

  const data =
    await getFaceDatabase();


  if (
    !data ||
    !data.ok
  ) {

    throw new Error(
      data &&
      data.message
        ? data.message
        : "FACE DATABASE ERROR"
    );

  }


  employees =
    Array.isArray(
      data.faces
    )
      ? data.faces
      : [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "NO EMPLOYEE PHOTO FOUND"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  /*
   * Check IndexedDB.
   */

  const signature =
    makeDatabaseSignature(
      employees
    );


  const oldSignature =
    getCachedSignature();


  const cached =
    await getAllCachedDescriptors();


  /*
   * CACHE VALID
   */

  if (
    oldSignature === signature &&
    cached.length === employees.length
  ) {

    faceMatcher =
      createMatcherFromCache(
        cached
      );


    if (faceMatcher) {

      databaseLoaded = true;


      databaseInfo.innerText =
        "FACE CACHE READY: " +
        cached.length +
        " / " +
        employees.length +
        " EMPLOYEE";


      setStatus(
        "FACE SYSTEM READY"
      );


      return;

    }

  }


  /*
   * CACHE INVALID
   *
   * Build again.
   */

  await buildFaceDatabase(
    employees
  );

}


/* =========================================================
   PRELOAD
   ========================================================= */

async function preloadFaceSystem() {

  if (preloadPromise) {

    return preloadPromise;

  }


  preloadPromise =
    (async function() {

      try {

        setStatus(
          "PREPARING FACE SYSTEM..."
        );


        /*
         * Models and database
         * can load in parallel.
         */

        await Promise.all([

          loadModels(),

          loadDatabase()

        ]);


        setStatus(
          "FACE SYSTEM READY"
        );


      } catch (error) {

        preloadPromise = null;


        console.error(
          "PRELOAD ERROR:",
          error
        );


        setStatus(
          "FACE SYSTEM ERROR"
        );


        resultBox.innerText =
          error.message ||
          "FACE SYSTEM ERROR";


        throw error;

      }

    })();


  return preloadPromise;

}


/* =========================================================
   GET CURRENT TARGET
   ========================================================= */

async function getCurrentTarget() {

  return await apiRequest(
    "target",
    {},
    10000
  );

}


/* =========================================================
   SET TARGET FROM URL
   ========================================================= */

async function setTargetFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const sheet =
    params.get("sheet");


  const row =
    params.get("row");


  const column =
    params.get("column");


  if (
    !sheet ||
    !row ||
    !column
  ) {

    return false;

  }


  try {

    const result =
      await apiRequest(
        "setTarget",
        {
          sheet:
            sheet,

          row:
            row,

          column:
            column
        },
        15000
      );


    if (
      !result ||
      !result.ok
    ) {

      resultBox.innerText =
        result &&
        result.message
          ? result.message
          : "GAGAL SET TARGET";


      return false;

    }


    currentTarget = {

      sheet:
        sheet,

      row:
        Number(row),

      column:
        Number(column)

    };


    return true;


  } catch (error) {

    console.error(
      "SET TARGET ERROR:",
      error
    );


    resultBox.innerText =
      error.message ||
      "GAGAL SET TARGET";


    return false;

  }

}


/* =========================================================
   TARGET CHECK
   ========================================================= */

async function checkTarget() {

  if (targetChecking) {

    return;

  }


  targetChecking = true;


  try {

    const data =
      await getCurrentTarget();


    if (
      !data ||
      !data.ok
    ) {

      return;

    }


    if (
      !data.ready
    ) {

      return;

    }


    if (
      !data.sheet ||
      !data.row ||
      !data.column
    ) {

      return;

    }


    const allowedFaceColumns = [

      1,
      5,
      20,
      24,
      31,
      35

    ];


    if (
      allowedFaceColumns.indexOf(
        Number(data.column)
      ) === -1
    ) {

      return;

    }


    const newKey =
      data.sheet +
      "|" +
      data.row +
      "|" +
      data.column;


    const oldKey =
      currentTarget
        ? currentTarget.sheet +
          "|" +
          currentTarget.row +
          "|" +
          currentTarget.column

        : "";


    if (
      newKey !== oldKey
    ) {

      /*
       * New target.
       */

      if (scanning) {

        stopCamera();

      }


      scanLocked = false;

      stableCount = 0;

      lastEmployee = "";


      currentTarget = {

        sheet:
          data.sheet,

        row:
          Number(data.row),

        column:
          Number(data.column)

      };


      const columnNames = {

        1:
          "A",

        5:
          "E",

        20:
          "T",

        24:
          "X",

        31:
          "AE",

        35:
          "AI"

      };


      const columnName =
        columnNames[
          Number(data.column)
        ] || "?";


      targetInfo.innerText =
        "TARGET: " +
        data.sheet +
        "!" +
        columnName +
        data.row;


      resultBox.innerText =
        "";


      distanceBox.innerText =
        "";


      /*
       * Camera starts automatically.
       */

      await startCamera();

    }

  } catch (error) {

    console.log(
      "TARGET CHECK ERROR:",
      error.message
    );

  } finally {

    targetChecking = false;

  }

}


/* =========================================================
   TARGET MONITOR
   ========================================================= */

function startTargetMonitor() {

  checkTarget();


  targetMonitor =
    setInterval(
      checkTarget,
      TARGET_CHECK_INTERVAL
    );

}


/* =========================================================
   SEND SCAN
   ========================================================= */

async function sendScanToSheet(
  employeeId,
  employeeName
) {

  return await apiRequest(
    "scan",
    {

      employeeId:
        employeeId,

      employeeName:
        employeeName

    },
    15000
  );

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  if (scanning) {

    return;

  }


  try {

    /*
     * Database should already be
     * preloaded.
     */

    await preloadFaceSystem();


    setStatus(
      "STARTING CAMERA..."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ) {

      throw new Error(
        "BROWSER TIDAK MENDUKUNG CAMERA"
      );

    }


    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              "user",

            width: {

              ideal:
                CAMERA_WIDTH

            },

            height: {

              ideal:
                CAMERA_HEIGHT

            }

          },

          audio:
            false

        });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning = true;

    scanLocked = false;

    stableCount = 0;

    lastEmployee = "";


    setStatus(
      "LOOK AT THE CAMERA"
    );


    scanFace();


  } catch (error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    scanning = false;


    setStatus(
      "CAMERA ERROR"
    );


    resultBox.innerText =
      error.message ||
      "CAMERA ERROR";

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  scanning = false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  cameraStream =
    null;


  video.srcObject =
    null;


  video.style.display =
    "none";


  placeholder.style.display =
    "block";


  placeholder.innerText =
    "WAITING FOR TARGET...";


  stableCount = 0;

  lastEmployee = "";

}


/* =========================================================
   FACE SCAN
   ========================================================= */

async function scanFace() {

  if (!scanning) {

    return;

  }


  try {

    if (!faceMatcher) {

      setStatus(
        "FACE DATABASE NOT READY"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    const detection =
      await faceapi
        .detectSingleFace(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize:
                DETECTOR_INPUT_SIZE,

              scoreThreshold:
                0.5

            })

        )
        .withFaceLandmarks(true)
        .withFaceDescriptor();


    /*
     * NO FACE
     */

    if (!detection) {

      resultBox.innerText =
        "NO FACE";


      distanceBox.innerText =
        "";


      stableCount = 0;

      lastEmployee = "";


      setStatus(
        "LOOK AT THE CAMERA"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /*
     * MATCH FACE
     */

    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    const employeeId =
      bestMatch.label;


    const distance =
      bestMatch.distance;


    distanceBox.innerText =
      "DISTANCE: " +
      distance.toFixed(4);


    /*
     * UNKNOWN
     */

    if (
      employeeId === "unknown"
    ) {

      resultBox.innerText =
        "FACE NOT MATCHED";


      stableCount = 0;

      lastEmployee = "";


      setStatus(
        "FACE NOT MATCHED"
      );


      setTimeout(
        scanFace,
        SCAN_INTERVAL
      );


      return;

    }


    /*
     * FIND NAME
     */

    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ) === String(
            employeeId
          );

        }
      );


    const employeeName =
      employee
        ? employee.name
        : "";


    /*
     * STABLE MATCH
     */

    if (
      lastEmployee ===
      employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;

      stableCount = 1;

    }


    resultBox.innerText =
      employeeId +
      " - " +
      employeeName;


    setStatus(
      "MATCH " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH
    );


    /*
     * VERIFIED
     */

    if (
      stableCount >=
        REQUIRED_STABLE_MATCH &&
      !scanLocked
    ) {

      scanLocked = true;


      const targetAtScan =
        currentTarget
          ? {

              sheet:
                currentTarget.sheet,

              row:
                currentTarget.row,

              column:
                currentTarget.column

            }

          : null;


      if (!targetAtScan) {

        scanLocked = false;

        return;

      }


      setStatus(
        "FACE VERIFIED"
      );


      resultBox.innerText =
        "✓ " +
        employeeId +
        " - " +
        employeeName;


      try {

        const result =
          await sendScanToSheet(
            employeeId,
            employeeName
          );


        if (
          result &&
          result.ok
        ) {

          const employeeColumns = [

            1,
            20,
            31

          ];


          const isEmployeeScan =
            employeeColumns.indexOf(
              Number(
                targetAtScan.column
              )
            ) !== -1;


          if (
            isEmployeeScan
          ) {

            resultBox.innerText =
              "✓ EMPLOYEE SAVED\n" +
              employeeId +
              " - " +
              employeeName;


            setStatus(
              "EMPLOYEE SCAN COMPLETED"
            );

          } else {

            resultBox.innerText =
              "✓ TIME IN SAVED\n" +
              employeeName +
              "\n" +
              (
                result.timeIn ||
                ""
              );


            setStatus(
              "TIME IN COMPLETED"
            );

          }


          /*
           * Camera OFF after success.
           */

          stopCamera();


          currentTarget =
            null;


          stableCount = 0;

          lastEmployee = "";


        } else {

          /*
           * Scan rejected.
           *
           * Important:
           * camera stays ON.
           */

          scanLocked = false;


          setStatus(
            "SCAN REJECTED"
          );


          resultBox.innerText =
            result &&
            (
              result.message ||
              result.error
            )
              ? (
                  result.message ||
                  result.error
                )

              : "SCAN REJECTED";


          stableCount = 0;

          lastEmployee = "";


          /*
           * Retry automatically.
           */

          if (scanning) {

            setTimeout(
              scanFace,
              700
            );

          }


          return;

        }


      } catch (error) {

        scanLocked = false;


        setStatus(
          "SCAN ERROR"
        );


        resultBox.innerText =
          error.message ||
          "GAGAL SIMPAN";


        console.error(
          "SAVE ERROR:",
          error
        );


        /*
         * Retry.
         */

        stableCount = 0;

        lastEmployee = "";


        if (scanning) {

          setTimeout(
            scanFace,
            700
          );

        }


        return;

      }


      return;

    }


  } catch (error) {

    console.error(
      "FACE SCAN ERROR:",
      error
    );

  }


  /*
   * Continue scanning.
   */

  if (scanning) {

    setTimeout(
      scanFace,
      SCAN_INTERVAL
    );

  }

}


/* =========================================================
   OPTIONAL CACHE RESET
   ========================================================= */

window.resetFaceCache =
  async function() {

    try {

      await clearFaceCache();

      localStorage.removeItem(
        CACHE_META_KEY
      );


      databaseLoaded =
        false;


      faceMatcher =
        null;


      employees = [];


      preloadPromise =
        null;


      databaseInfo.innerText =
        "FACE CACHE CLEARED";


      setStatus(
        "CACHE CLEARED - RELOAD PAGE"
      );


    } catch (error) {

      console.error(
        "CACHE CLEAR ERROR:",
        error
      );

    }

  };


/* =========================================================
   MANUAL CAMERA BUTTON
   ========================================================= */

if (startButton) {

  startButton.addEventListener(
    "click",
    function() {

      if (!scanning) {

        startCamera();

      }

    }
  );

}


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  "load",
  async function() {

    setStatus(
      "PREPARING FACE SYSTEM..."
    );


    targetInfo.innerText =
      "WAITING FOR TARGET";


    databaseInfo.innerText =
      "LOADING FACE DATABASE...";


    /*
     * IMPORTANT:
     *
     * Start loading models +
     * cached database immediately.
     */

    preloadFaceSystem()
      .catch(
        function(error) {

          console.error(
            "FACE SYSTEM ERROR:",
            error
          );

        }
      );


    /*
     * Start target monitor.
     *
     * When A/E/T/X/AE/AI is selected,
     * camera will start automatically.
     */

    startTargetMonitor();

  }
);

</script>
