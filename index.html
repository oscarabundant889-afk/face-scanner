<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>FACE SCANNER</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 25px 0 20px 0;
  font-size: 40px;
}

#cameraBox {
  width: 90%;
  max-width: 900px;
  margin: auto;
  background: #222;
  border-radius: 15px;
  overflow: hidden;
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#video {
  width: 100%;
  display: none;
  transform: scaleX(-1);
}

#placeholder {
  font-size: 30px;
  color: #aaa;
  padding: 100px 20px;
}

#status {
  margin-top: 25px;
  font-size: 28px;
  font-weight: bold;
}

#result {
  margin-top: 15px;
  font-size: 38px;
  font-weight: bold;
  min-height: 50px;
}

#distance {
  margin-top: 10px;
  font-size: 18px;
  color: #aaa;
}

#databaseInfo {
  margin-top: 15px;
  font-size: 18px;
  color: #aaa;
}

button {
  margin-top: 25px;
  padding: 16px 35px;
  font-size: 22px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>

</head>


<body>

<h1>FACE SCANNER</h1>


<div id="cameraBox">

  <div id="placeholder">
    CAMERA READY
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

</div>


<div id="status">
  READY
</div>


<div id="result">
</div>


<div id="distance">
</div>


<div id="databaseInfo">
</div>


<button
  id="startButton"
  style="display:none;">
  START CAMERA
</button>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzCtKYN4mfelCDJWXK5c3GUUompPX4Esl8TdLjOlqXYpSjX8dfLdh6sjgMTGTpzaY_mMg/exec";


const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";


const MATCH_THRESHOLD = 0.50;


const REQUIRED_STABLE_MATCH = 3;
/* =====================================================
   AUTO TARGET / AUTO CAMERA
===================================================== */

let currentTarget = null;

let targetChecking = false;

let autoCameraStarted = false;


/* =====================================================
   GET TARGET DARI GOOGLE SHEET
===================================================== */

function getCurrentTarget() {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "FACE_TARGET_CALLBACK_" +
        Date.now();


      const script =
        document.createElement("script");


      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                "TARGET API TIMEOUT"
              )
            );

          },
          10000
        );


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);

        };


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              "TARGET API CONNECTION ERROR"
            )
          );

        };


      script.src =
        API_URL +
        "?action=target" +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


      document.body.appendChild(
        script
      );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}


        if (script) {

          script.remove();

        }

      }

    }
  );

}


/* =====================================================
   CHECK TARGET TERUS-MENERUS
===================================================== */

async function checkTarget() {

  if (targetChecking) {
    return;
  }


  targetChecking = true;


  try {

    const data =
      await getCurrentTarget();


    if (
      !data ||
      !data.ok
    ) {

      return;
    }


    if (
      !data.ready
    ) {

      return;
    }


    if (
      !data.sheet ||
      !data.row ||
      !data.column
    ) {

      return;
    }


    /*
      HANYA A DAN E
    */

    if (
      data.column !== 1 &&
      data.column !== 5
    ) {

      return;
    }


    const newTarget =
      data.sheet +
      "|" +
      data.row +
      "|" +
      data.column;


    const oldTarget =
      currentTarget
        ? currentTarget.sheet +
          "|" +
          currentTarget.row +
          "|" +
          currentTarget.column
        : "";


    /*
      TARGET BARU
    */

    if (
      newTarget !== oldTarget
    ) {

      currentTarget = {

        sheet:
          data.sheet,

        row:
          data.row,

        column:
          data.column
      };


      /*
        RESET CAMERA STATE
      */

      autoCameraStarted =
        false;


      /*
        TAMPILKAN TARGET
      */

      resultBox.innerText =
        "TARGET: " +
        data.sheet +
        "!" +
        (
          data.column === 1
            ? "A"
            : "E"
        ) +
        data.row;


      /*
        CAMERA OTOMATIS
      */

      if (
        !scanning &&
        !autoCameraStarted
      ) {

        autoCameraStarted =
          true;


        await startCamera();

      }

    }

  } catch (error) {

    console.log(
      "TARGET CHECK:",
      error.message
    );

  } finally {

    targetChecking =
      false;

  }

}


/* =====================================================
   START TARGET MONITOR
===================================================== */

function startTargetMonitor() {

  /*
    Cek pertama
  */

  checkTarget();


  /*
    Cek setiap 1 detik
  */

  setInterval(
    checkTarget,
    1000
  );

}
      


/*
   Jeda setelah berhasil scan.
   Mencegah orang yang sama tercatat berkali-kali.
*/

const SCAN_COOLDOWN = 5000;


/* =====================================================
   ELEMENT
===================================================== */

const video =
document.getElementById("video");


const placeholder =
document.getElementById("placeholder");


const statusBox =
document.getElementById("status");


const resultBox =
document.getElementById("result");


const distanceBox =
document.getElementById("distance");


const databaseInfo =
document.getElementById("databaseInfo");


const startButton =
document.getElementById("startButton");


/* =====================================================
   VARIABLES
===================================================== */

let faceMatcher = null;

let employees = [];

let cameraStream = null;

let scanning = false;

let lastEmployee = "";

let stableCount = 0;

let scanLocked = false;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  statusBox.innerText =
    message;

}


/* =====================================================
   GET FACE DATABASE
===================================================== */

function getFaceDatabase() {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_DATABASE_CALLBACK_" +
      Date.now();

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "FACE API TIMEOUT"
          )
        );

      }, 30000);


    window[callbackName] =
      function(data) {

        cleanup();

        if (!data) {

          reject(
            new Error(
              "FACE API TIDAK MEMBERIKAN DATA"
            )
          );

          return;

        }

        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "FACE API CONNECTION ERROR"
          )
        );

      };


    script.src =
      API_URL +
      "?action=faces" +
      "&callback=" +
      callbackName +
      "&t=" +
      Date.now();


    document.body.appendChild(
      script
    );


    function cleanup() {

      clearTimeout(timeout);

      try {

        delete window[callbackName];

      } catch (e) {}

      if (script) {

        script.remove();

      }

    }

  });

}


/* =====================================================
   LOAD FACE MODELS
===================================================== */

async function loadModels() {

  setStatus(
    "LOADING FACE MODEL..."
  );


  await faceapi.nets.tinyFaceDetector.loadFromUri(
    MODEL_URL
  );


  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
    MODEL_URL
  );


  await faceapi.nets.faceRecognitionNet.loadFromUri(
    MODEL_URL
  );

}


/* =====================================================
   LOAD PHOTO DATABASE
===================================================== */

async function loadDatabase() {

  setStatus(
    "LOADING PHOTO DATABASE..."
  );


  const data =
    await getFaceDatabase();


  if (!data.ok) {

    throw new Error(
      data.message ||
      "FACE DATABASE ERROR"
    );

  }


  employees =
    Array.isArray(data.faces)
      ? data.faces
      : [];


  if (
    employees.length === 0
  ) {

    throw new Error(
      "TIDAK ADA FOTO EMPLOYEE"
    );

  }


  databaseInfo.innerText =
    "PHOTO DATABASE: " +
    employees.length +
    " EMPLOYEE";


  const labeledDescriptors = [];


  for (
    let i = 0;
    i < employees.length;
    i++
  ) {

    const employee =
      employees[i];


    const employeeId =
      String(
        employee.employeeId || ""
      ).trim();


    const employeeName =
      String(
        employee.name || ""
      ).trim();


    setStatus(
      "LOADING PHOTO " +
      (i + 1) +
      "/" +
      employees.length +
      " | " +
      employeeId +
      " - " +
      employeeName
    );


    try {

      const photo =
        await getFacePhoto(
          employee.row
        );


      if (!photo.ok) {

        continue;

      }


      const image =
        await faceapi.fetchImage(
          photo.image
        );


      const detection =
        await faceapi
          .detectSingleFace(
            image,
            new faceapi.TinyFaceDetectorOptions({

              inputSize: 320,

              scoreThreshold: 0.5

            })
          )
          .withFaceLandmarks(true)
          .withFaceDescriptor();


      if (!detection) {

        continue;

      }


      labeledDescriptors.push(

        new faceapi.LabeledFaceDescriptors(

          employeeId,

          [
            detection.descriptor
          ]

        )

      );

    } catch (error) {

      console.error(
        "PHOTO PROCESS ERROR:",
        employeeId,
        error
      );

    }

  }


  if (
    labeledDescriptors.length === 0
  ) {

    throw new Error(
      "TIDAK ADA FOTO YANG BERHASIL DIPROSES"
    );

  }


  faceMatcher =
    new faceapi.FaceMatcher(
      labeledDescriptors,
      MATCH_THRESHOLD
    );


  databaseInfo.innerText =
    "FACE READY: " +
    labeledDescriptors.length +
    " EMPLOYEE";


  setStatus(
    "DATABASE READY"
  );

}


/* =====================================================
   GET PHOTO
===================================================== */

function getFacePhoto(row) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_PHOTO_CALLBACK_" +
      Date.now();


    const script =
      document.createElement("script");


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "PHOTO API TIMEOUT"
          )
        );

      }, 30000);


    window[callbackName] =
      function(data) {

        cleanup();

        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "PHOTO API CONNECTION ERROR"
          )
        );

      };


    script.src =
      API_URL +
      "?action=photo" +
      "&row=" +
      encodeURIComponent(row) +
      "&callback=" +
      callbackName +
      "&t=" +
      Date.now();


    document.body.appendChild(
      script
    );


    function cleanup() {

      clearTimeout(timeout);

      try {

        delete window[callbackName];

      } catch (e) {}

      script.remove();

    }

  });

}


/* =====================================================
   SEND SCAN TO GOOGLE SHEET
===================================================== */

function sendScanToSheet(
  employeeId,
  employeeName
) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "FACE_SCAN_CALLBACK_" +
      Date.now();


    const script =
      document.createElement("script");


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "SCAN API TIMEOUT"
          )
        );

      }, 15000);


    window[callbackName] =
      function(data) {

        cleanup();

        if (!data) {

          reject(
            new Error(
              "SCAN API TIDAK MEMBERIKAN DATA"
            )
          );

          return;

        }

        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "SCAN API CONNECTION ERROR"
          )
        );

      };


    script.src =
      API_URL +
      "?action=scan" +
      "&employeeId=" +
      encodeURIComponent(employeeId) +
      "&employeeName=" +
      encodeURIComponent(employeeName) +
      "&callback=" +
      callbackName +
      "&t=" +
      Date.now();


    document.body.appendChild(
      script
    );


    function cleanup() {

      clearTimeout(timeout);

      try {

        delete window[callbackName];

      } catch (e) {}

      script.remove();

    }

  });

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  try {

    setStatus(
      "BUTTON CLICKED..."
    );


    startButton.disabled =
      true;


    await loadModels();


    await loadDatabase();


    setStatus(
      "STARTING CAMERA..."
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    await video.play();


    scanning =
      true;


    setStatus(
      "SCANNING..."
    );


    scanFace();


  } catch (error) {

    console.error(
      "START CAMERA ERROR:",
      error
    );


    setStatus(
      "ERROR"
    );


    resultBox.innerText =
      error.message ||
      "CAMERA ERROR";


    startButton.disabled =
      false;

  }

}


/* =====================================================
   FACE SCANNER
===================================================== */

async function scanFace() {

  if (!scanning) {

    return;

  }


  try {

    const detection =
      await faceapi
        .detectSingleFace(

          video,

          new faceapi.TinyFaceDetectorOptions({

            inputSize: 320,

            scoreThreshold: 0.5

          })

        )
        .withFaceLandmarks(true)
        .withFaceDescriptor();


    if (!detection) {

      resultBox.innerText =
        "NO FACE";


      distanceBox.innerText =
        "";


      lastEmployee =
        "";


      stableCount =
        0;


      setStatus(
        "SCANNING..."
      );


      setTimeout(
        scanFace,
        300
      );


      return;

    }


    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    const employeeId =
      bestMatch.label;


    const distance =
      bestMatch.distance;


    distanceBox.innerText =
      "DISTANCE: " +
      distance.toFixed(4);


    if (
      employeeId === "unknown"
    ) {

      resultBox.innerText =
        "UNKNOWN";


      lastEmployee =
        "";


      stableCount =
        0;


      setStatus(
        "FACE NOT MATCHED"
      );


      setTimeout(
        scanFace,
        300
      );


      return;

    }


    const employee =
      employees.find(
        function(item) {

          return String(
            item.employeeId
          ) === String(
            employeeId
          );

        }
      );


    const employeeName =
      employee
        ? employee.name
        : "";


    if (
      lastEmployee === employeeId
    ) {

      stableCount++;

    } else {

      lastEmployee =
        employeeId;

      stableCount =
        1;

    }


    resultBox.innerText =
      employeeId +
      " - " +
      employeeName;


    setStatus(
      "MATCH " +
      stableCount +
      "/" +
      REQUIRED_STABLE_MATCH
    );


    /* =================================================
       FACE VERIFIED
    ================================================= */

    if (
      stableCount >=
      REQUIRED_STABLE_MATCH &&
      !scanLocked
    ) {

      scanLocked =
        true;


      setStatus(
        "FACE VERIFIED"
      );


      resultBox.innerText =
        "✓ " +
        employeeId +
        " - " +
        employeeName;


      try {

        const result =
          await sendScanToSheet(
            employeeId,
            employeeName
          );


        if (result.ok) {

          resultBox.innerText =
            "✓ " +
            employeeId +
            " - " +
            employeeName +
            "\nTIME IN: " +
            result.timeIn;


          setStatus(
            "SCAN SAVED"
          );


          console.log(
            "SCAN SAVED:",
            result
          );


        } else {

          setStatus(
            "SHEET ERROR"
          );


          resultBox.innerText =
            result.message ||
            "GAGAL SIMPAN";

        }


      } catch (error) {

        setStatus(
          "SCAN ERROR"
        );


        resultBox.innerText =
          error.message ||
          "GAGAL SIMPAN";


        console.error(
          "SAVE ERROR:",
          error
        );

      }


      stableCount =
        0;


      lastEmployee =
        "";


      /*
        Setelah 5 detik,
        scanner bisa mengenali orang berikutnya.
      */

      setTimeout(
        function() {

          scanLocked =
            false;

          setStatus(
            "SCANNING..."
          );

        },
        SCAN_COOLDOWN
      );

    }


  } catch (error) {

    console.error(
      "SCAN ERROR:",
      error
    );

  }


  if (scanning) {

    setTimeout(
      scanFace,
      300
    );

  }

}
      /* =====================================================
   AUTO TARGET MONITOR START
===================================================== */

window.addEventListener(
  "load",
  function() {

    startTargetMonitor();

  }
);

</script>

</body>

</html>
